{% include 'overall_header.html' %}

<form id="confirm" action="{{ S_CONFIRM_ACTION }}" method="post">
	<div class="side-segment"><h3>{{ MESSAGE_TITLE }}</h3></div>
	
	<div class="well">
		<div class="control-group"> 
			<label class="control-label">{{ lang('CHAT_DEST_ROOM') ~ lang('COLON') }}</label>
			<div class="controls controls-row">
				<select name="to_room_id" class="selectpicker" data-width="auto">{{ S_ROOM_OPTIONS }}</select>
			</div> 
			<div class="space10"></div>
		</div>

		<p>{{ MESSAGE_TEXT }}</p>
		<fieldset>
			{{ S_HIDDEN_FIELDS }}
			<button type="submit" name="confirm" value="{{ lang('YES') }}" class="btn btn-default">{{ lang('YES') }}</button>
			<button type="submit" name="cancel" value="{{ lang('NO') }}" class="btn btn-default">{{ lang('NO') }}</button>
			{{ S_FORM_TOKEN }}
		</fieldset>
	</div>
</form>

{% include 'overall_footer.html' %}
