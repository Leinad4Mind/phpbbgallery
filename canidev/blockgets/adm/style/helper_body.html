
<!-- IF HELPER_NAME eq 'icon' -->

	<div class="blg-icon-container js-container<!-- IF not IT_VALUE --> blg-helper-hidden<!-- ENDIF -->">
	<!-- IF IT_VALUE -->
		<!-- IF IT_TYPE eq 'icon' -->
		<span class="blg-icon {IT_VALUE}"></span>
		<!-- ELSEIF IT_TYPE eq 'image' -->
		<img src="{IT_FILENAME}" alt="" />
		<!-- ENDIF -->
	<!-- ENDIF -->
	</div>
	<a class="blg-button<!-- IF IT_VALUE eq '' --> blg-helper-hidden<!-- ENDIF --> js-delete-{IT_ID}" href="#">{IT_LABEL_DELETE}</a>
	<a class="blg-button js-dialog-{IT_ID}" href="#">{IT_LABEL_DIALOG}</a>
	<input type="hidden" name="config[{IT_KEY}]" value="{IT_VALUE}" />
	
	<script type="text/javascript">
	// <![CDATA[
	<!-- IF IS_BLG_AJAX -->
		jblockgets(function($) {
	<!-- ELSE -->
		window._jBlg = window._jBlg || [];
		window._jBlg.push(function() {
	<!-- ENDIF -->
			$.jblockgets.bindIconTemplate('{IT_ID}', '{IT_TYPE}');
		});
	// ]]>
	</script>

<!-- ELSEIF HELPER_NAME eq 'editor' -->

	<textarea id="{IT_ID}" name="config[{IT_KEY}]" cols="{IT_COLS}" rows="{IT_ROWS}">{IT_VALUE}</textarea>
	<p class="quick"><a href="#" class="blg-button js-dialog-{IT_ID}">{L_BLG_FULL_EDITOR}</a></p>
	
	<script type="text/javascript">
	// <![CDATA[
		window._jBlg = window._jBlg || [];
		window._jBlg.push(function() {
			$.jblockgets.bindEditorTemplate('{IT_ID}');
		});
	// ]]>
	</script>

<!-- ELSEIF HELPER_NAME eq 'easy_input' -->

	<div class="blg-group js-group-{HP_ID}">
		<input id="{HP_KEY}" type="text" class="blg-inputbox" size="40" maxlength="255" name="config[{HP_KEY}]" value="{HP_VALUE}" />
		
		<!-- IF COLOR_BTN --><button class="js-color blg-button" title="{L_SELECT_COLOUR}"<!-- IF IS_COLOR --> value="{HP_VALUE}"<!-- ENDIF --->><span class="color-preview"></span></button><!-- ENDIF -->
		<!-- IF GALLERY_BTN --><button class="js-gallery blg-button" title="{L_OPEN_GALLERY}">{L_GALLERY}</button><!-- ENDIF -->
	</div>
	
	<script type="text/javascript">
	// <![CDATA[
		window._jBlg = window._jBlg || [];
		window._jBlg.push(function() {
			$.jblockgets.bindEasyInput('{HP_ID}');
		});
	// ]]>
	</script>
	
<!-- ELSEIF HELPER_NAME eq 'size_formatter' -->

	<div class="blg-group js-group-{HP_ID}">
		<input id="{HP_KEY}" type="text" class="blg-inputbox autowidth" size="5" maxlength="4" name="config[{HP_KEY}]" value="{HP_VALUE}" />
		
		<select name="config[{HP_KEY}_type]" class="blg-inputbox">{HP_OPTIONS}</select>
	</div>

<!-- ENDIF -->
