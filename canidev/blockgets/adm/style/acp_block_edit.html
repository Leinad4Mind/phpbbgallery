<!-- INCLUDE overall_header.html -->

<!-- IF U_BACK --><div class="blg-align-right floated"><a href="{U_BACK}" class="blg-button">&laquo; {L_BACK}</a></div><!-- ENDIF -->

<h1>{L_TITLE}</h1>
<p>{L_TITLE_EXPLAIN}</p>

<form id="acp_block_form" name="acp_block_form" method="post" action="{U_ACTION}">

<!-- BEGIN options -->
	<!-- IF options.S_LEGEND -->
		<!-- IF not options.S_FIRST_ROW -->
			</fieldset>
		<!-- ENDIF -->
		<fieldset>
			<legend>{options.LEGEND}</legend>
	<!-- ELSE -->

		<dl>
			<dt><label for="{options.KEY}">{options.TITLE}:</label><!-- IF options.S_EXPLAIN --><br /><span>{options.S_EXPLAIN}</span><!-- ENDIF --></dt>
			<dd>{options.CONTENT}</dd>
		</dl>

	<!-- ENDIF -->
<!-- END options -->

</fieldset>

<!-- IF not HAS_CONFIG and not HAS_LINKS -->
	<div class="blg-message blg-state-ok">{L_BLOCK_NO_CONFIG}</div>
<!-- ELSE -->
<div class="block-config-tabs">
	<ul>
		<!-- IF HAS_CONFIG --><li><a href="#block-config-tab">{L_CONFIG}</a></li><!-- ENDIF -->
		<!-- IF HAS_LINKS --><li><a href="#block-links-tab">{S_LINKS_TITLE}</a></li><!-- ENDIF -->
	</ul>
	
<!-- IF HAS_CONFIG -->
	<div id="block-config-tab">
	<!-- IF CONFIG_TEMPLATE -->
		<!-- INCLUDE {CONFIG_TEMPLATE} -->
	<!-- ELSE -->
		<fieldset>
		<!-- BEGIN config -->
			<dl>
				<dt><label for="{options.KEY}">{config.TITLE}:</label><!-- IF config.S_EXPLAIN --><br /><span>{config.S_EXPLAIN}</span><!-- ENDIF --></dt>
				<dd>{config.CONTENT}</dd>
			</dl>
		<!-- END config -->
		</fieldset>
	<!-- ENDIF -->
	</div>
<!-- ENDIF -->

<!-- IF HAS_LINKS -->
	<div id="block-links-tab">
		<!-- INCLUDE acp_list_edit.html -->
	</div>
<!-- ENDIF -->

</div>
<!-- ENDIF -->

	<div class="blg-submit-buttons">
		<!-- IF S_ADD_MODE -->&nbsp;<input class="blg-button" type="submit" name="submitmore" value="{L_SAVE_AND_ADD}" /><!-- ENDIF -->
		<input class="blg-button default-action" type="submit" name="submit" value="{L_SAVE}" />
		{S_HIDDEN_FIELDS}
	</div>
</form>

<!-- INCLUDE overall_footer.html -->
