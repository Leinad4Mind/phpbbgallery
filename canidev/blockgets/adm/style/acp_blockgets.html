<!-- INCLUDE overall_header.html -->

<a name="maincontent"></a>

<!-- IF U_BACK --><div class="blg-align-right floated"><a href="{U_BACK}">&laquo; {L_BACK}</a></div><!-- ENDIF -->

<h1>{L_TITLE}</h1>
<p>{L_TITLE_EXPLAIN}</p>

<form id="acp_blockgets" method="post" action="{U_ACTION}">
<!-- BEGIN options -->
	<!-- IF options.S_LEGEND -->
		<!-- IF not options.S_FIRST_ROW -->
			</fieldset>
		<!-- ENDIF -->
		<fieldset>
			<legend>{options.LEGEND}</legend>
	<!-- ELSE -->

		<dl>
			<dt><label for="{options.KEY}">{options.TITLE}{L_COLON}</label><!-- IF options.S_EXPLAIN --><br /><span>{options.S_EXPLAIN}</span><!-- ENDIF --></dt>
			<dd>{options.CONTENT}</dd>
		</dl>

	<!-- ENDIF -->
<!-- END options -->

</fieldset>

	<div class="cbb-submit-buttons">
		<input class="cbb-btn default-btn" type="submit" name="submit" value="{L_SAVE}" />
		{S_FORM_TOKEN}
		{S_HIDDEN_FIELDS}
	</div>
</form>

<!-- INCLUDE overall_footer.html -->
