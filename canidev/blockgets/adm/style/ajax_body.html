
<div id="confirm-box" title="{MESSAGE_TITLE}">
	<form action="{S_CONFIRM_ACTION}">
		<div class="cbb-dialog-content blg-align-center">
			<div>{L_EXPLAIN}<br /><br /></div>

			<!-- IF S_PAGE_OPTIONS --><select name="target_page_id" id="target-page-id" class="cbb-inputbox">{S_PAGE_OPTIONS}</select><br /><!-- ENDIF -->
			<!-- IF S_GROUP_SELECT -->{S_GROUP_SELECT}<!-- ENDIF -->
		</div>

		<div class="cbb-dialog-buttons">
			<button class="cbb-btn" value="submit" data-confirm="{YES_VALUE}">{L_ACCEPT}</button>
			<button class="cbb-btn" value="close">{L_CANCEL}</button>
			{S_HIDDEN_FIELDS}
		</div>
	</form>
</div>
