<div class="blg-modal-dialog media">
	<ul class="media-menu"></ul>

	<div class="media-frame-title">
		<h1></h1>
		<a href="#" data-action="close" class="blg-dialog-close">
			<span class="blg-icon blg-icon-remove"></span>
		</a>
	</div>

	<div class="media-frame-content">
		<div class="media-sidebar"></div>
		<div class="media-section-content js-section-content"></div>
	</div>
		
	<div class="media-frame-toolbar">
		<div class="media-toolbar-secondary blg-helper-hidden">
			<button type="button" class="blg-button blg-helper-hidden" data-action="copy" title="{L_COPY_TO_LIST}"><span class="blg-icon blg-icon-copy"></span></button>
			<button type="button" class="blg-button blg-helper-hidden" data-action="delete" title="{L_DELETE}"><span class="blg-icon blg-icon-trash"></span></button>
			<span class="count">{L_SELECTED_COUNT}</span>
		</div>
			
		<div class="media-toolbar-primary">
			<button type="button" class="blg-button" data-action="submit" disabled>{S_SUBMIT_LABEL}</button>
		</div>
	</div>

	<script type="text/html" id="tpl-menu-item">
		<li><a href="#"><span class="blg-icon <#icon#>"></span> <span class="item-title"><#title#></span></a></li>
	</script>

	<script type="text/html" id="tpl-attachment-row">
		<li role="checkbox" data-id="<#id#>" class="attachment">
			<div class="attachment-preview">
				<div class="thumbnail">
					<img src="<#filename#>" alt="" />
				</div>
			</div>

			<button type="button" class="button-link check">
				<span class="blg-icon blg-icon-check"></span>
			</button>
		</li>
	</script>
	
	<script type="text/html" id="tpl-icon-row">
		<li role="checkbox" data-id="<#id#>" class="attachment iconic">
			<div class="attachment-preview">
				<div class="thumbnail">
					<span class="blg-icon <#code#>"></span>
				</div>
			</div>

			<button type="button" class="button-link check">
				<span class="blg-icon blg-icon-check"></span>
			</button>
		</li>
	</script>
	
	<script type="text/html" id="tpl-attachment-none">
		<li class="blg-message blg-state-highlight">{L_NO_ELEMENTS}</li>
	</script>
	
	<script type="text/html" id="tpl-details-image-editable">
		<div class="attachment-details">
			<h3>{L_IMAGE_DETAILS}</h3>
			<div class="attachment-info">
				<div class="thumbnail">
					<img src="<#filename#>" alt="" />
				</div>
				<div class="details">
					<div class="uploaded"><#date#></div>
					<div class="file-size"><#filesize#></div>
					<div class="dimensions">{L_IMAGE_DIMENSIONS}</div>
				</div>
			</div>

			<label class="setting">
				<span class="name">{L_IMAGE_URL}</span>
				<input type="text" value="<#url#>" readonly />
			</label>
			
			<label class="setting">
				<span class="name">{L_IMAGE_TITLE}</span>
				<input type="text" value="<#title#>" data-setting="title" />
			</label>
			
			<label class="setting">
				<span class="name">{L_IMAGE_DESCRIPTION}</span>
				<textarea data-setting="description"><#description#></textarea>
			</label>
			
			<button type="button" class="blg-button" data-action="update">{L_UPDATE}</button>
		</div>
	</script>
	
	<script type="text/html" id="tpl-details-image">
		<div class="attachment-details">
			<h3>{L_IMAGE_DETAILS}</h3>
			<div class="attachment-info">
				<div class="thumbnail">
					<img src="<#filename#>" alt="" />
				</div>
				<div class="details">
					<div class="file-size"><#filesize#></div>
					<div class="dimensions">{L_IMAGE_DIMENSIONS}</div>
				</div>
			</div>

			<label class="setting">
				<span class="name">{L_IMAGE_URL}</span>
				<input type="text" value="<#url#>" readonly />
			</label>
		</div>
	</script>
	
	<script type="text/html" id="tpl-details-icon">
		<div class="attachment-details iconic">
			<h3>{L_ICON_PREVIEW}</h3>
			<div class="attachment-info">
				<div class="thumbnail">
					<span class="blg-icon <#code#>"></span>
				</div>
			</div>
		</div>
	</script>
	
	<script type="text/html" id="tpl-section-upload-modern">
		<div class="upload-ui">
			<div class="uploader-inline">
				<div class="blg-browser-button">
					<button type="button">
						<span>{L_SELECT_FILES}</span>
					</button>
					<input type="file" name="file[]" multiple />
				</div>
				<p>o</p>
				<h3>{L_FILES_DRAG}</h3>

				<p class="max-upload-size">{S_MAX_FILESIZE}</p>
			</div>
			<div class="upload-inline-status blg-helper-hidden">
				<p>{L_UPLOADING_FILES}</p>
				<div class="blg-progress-bar"><div class="inner" role="progressbar"></div></div>
			</div>
			<div class="upload-drop-label">
				<p>{L_FILES_DROP}</p>
				<span class="blg-icon blg-icon-arrow-circle-o-down"></span>
			</div>
		</div>
	</script>
	
	<script type="text/html" id="tpl-section-upload-old">
		<div class="upload-ui">
			<div class="uploader-inline">
				<div class="blg-browser-button">
					<button type="button">
						<span>{L_SELECT_FILE</span>
					</button>
					<input type="file" name="file" />
				</div>

				<p class="max-upload-size">{S_MAX_FILESIZE}</p>
			</div>
			<div class="upload-inline-status blg-helper-hidden"><div class="blg-loading-big"></div></div>
		</div>
	</script>
	
	<script type="text/html" id="tpl-section-insert">
		<div class="media-embed">
			<label class="embed-url">
				<input type="url" value="http://" />
				<span class="spinner blg-loading blg-helper-hidden"></span>
			</label>
			
			<div class="media-embed-submit blg-helper-hidden">
				<label>
					<input type="checkbox" name="copy" value="1" />
					{L_CREATE_SERVER_COPY}
				</label>
				<div class="blg-browser-button">
					<button type="button">{L_PROCCESS}</button>
				</div>
			</div>
		</div>
	</script>
</div>
