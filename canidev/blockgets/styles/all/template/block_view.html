	
{% if block.IS_GROUP %}
	<div id="block-{{ block.BLOCK_ID }}" class="{{ block.GROUP_CLASS }}">
	{% for sub in block.blocks %}
		<div id="block-{{ sub.BLOCK_ID }}" class="blg-block forabg {{ sub.BLOCK_CLASSES }}">
			<div class="block_title">
				{{ sub.BLOCK_ICON }}<span>{{ sub.BLOCK_TITLE }}</span>
			</div>
			<div class="block-content">
				{{ sub.BLOCK_CONTENT }}
			</div>
		</div>
	{% endfor %}
	</div>
{% else %}
	<div id="block-{{ block.BLOCK_ID }}" class="blg-block forabg {{ block.BLOCK_CLASSES }}">
		<div class="block_title">
			{{ block.BLOCK_ICON }}<span>{{ block.BLOCK_TITLE }}</span>
		</div>
		<div class="block-content">
			{{ block.BLOCK_CONTENT }}
		</div>
    </div>
{% endif %}
