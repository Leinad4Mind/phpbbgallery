
{% if S_SHOW_ANIMATION %}
<script>
// <![CDATA[
	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		$('#block-{{ BLOCK_ID }}').blgCloudtag();
	});
// ]]>
</script>
{% endif %}

<div class="blg-tagcloud-container">
	<div id="tags-{{ BLOCK_ID }}" class="blg-align-center">
	{% for tag in clouds %}
		<a href="{{ tag.U_TAG_URL }}" title="{{ tag.S_TAG_NAME }}" style="font-size: {{ tag.S_TAG_SIZE }}px;">{{ tag.S_TAG_NAME }}</a>
	{% else %}
		<div class="blg-message cbb-state-highlight">{{ lang('NO_ITEMS') }}</div>
	{% endfor %}
	</div>
</div>
