
<script type="text/javascript">
// <![CDATA[
	window._jBlg = window._jBlg || [];
	
	window._jBlg.push(function() {
		$('#announcements-{BLOCK_ID}').accordion({
			collapsable: '{S_ANNS_COLLAPSE}'
		});
	});
// ]]>
</script>

<!-- IF .ann_row -->
<div id="announcements-{BLOCK_ID}">
    
<!-- BEGIN ann_row -->

	<!-- IF S_SHORT_MODE -->
    <h5><a href="#{ann_row.ID}">{ann_row.TITLE}</a></h5>
	<div class="block-postbody">
		<div style="margin: 5px;">{ann_row.TEXT}</div>
		<div class="small">{ann_row.TIME}</div>
		
		<div>
			<hr />
			<a style="float: {S_CONTENT_FLOW_END};" href="{ann_row.U_VIEW_TOPIC}" title="{L_READ_FULL}"><span class="blg-icon blg-icon-eye"></span></a>
			<strong>{ann_row.POST_AUTHOR_FULL}</strong>
		</div>
	
	<!-- ELSE -->
	
    <h5><span class="small" style="float:{S_CONTENT_FLOW_END};">{ann_row.TIME}</span><a href="#{ann_row.ID}">{ann_row.TITLE}</a></h5>
	<div>
		<table class="blg-table">
		<tr>
			<td colspan="2" class="blg-align-{S_CONTENT_FLOW_BEGIN}">
				<div class="block-postbody news-content">{ann_row.TEXT}</div>
	              
			<!-- IF ann_row.S_HAS_ATTACHMENTS -->
				<dl class="attachbox">
					<dt>{L_ATTACHMENTS}</dt>
					<!-- BEGIN attachment -->
						<dd>{ann_row.attachment.DISPLAY_ATTACHMENT}</dd>
					<!-- END attachment -->
				</dl>
			<!-- ENDIF -->
	
			</td>
		</tr>
		<tr><td colspan="2"><hr /></td></tr>
		<tr>
			<td class="blg-align-{S_CONTENT_FLOW_BEGIN}">{L_POSTED_BY}: <strong>{ann_row.POST_AUTHOR_FULL}</strong></td>
			<td class="blg-align-{S_CONTENT_FLOW_END}"><a href="{ann_row.U_VIEW_TOPIC}" title="{L_READ_FULL}"><span class="blg-icon blg-icon-eye"></span></a></td>
		</tr>
		</table>
	<!-- ENDIF -->
	</div>
<!-- END ann_row -->
</div>
<!-- ELSE -->
<div class="blg-align-center">{L_NO_ANNOUNCEMENTS}</div>
<!-- ENDIF -->
