
<script>
// <![CDATA[
	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		var translateUrl = 'https://translate.google.com/translate';
		var translateParams = {
			u	: '{{ GOOGLE_TRANSLATE_URL }}',
			hl	: '{{ GOOGLE_USER_LANG }}',
			sl	: '{{ GOOGLE_USER_LANG }}',
			ie	: 'UTF8'
		};

		$('#translate-{{ BLOCK_ID }} a').click(function(e) {
			translateParams.tl = $(this).attr('data-iso');

			window.open(translateUrl + '?' + cbbCore.serializeVars(translateParams, '&', true));
			e.preventDefault();
		});
	});
// ]]>
</script>

<div id="translate-{{ BLOCK_ID }}" class="blg-google-translate{% if GOOGLE_BUTTONS_INLINE %} inline-buttons{% endif %} blg-align-center">
{% for lang in translate %}
	<a href="#" class="cbb-btn cbb-helper-clear" data-iso="{{ lang.S_ISO }}" title="{{ lang.S_TITLE }}">
		<img src="{{ lang.S_IMAGE_SRC }}" alt="{{ lang.S_ISO }}">{% if lang.S_NAME %}<span>{{ lang.S_NAME }}</span>{% endif %}
	</a>
{% endfor %}
	<div class="blg-google-logo"></div>
</div>
