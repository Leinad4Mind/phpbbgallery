<!-- IF .poll -->
	<script>
	// <![CDATA[
		window._jPostponed = window._jPostponed || [];
		window._jPostponed.push(function() {
			$('#poll-{BLOCK_ID}').ajaxify({
				done: function(json) {
					this.replaceWith(json.htmlContent);
				}
			});
		});
	// ]]>
	</script>

<!-- BEGIN poll -->
<!-- IF poll.S_CAN_VOTE --><form id="poll-{BLOCK_ID}" method="post" action="{U_BLG_ACTION}"><!-- ENDIF -->
	<ul class="blg-linear-list blg-align-center">
		<li class="double-space menu-cat">{poll.S_POLL_QUESTION}</li>
		<!-- IF poll.S_POLL_LENGTH --><li>{poll.S_POLL_LENGTH}</li><!-- ENDIF -->
		<!-- IF poll.S_CAN_VOTE --><li>{poll.S_MAX_VOTES}</li><!-- ENDIF -->
	</ul>

	<!-- BEGIN poll_option -->
	<div class="blg-poll-option">
		<div class="poll-option-title">
			<!-- IF poll.S_CAN_VOTE --><input type="<!-- IF poll.S_IS_MULTI_CHOICE -->checkbox<!-- ELSE -->radio<!-- ENDIF -->" name="poll_vote_id[]" id="vote_{poll.poll_option.POLL_OPTION_ID}" value="{poll.poll_option.POLL_OPTION_ID}"<!-- IF poll.poll_option.POLL_OPTION_VOTED --> checked="checked"<!-- ENDIF --> /><!-- ENDIF -->
			{poll.poll_option.POLL_OPTION_CAPTION}
		</div>

		<!-- IF poll.S_DISPLAY_RESULTS -->
		<div class="poll-option-results">
			<div class="blg-progressbar" title="{poll.poll_option.POLL_OPTION_PERCENT}"><div style="width:{poll.poll_option.POLL_OPTION_PERCENT};"></div></div>
			<div class="poll-option-text">
				<!-- IF poll.poll_option.POLL_OPTION_VOTED --><i class="fa fa-check-circle-o fa-lg" title="{L_POLL_VOTED_OPTION}"></i><!-- ENDIF -->
				{poll.poll_option.POLL_OPTION_PERCENT}
			</div>
		</div>
		<!-- ENDIF -->
	</div>
	<!-- END poll_option -->

	<br />
	
	<ul class="blg-linear-list blg-align-center">
		<!-- IF poll.S_CAN_VOTE --><li><input type="submit" name="update_vote" value="{L_SUBMIT_VOTE}" class="button2" /></li><!-- ENDIF -->
		<!-- IF poll.S_DISPLAY_RESULTS --><li>{L_TOTAL_VOTES}{L_COLON} {poll.S_TOTAL_VOTES}</li><!-- ENDIF -->
          
		<li><a href="{poll.U_POLL_RESULTS}">{L_VIEW_TOPIC}</a></li>
	</ul>

<!-- IF poll.S_CAN_VOTE -->
	<div>{poll.S_HIDDEN_FIELDS}</div>
</form>
<!-- ENDIF -->
<!-- END poll -->

<!-- ELSE -->
<div class="blg-align-center">{L_NO_POLL}</div>
<!-- ENDIF -->
