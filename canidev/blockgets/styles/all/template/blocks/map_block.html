
<!-- IF LATLNG_HELPER -->
	<div class="cbb-group js-group-{HP_ID}">
		<input type="text" class="cbb-inputbox autowidth" name="latitude" placeholder="{L_LATITUDE}" value="{HP_LAT}" size="12" />
		<input type="text" class="cbb-inputbox autowidth" name="longitude" placeholder="{L_LONGITUDE}" value="{HP_LNG}" size="12" />
		<button class="js-map-launcher cbb-btn">{L_MAP}</button>
	</div>
	
	<script>
	// <![CDATA[
		window._jPostponed = window._jPostponed || [];
		window._jPostponed.push(['@blockgets/adminMap', '{HP_ID}']);
	// ]]>
	</script>
	
	<script type="text/html" id="tpl-map-dialog">
		<div title="{L_SELECT_LOCATION}">
			<div class="map-editor"></div>
			
			<br />
			
			<div class="cbb-group">
				<input type="text" class="cbb-inputbox" name="address" placeholder="{L_SEARCH_ADDRESS}" value="" size="40" />
				<button class="js-map-search cbb-btn">{L_SEARCH}</button>
			</div>
		</div>
	</script>
<!-- ELSE -->
	<script>
	// <![CDATA[
		window._jPostponed = window._jPostponed || [];
		window._jPostponed.push(function() {
			$('#map-{BLOCK_ID}').blgMap({S_MAP_OPTIONS});
		});
	// ]]>
	</script>

	<div id="map-{BLOCK_ID}">{S_GMAP_INFO}</div>
<!-- ENDIF -->
