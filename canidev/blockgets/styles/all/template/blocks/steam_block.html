
<div class="steam-group">
	<div class="steam-header">
		<div class="steam-avatar cbb-circular-avatar"><img src="{{ S_STEAM_AVATAR }}" alt="avatar" /></div>
		<div class="steam-name"><a href="{{ U_STEAM_URL }}">{{ S_STEAM_NAME }}</a></div>
	</div>

	<div class="steam-summary">{{ S_STEAM_SUMMARY }}</div>

	<ul class="steam-stats">
		<li>
			<i class="fa fa-users" aria-hidden="true"></i>
			<span class="stat-value">{{ S_STEAM_MEMBERS }}</span>
			<span class="stat-title">{{ lang('STEAM_MEMBERS') }}</span>
		</li>
		<li>
			<i class="fa fa-gamepad" aria-hidden="true"></i>
			<span class="stat-value">{{ S_STEAM_IN_GAME }}</span>
			<span class="stat-title">{{ lang('STEAM_IN_GAME') }}</span>
		</li>
		<li>
			<i class="fa fa-user-plus" aria-hidden="true"></i>
			<span class="stat-value">{{ S_STEAM_ONLINE }}</span>
			<span class="stat-title">{{ lang('STEAM_ONLINE') }}</span>
		</li>
	</ul>
</div>
