
<script>

	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		$('#block-{BLOCK_ID}').blgMarquee({
			direction: '{S_MARQUEE_DIRECTION}',
			align: '{S_MARQUEE_ALIGN}',
			height: '{S_BLOCK_HEIGHT}',
			type: '{S_MARQUEE_TYPE}',
			fps: '{S_MARQUEE_SPEED}'

<div class="marquee">

		<div class="mini-banner<!-- IF S_MARQUEE_TYPE != 'static' --> {S_MARQUEE_DIRECTION}<!-- ENDIF -->">

	</div>
