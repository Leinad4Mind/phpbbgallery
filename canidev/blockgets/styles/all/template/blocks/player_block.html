
<!-- IF S_IN_WINDOW -->
	<!-- DEFINE $BLG_WINDOW = 1 -->
	<!-- INCLUDE simple_header.html -->
<!-- ENDIF -->

<script type="text/javascript">
// <![CDATA[
	window._jBlg = window._jBlg || [];
	
	window._jBlg.push(function() {
		$('#player-{BLOCK_ID}').player({
			autoplay	: <!-- IF S_AUTOPLAY -->true<!-- ELSE -->false<!-- ENDIF -->,
			playlist	: <!-- IF S_PLAYLIST -->true<!-- ELSE -->false<!-- ENDIF -->,
			in_window	: <!-- IF S_IN_WINDOW -->true<!-- ELSE -->false<!-- ENDIF -->,
			flash_url	: '{U_FLASHPLAYER_URL}',
			player_url	: '{U_PLAYER_URL}'
		});
	});
// ]]>
</script>

<!-- IF S_IN_WINDOW --><div class="player-window blg-state-default blg-corner-all"><!-- ENDIF -->

<div id="player-{BLOCK_ID}">
	<div class="player-wrap">
		<div class="player-statusbar blg-corner-all"><div></div></div>
		
		<div class="player-buttons blg-corner-all">
			<a class="js-play" href="#" data-action="play" title="{L_PLAY}"><span class="blg-icon blg-icon-play"></span></a>
			<a class="js-stop" href="#" data-action="stop" title="{L_STOP}"><span class="blg-icon blg-icon-stop"></span></a>
			<a class="js-mute" href="#" data-action="mute" title="{L_MUTE}"><span class="blg-icon blg-icon-volume-off"></span></a>

			<div class="player-volume" title="{L_VOLUME}"></div>
		</div>
		
		<a class="player-newwin" href="#" <!-- IF S_IN_WINDOW -->data-action="closewin" title="{L_WIN_CLOSE}"<!-- ELSE -->data-action="openwin" title="{L_WIN_OPEN}"<!-- ENDIF -->><span class="blg-icon blg-icon-external-link"></span></a>
	</div>

	<div class="player-list-wrap blg-corner-all">
		<ol class="player-playlist">
	<!-- BEGIN track -->
			<li><a href="{track.S_URL}">{track.S_TITLE}</a></li>
	<!-- END track -->
		</ol>
	</div>
	
	<div class="player-newwin-message">
		<div>{L_WIN_OPEN_EXPLAIN}</div>
		<div><a class="player-newwin" href="#" data-action="returnwin" title="{L_WIN_RETURN}"><span class="blg-icon blg-icon-sign-in"></span></a></div>
		<br class="clear" />
	</div>
</div>

<!-- IF S_IN_WINDOW -->
	</div>

	<!-- INCLUDE simple_footer.html -->
<!-- ENDIF -->
