<!-- IF S_VIEW eq 'simple' -->
	<ul class="blg-linear-list">
	<!-- BEGIN group_row -->
		<li class="menu-cat"><a href="{group_row.U_GROUP}">{group_row.GROUP_NAME}</a></li>
		
		<!-- BEGIN user -->
			<li class="userrow"><strong>{group_row.user.USERNAME_FULL}</strong></li>
		<!-- END user -->
	<!-- END group_row -->
	</ul>

<!-- ELSE IF S_VIEW eq 'accordion' -->
<script>
// <![CDATA[
	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		$('#leader-groups-{BLOCK_ID}').blgAccordion({
			active		: 0,
			collapsible : true
		});
	});
// ]]>
</script>

<div id="leader-groups-{BLOCK_ID}">
<!-- BEGIN group_row -->
	<h5><a href="#">{group_row.GROUP_NAME}</a></h5>
	<div>
		<table class="blg-table">
		<!-- BEGIN user -->
			<tr><td class="userrow"><strong>{group_row.user.USERNAME_FULL}</strong></td></tr>
		<!-- END user -->
		</table>
	</div>
<!-- END group_row -->
</div>
<!-- ENDIF -->
