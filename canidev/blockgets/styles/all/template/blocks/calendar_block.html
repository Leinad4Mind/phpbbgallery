<!-- IF IN_EVENTLIST -->
	<!-- BEGIN event -->
		<div {event.S_ATTR}><!-- IF event.S_TYPE eq 'birthday' --><i class="fa fa-birthday-cake" aria-hidden="true"></i> <!-- ENDIF -->{event.S_TITLE}</div>
	<!-- END event -->

<!-- ELSE -->

	<!-- IF not IN_CALENDAR -->
	<script>
	// <![CDATA[
		window._jPostponed = window._jPostponed || [];
		window._jPostponed.push(function() {
			$('#calendar-{BLOCK_ID}').blgCalendar({S_OPTIONS});
		});
	// ]]>
	</script>

	<script type="text/html" id="tpl-calendar-info">
		<div class="blg-calendar-info">
			<div class="info-header">
				<span>{L_EVENTS} <%date%></span>
				<a href="#" data-action="close"><i class="fa fa-remove" aria-hidden="true"></i></a>
			</div>
			
			<div class="info-content">
				<div class="no-items blg-message cbb-state-highlight">{L_NO_EVENTS}</div>
			</div>
			
		<!-- IF S_CAN_CREATE_EVENT -->
			<div class="blg-align-right floated">
				<a href="#" class="cbb-btn" data-action="add">{L_ADD_EVENT}</a>
			</div>
		<!-- ENDIF -->
		</div>
	</script>
	
	<div id="calendar-{BLOCK_ID}" class="calendar_container">
	<!-- ENDIF -->

	<!-- BEGIN calendar -->
		<div class="calendar-month">
		<form name="calendar-{BLOCK_ID}-{calendar.S_ROW_COUNT}" method="post">
			<table class="calendar<!-- IF BLOCK_VIEW_SMALL --> autofit<!-- ENDIF -->">
			<thead>
			<tr>
				<td class="blg-align-left"><!-- IF calendar.S_FIRST_ROW --><a href="#" data-calendar="{BLOCK_ID}-{calendar.S_ROW_COUNT}" data-action="prev"><i class="fa fa-arrow-circle-left fa-lg" aria-hidden="true"></i></a><!-- ELSE -->&nbsp;<!-- ENDIF --></td>
				<td colspan="5" class="month-title blg-align-center"><a href="{calendar.U_ACTION}">{calendar.S_MONTH}</a></td>
				<td class="blg-align-right"><!-- IF calendar.S_LAST_ROW --><a href="#" data-calendar="{BLOCK_ID}-{calendar.S_ROW_COUNT}" data-action="next"><i class="fa fa-arrow-circle-right fa-lg" aria-hidden="true"></i></a><!-- ELSE -->&nbsp;<!-- ENDIF --></td>
			</tr>
			</thead>
			<tbody>
			<tr>
		<!-- BEGIN days -->

			<!-- IF calendar.days.NEW_LINE and not calendar.days.S_FIRST_ROW --></tr><tr><!-- ENDIF -->

			<!-- IF calendar.days.IS_HEADER -->
				<td class="cal-header">{calendar.days.S_DAY_SHORT}</td>
			<!-- ELSE -->
				<td><!-- IF calendar.days.S_DAY --><a href="#" class="blg-calendar-day<!-- IF calendar.days.IS_TODAY --> today<!-- ENDIF -->" data-calendar="{BLOCK_ID}-{calendar.S_ROW_COUNT}" data-time="{calendar.days.S_DATA}" data-color="{calendar.days.S_COLOR}"<!-- IF S_SHOW_EVENTS --> data-event="{calendar.days.S_EVENT}"<!-- ENDIF -->>{calendar.days.S_DAY}</a><!-- ELSE -->&nbsp;<!-- ENDIF --></td>
			<!-- ENDIF -->
		<!-- END days -->
			</tr>
			</tbody>
			</table>
			<div>{calendar.S_HIDDEN_FIELDS}</div>
		</form>
		</div>
	<!-- END calendar -->
	
	<!-- IF not IN_CALENDAR --></div><!-- ENDIF -->
<!-- ENDIF -->
