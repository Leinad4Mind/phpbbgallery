
<ul class="blg-linear-list blg-menu">
{% for row in menu_row %}
	{% if row.IS_CAT %}
		<li class="menu-cat double-space">{{ row.S_TEXT }}</li>
	{% else %}
		<li class="double-space subchild">
			{% if row.S_ICON %}<div class="menu-icon">{{ row.S_ICON }}</div>{% endif %}
			<a href="{{ row.U_LINK }}"{% if row.S_WINDOW %} class="blank"{% endif %} title="{{ row.S_TITLE }}">{{ row.S_TEXT }}</a>
		</li>
	{% endif %}
{% endfor %}
</ul>
