
<ul class="blg-linear-list">
<!-- BEGIN menu_row -->
	<!-- IF menu_row.IS_CAT -->
		<li class="menu-cat double-space">{menu_row.S_TEXT}</li>
	<!-- ELSE -->
		<li class="double-space subchild">
			<!-- IF menu_row.S_ICON --><span class="blg-icon {menu_row.S_ICON}"></span><!-- ENDIF -->
			<a href="{menu_row.U_LINK}"<!-- IF menu_row.S_WINDOW == "1" --> class="blank"<!-- ENDIF --> title="{menu_row.S_TITLE}">{menu_row.S_TEXT}</a>
		</li>
	<!-- ENDIF -->
<!-- END menu_row -->
</ul>
