<script>
// <![CDATA[
	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		$('#block-{{ BLOCK_ID }} form').submit(function() {
			var searchUrls = {
				google		: 'https://www.google.com/search?q=',
				yahoo		: 'https://search.yahoo.com/search?p=',
				bing		: 'https://www.bing.com/search?q='
			};

			var data = $(this).serializeObject();

			if(data.keywords && data.keywords != $(this).find('[name="keywords"]').attr('placeholder'))
			{
				switch(data.engine)
				{
					case 'author':
						$(this).find('[name="keywords"]').attr('name', 'author');

					case 'site':
						return true;
					break;
		
					default:
						var url = searchUrls[data.engine];

						if(url)
						{
							window.open(url + encodeURIComponent(data.keywords), '_' + data.engine, '');
						}
					break;
				}
			}

			return false;
		});
	});
// ]]>
</script>

<form method="get" action="{{ U_SEARCH }}">
	<ul class="blg-linear-list blg-align-center">
		<li class="double-space"><input type="text" class="cbb-inputbox full-width" name="keywords" size="22" value="" placeholder="{L_SEARCH_MINI}" /></li>
		<li class="double-space">
			<select name="engine" class="cbb-inputbox">
			{% if S_DISPLAY_SEARCH %}
				<optgroup label="{L_FORUMS}">
					<option value="site">{L_MESSAGES}</option>
					<option value="author">{L_AUTHOR}</option>
				</optgroup>
			{% endif %}
				<optgroup label="{L_SH_ENGINE}">
					<option value="google">Google</option>
					<option value="yahoo">Yahoo</option>
					<option value="bing">Bing</option>
				</optgroup>
			</select>
		</li>

		<li class="double-space">
			{{ S_BLOCK_HIDDEN_FIELDS }}
			<input class="cbb-btn" type="submit" value="{L_SEARCH}" />
		</li>

		{% if S_DISPLAY_SEARCH %}<li class="double-space top-bordered"><a href="{{ U_SEARCH }}" title="{L_SEARCH_ADV_EXPLAIN}">{L_SEARCH_ADV}</a></li>{% endif %}
	</ul>
</form>
