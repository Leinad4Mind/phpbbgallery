
<script>
// <![CDATA[
	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		$('#block-{BLOCK_ID} form').ajaxify({
			done: function() {
				$(this).find('[name=subject], [name=message]').val('');
			}
		});
	});
// ]]>
</script>

<form method="post" action="{U_BLG_ACTION}">

	<fieldset class="contact-fields<!-- IF BLOCK_VIEW_SMALL --> short-view<!-- ENDIF -->">
	<!-- BEGIN fieldrow -->
		<dl>
			<dt><strong>{fieldrow.TITLE}{L_COLON}</strong></dt>
			<dd>
			<!-- IF fieldrow.TYPE eq 'text' -->
				<input type="text" name="{fieldrow.KEY}" size="35" value="{fieldrow.VALUE}" class="cbb-inputbox autowidth" />
			<!-- ELSEIF fieldrow.TYPE eq 'textarea' -->
				<textarea name="{fieldrow.KEY}" cols="30" rows="8" class="cbb-inputbox">{fieldrow.VALUE}</textarea>
			<!-- ELSEIF fieldrow.TYPE eq 'custom' -->
				{fieldrow.TEMPLATE}
			<!-- ENDIF -->
			</dd>
		</dl>
	<!-- END fieldrow -->

	<!-- IF CAPTCHA_TEMPLATE -->
	<!-- DEFINE $CAPTCHA_TAB_INDEX = 4 -->
		<!-- INCLUDE {CAPTCHA_TEMPLATE} -->
	<!-- ENDIF -->
	</fieldset>

	<br />
	<div class="blg-align-center">
		<input type="submit" class="button1" id="submit" name="submit" value="{L_SUBMIT}" />
		{BLOCK_HIDDEN_FIELDS}
		{S_FORM_TOKEN}
	</div>
</form>
