
<script>
// <![CDATA[
	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		$('#block-{BLOCK_ID} form').ajaxify({
			done: function() {
				$(this).find('[name=subject], [name=message]').val('');
			}
		});
	});
// ]]>
</script>

<form method="post" action="{U_BLG_ACTION}">
	<table class="blg-table contact-table<!-- IF not BLOCK_VIEW_SMALL --> full-table<!-- ENDIF -->">
<!-- IF BLOCK_VIEW_SMALL -->
	<!-- BEGIN fieldrow -->
	<tr>
		<td>
			<strong>{fieldrow.TITLE}{L_COLON}</strong><br />
		<!-- IF fieldrow.TYPE eq 'text' -->
			<input type="text" name="{fieldrow.KEY}" id="{fieldrow.KEY}" size="35" value="{fieldrow.VALUE}" class="cbb-inputbox" />
		<!-- ELSEIF fieldrow.TYPE eq 'textarea' -->
			<textarea name="{fieldrow.KEY}" id="{fieldrow.KEY}" cols="30" rows="6" class="cbb-inputbox">{fieldrow.VALUE}</textarea>
		<!-- ELSEIF fieldrow.TYPE eq 'custom' -->
			{fieldrow.TEMPLATE}
		<!-- ENDIF -->
		</td>
	</tr>
	<!-- END fieldrow -->
<!-- ELSE -->
		<col width="35%" /><col width="65%" />
	<!-- BEGIN fieldrow -->
		<tr>
			<td class="blg-align-right"<!-- IF fieldrow.TYPE eq 'textarea' --> valign="top"<!-- ENDIF -->>
				<label for="{fieldrow.KEY}"><strong>{fieldrow.TITLE}{L_COLON}</strong></label>
			</td>
			<td>
			<!-- IF fieldrow.TYPE eq 'text' -->
				<input type="text" name="{fieldrow.KEY}" id="{fieldrow.KEY}" size="35" value="{fieldrow.VALUE}" class="cbb-inputbox autowidth" />
			<!-- ELSEIF fieldrow.TYPE eq 'textarea' -->
				<textarea name="{fieldrow.KEY}" id="{fieldrow.KEY}" cols="30" rows="8" class="cbb-inputbox">{fieldrow.VALUE}</textarea>
			<!-- ELSEIF fieldrow.TYPE eq 'custom' -->
				{fieldrow.TEMPLATE}
			<!-- ENDIF -->
			</td>
		</tr>
	<!-- END fieldrow -->
<!-- ENDIF -->
	</table>

	<br />
	<div class="blg-align-center">
		<input type="submit" class="btn btn-default" id="submit" name="submit" value="{L_SUBMIT}" />
		{BLOCK_HIDDEN_FIELDS}
		{S_FORM_TOKEN}
	</div>
</form>
