	
{% if block.IS_GROUP %}
	<div id="block-{{ block.BLOCK_ID }}" class="{{ block.GROUP_CLASS }}">
	{% for sub in block.blocks %}
		<div id="block-{{ sub.BLOCK_ID }}" class="blg-block panel panel-forum {{ sub.BLOCK_CLASSES }}">
			<div class="block-title panel-heading">
				{% if sub.BLOCK_ICON %}<i class="fa {{ sub.BLOCK_ICON }}"></i>{% endif %}
				<span class="cbb-helper-text cbb-inline">{{ sub.BLOCK_TITLE }}</span>
			</div>
			<div class="block-content panel-inner">
				{{ sub.BLOCK_CONTENT }}
			</div>
		</div>
	{% endfor %}
	</div>
{% else %}
	<div id="block-{{ block.BLOCK_ID }}" class="blg-block panel panel-forum {{ block.BLOCK_CLASSES }}">
		<div class="block-title panel-heading">
			{% if block.BLOCK_ICON %}<i class="fa {{ block.BLOCK_ICON }}"></i>{% endif %}
			<span class="cbb-helper-text cbb-inline">{{ block.BLOCK_TITLE }}</span>
		</div>
		<div class="block-content panel-inner">
			{{ block.BLOCK_CONTENT }}
		</div>
    </div>
{% endif %}
