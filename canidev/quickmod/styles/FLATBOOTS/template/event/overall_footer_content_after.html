<!-- IF S_QUICKMOD_ENABLED -->

<div id="qm_main" class="panel" style="display:none;">
	<form name="quick_mod_form" action="{U_QUICK_ACTION}" method="post" onsubmit="return false;">
		<div id="qm_main_container">
			<div class="qm_loading"></div>
			<div class="qm-action-container qm-hidden">
				{L_WITH_SELECTED} <span id="row_mark_count">(0)</span>:
				<label>
					<select id="quick_mod_action" name="quick_mod_action">{S_QUICK_OPTIONS}</select>
					<input type="button" name="quick_mod_button" value="{L_GO}" class="btn btn-default btn-sm" onclick="jQM.quickmod('submit', false, '');" />
				</label>
			</div>
			<div class="qm-select-container"><select id="qm-mark" name="qm_mark">{S_QM_MARK_OPTIONS}</select></div>
			
			{S_FORM_TOKEN}
			{S_HIDDEN_FIELDS}
		</div>
	</form>
</div>

<div id="quick_rename">
	<input type="text" class="inputbox tiny qm_inputbox" id="topic_title" name="topic_title" maxlength="60" value="" />
	<input type="button" value="{L_SUBMIT}" class="btn btn-default btn-sm" onclick="jQM.quickmod('go', this);" data-action="rename" />
	<input type="button" value="{L_CANCEL}" class="btn btn-default btn-sm" onclick="jQM.quickmod('rename', 'hide');" />
</div>

<!-- ENDIF -->
