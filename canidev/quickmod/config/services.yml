services:
    canidev.quickmod.listener:
        class: canidev\quickmod\event\listener
        arguments:
            - '@canidev.quickmod.core'
        tags:
            - { name: event.listener }

    canidev.quickmod.core:
        class: canidev\quickmod\libraries\quickmod
        arguments:
            - '@auth'
            - '@cache.driver'
            - '@config'
            - '@service_container'
            - '@dbal.conn'
            - '@dispatcher'
            - '@language'
            - '@request'
            - '@canidev.core.template'
            - '@canidev.core.tools'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'

    canidev.quickmod.admin.config:
        class: canidev\quickmod\controller\admin_controller_config
        parent: canidev.core.controller.acp
        arguments:
            - '@dispatcher'
            - '@log'
            - '@canidev.quickmod.core'
            - '@user'
