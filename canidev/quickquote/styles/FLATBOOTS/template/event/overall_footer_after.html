<!-- IF QQ_ENABLED -->
	<script type="text/html" id="tpl-quickquote-tooltip">
		<div class="quickquote-tooltip">
			<a href="#" data-action="quote"><i class="fa fa-plus"></i> {L_QQ_SAVE_QUOTE}</a>
			<span class="tooltip-sep">|</span>
			<a href="#" data-action="reply"><i class="fa fa-reply"></i> {L_QQ_REPLY}</a>
		</div>
	</script>

	<script type="text/html" id="tpl-quickquote-floatbtn">
	<a href="#" class="quickquote-floatbtn btn btn-default">{L_QUOTES} (<span class="cite-count">0</span>)</a>
	</script>

	<script type="text/html" id="tpl-quickquote-inlinebtn">
	<button type="button" class="btn btn-default" value="1">{L_QQ_INSERT_QUOTES}</button>
	</script>

	<script type="text/html" id="tpl-quickquote-dialog">
		<div class="qq-dialog-overlay">
			<div class="qq-dialog">
				<div class="dialog-title">
					<span>{L_QUOTES}</span>
					<a href="#"><i class="fa fa-remove"></i></a>
				</div>
				<div class="dialog-content">
					<ul class="js-quickquote-list">
						<li>
							<div class="titlebar">
								<input id="check-%id%" type="checkbox" value="%id%" />
								<label for="check-%id%"></label><span>%username%</span>
								<a href="#" data-action="remove" title="{L_QQ_REMOVE}"><i class="fa fa-close"></i></a>
								<a href="#" data-action="insert" title="{L_QQ_INSERT}"><i class="fa fa-download"></i></a>
							</div>
							<div class="content">%text%</div>
						</li>
					</ul>
				</div>
				<div class="dialog-buttons">
					<div class="js-btn-marked cbbcore-helper-hidden">
						<a href="#" data-action="insertSelected" class="btn btn-default">{L_QQ_INSERT_SELECTED}</a>
						<a href="#" data-action="removeSelected" class="btn btn-default">{L_QQ_REMOVE_SELECTED}</a>
					</div>
					<div class="js-btn-all cbbcore-helper-hidden">
						<a href="#" data-action="insertAll" class="btn btn-default">{L_QQ_INSERT_ALL}</a>
						<a href="#" data-action="removeAll" class="btn btn-default">{L_QQ_REMOVE_ALL}</a>
					</div>
				</div>
			</div>
		</div>
	</script>

	<script>
	<!-- IF not $CBBCORE_LOADED -->
		head.load('{CBBCORE_JS_FILENAME}');
		<!-- DEFINE $CBBCORE_LOADED = 1 -->
	<!-- ENDIF -->
	
	head.load('{BOARD_URL}ext/canidev/quickquote/styles/all/template/quickquote.min.js');

	head.ready('quickquote.js', function() {
		(function($) {
			// Workaround for flatboots
			cbbCore.dispatchEvent('core.onready');

			{QUICKQUOTE_JS_EVENTS}

			cbbCore.initService('quickquote', {
				advancedMode: <!-- IF PHPBB_BRANCH eq '31x' -->false<!-- ELSE -->true<!-- ENDIF -->,
				btnTarget	: <!-- IF QQ_FLOAT_BTN -->'body'<!-- ELSE -->'#qr_postform .form-group:has(.btn), #postform .form-actions'<!-- ENDIF -->,
				target		: 'article .content, .pm .content',
				editors		: {
					phpbb: '#qr_postform textarea, #postform textarea'
				},
				replyURL	: '{U_QQ_REPLY}'
			});
		})(jQuery);
	});
	</script>
<!-- ENDIF -->
