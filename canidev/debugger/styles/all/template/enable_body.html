<!doctype html>
<html dir="ltr" lang="{{ S_USER_LANG }}" xml:lang="{{ S_USER_LANG }}">
<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex,nofollow" />
	<meta name="author" content="CaniDev" />

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

	<title>{{ L_TITLE }}</title>
</head>
<body class="bg-light">
	<h1 class="text-center mt-4">{{ L_TITLE }}</h1>

	<div class="container bg-white p-3 mt-4 mx-auto">
	{% if S_ERROR %}
		<div class="alert alert-danger" role="alert">{{ S_ERROR|raw }}</div>
	{% elseif S_SUCCESS %}
		<div class="alert alert-success" role="alert">{{ L_SUCCESS_MSG }}</div>
		<div><a href="{{ U_ACTION }}">&laquo; {{ L_RETURN }}</a></div>
	{% else %}
		<form action="{{ U_ACTION }}" method="POST">
			<div class="mb-3">{{ L_EXPLAIN }}</div>
			<div class="text-center"><button type="submit" name="submit" value="1" class="btn btn-primary">{{ L_ENABLE }}</button></div>
		</form>
	{% endif %}
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous"></script>
</body>
</html>
