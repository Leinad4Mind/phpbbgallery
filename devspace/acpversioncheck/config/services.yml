imports:
    - { resource: alias.yml }

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $root_path: '%core.root_path%'
        public: true

    devspace.acpversioncheck.core.functions:
        class: devspace\acpversioncheck\core\functions

    devspace.acpversioncheck.listener:
        class: devspace\acpversioncheck\event\listener
        tags:
            - { name: event.listener }
