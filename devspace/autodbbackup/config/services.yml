services:
    devspace.autodbbackup.admin.controller:
        class: devspace\autodbbackup\controller\admin_controller
        arguments:
            - '@config'
            - '@request'
            - '@template'
            - '@user'
            - '@log'
            - '@language'
            - '@devspace.autodbbackup.core.functions'
        public: true

    devspace.autodbbackup.core.functions:
        class: devspace\autodbbackup\core\functions
        arguments:
            - '@ext.manager'

    devspace.autodbbackup.core.backup_registry:
        class: devspace\autodbbackup\core\backup_registry
        arguments:
            - '@config_text'
            - '@filesystem'

    devspace.autodbbackup.cron.task.auto_db_backup:
        class: devspace\autodbbackup\cron\task\auto_db_backup
        arguments:
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%core.table_prefix%'
            - '@config'
            - '@language'
            - '@log'
            - '@user'
            - '@service_container'
            - '@dispatcher'
            - '@dbal.tools'
            - '@devspace.autodbbackup.core.functions'
            - '@filesystem'
            - '@devspace.autodbbackup.core.backup_registry'
        calls:
            - [set_name, [cron.task.auto_db_backup]]
        tags:
            - { name: cron.task }
