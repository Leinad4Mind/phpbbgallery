services:
    leinad4mind.userdefaults.settings_policy:
        class: leinad4mind\userdefaults\core\settings_policy
        public: false

    leinad4mind.userdefaults.listener:
        class: leinad4mind\userdefaults\event\listener
        arguments:
            - '@config'
            - '@leinad4mind.userdefaults.settings_policy'
        public: false
        tags:
            - { name: event.listener }

    leinad4mind.userdefaults.admin.controller:
        class: leinad4mind\userdefaults\controller\admin_controller
        arguments:
            - '@config'
            - '@request'
            - '@template'
            - '@user'
            - '@log'
            - '@language'
            - '@leinad4mind.userdefaults.settings_policy'
        public: true
