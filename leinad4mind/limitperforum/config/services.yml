services:

    leinad4mind.limitperforum.main_listener:
        class: 'leinad4mind\limitperforum\event\main_listener'
        arguments:
            - '@user'
            - '@auth'
            - '@language'
            - '@dbal.conn'
        tags:
            - { name: 'event.listener' }

    leinad4mind.limitperforum.acp_listener:
        class: 'leinad4mind\limitperforum\event\acp_listener'
        arguments:
            - '@language'
            - '@request'
            - '@template'
        tags:
            - { name: 'event.listener' }
