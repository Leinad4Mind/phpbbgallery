services:
    leinad4mind.specialactivitystats.listener:
        class: leinad4mind\specialactivitystats\event\main_listener
        arguments:
            - '@config'
            - '@auth'
            - '@template'
            - '@user'
            - '@dbal.conn'
            - '@leinad4mind.specialactivitystats.sessions_manager'
            - '%core.table_prefix%'
        tags:
            - { name: event.listener }
    leinad4mind.specialactivitystats.sessions_manager:
        class: leinad4mind\specialactivitystats\service\sessions_manager
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@config'
            - '@cache'
            - '%core.table_prefix%'
