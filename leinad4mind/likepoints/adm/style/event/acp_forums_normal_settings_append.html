<dl>
  <dt><label for="likepoints_enable">Enable transfer of BBPoints for likes{L_COLON}</label></dt>
	<dd><label><input type="radio" class="radio" name="likepoints_enable" value="1"<!-- IF LIKEPOINTS_ENABLED --> id="likepoints_enable" checked="checked"<!-- ENDIF --> /> {L_YES}</label>
		<label><input type="radio" class="radio" name="likepoints_enable" value="0"<!-- IF not LIKEPOINTS_ENABLED --> id="likepoints_enable" checked="checked"<!-- ENDIF --> /> {L_NO}</label></dd>
</dl>

<dl>
	<dt><label for="likepoints_amount">Amount of BBPoints transferred on liking the post{L_COLON}</label></dt>
	<dd>
    <label><input type="number" name="likepoints_amount" value="{LIKEPOINTS_AMOUNT}" min="1" max="999"></label>
	</dd>
</dl>
