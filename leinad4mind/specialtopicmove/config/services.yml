services:
    leinad4mind.specialtopicmove.main_listener:
        class: 'leinad4mind\specialtopicmove\event\main_listener'
        arguments:
            - '@user'
            - '@path_helper'
            - '@config'
            - '@auth'
            - '@template'
            - '@request'
            - '@dbal.conn'
            - '@language'
        tags:
            - { name: 'event.listener' }

    leinad4mind.specialtopicmove.acp_listener:
        class: 'leinad4mind\specialtopicmove\event\acp_listener'
        arguments:
            - '@config'
            - '@request'
            - '@language'
        tags:
            - { name: 'event.listener' }

