imports:
    - { resource: 'notifications.yml' }

services:
    leinad4mind.staffnotifications.acp_listener:
        class: 'leinad4mind\staffnotifications\event\acp_listener'
        arguments:
            - '@request'
            - '@language'
            - '@group_helper'
            - '@leinad4mind.staffnotifications.settings'
            - '@leinad4mind.staffnotifications.helper'
        tags:
            - { name: 'event.listener' }

    leinad4mind.staffnotifications.actions_listener:
        class: 'leinad4mind\staffnotifications\event\actions_listener'
        arguments:
            - '@request'
            - '@leinad4mind.staffnotifications.helper'
        tags:
            - { name: 'event.listener' }

    leinad4mind.staffnotifications.helper:
        class: 'leinad4mind\staffnotifications\helper'
        arguments:
            - '@user'
            - '@dbal.conn'
            - '@notification_manager'

    leinad4mind.staffnotifications.settings:
        class: 'leinad4mind\staffnotifications\settings'
        arguments:
            - '@config'
