imports:
    - { resource: tables.yml }
services:
    leinad4mind.formcreator.admin.controller:
        class: leinad4mind\formcreator\controller\admin_controller
        arguments:
            - '@user'
            - '@template'
            - '@dbal.conn'
            - '@request'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%leinad4mind.formcreator.table.formcreator%'
    leinad4mind.formcreator.listener:
        class: leinad4mind\formcreator\event\listener
        arguments:
            - '@user'
            - '@template'
            - '@dbal.conn'
            - '@config'
            - '@auth'
            - '@controller.helper'
            - '@cache'
            - '@request'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%leinad4mind.formcreator.table.formcreator%'
            - '@files.factory'
        tags:
            - { name: event.listener }