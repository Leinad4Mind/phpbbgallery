	<script src="index/js/jquery.backgroundvideo.min.js"></script>
	<script type="text/javascript">
		var videobackground = new $.backgroundVideo($('#header'), {
			"align": "centerXY",
			"width": 1280,
			"height": 720,
			"path": "index/video/",
			"filename": "video_bg",
			"types": ["webm", "ogg", "mp4"]
			<!--"types": [ "mp4" ,"ogv","webm"]-->
		});
		document.getElementById("play").onclick = function () {

			if (document.getElementById("video_background").paused) {
				document.getElementById("video_background").play();
				this.innerHTML = "<em class=\"icon icon-pause\"></em>";

			} else {
				document.getElementById("video_background").pause();
				this.innerHTML = "<em class=\"icon icon-play\"></em>";
			}
		}
		document.getElementById("muted").onclick = function () {

			if (document.getElementById("video_background").muted) {
				document.getElementById("video_background").muted = false;
				this.innerHTML = "<em class=\"icon icon-volume-up\"></em>";

			} else {
				document.getElementById("video_background").muted = true;
				this.innerHTML = "<em class=\"icon icon-volume-off\"></em>";
			}
		}
	</script>
