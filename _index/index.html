	<!-- FontAwesome 6 -->

	<!-- Favicons -->
	<link rel="shortcut icon" href="index/img/fav.ico">
	<link rel="apple-touch-icon" href="index/img/apple-touch-icon.png">

	<link href='https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@300;400&display=swap' rel='stylesheet'>
	
	<!-- Custom Styles & Animations -->
	<style>
		body {
			font-family: 'Open Sans', sans-serif;
			margin: 0;
			overflow: hidden; /* Prevent scrolling, keeps it a true landing page */
			background-color: #111;
		}

		h1, h2, h3, h4, h5, h6 {
			font-family: 'Montserrat', sans-serif;
		}

		.pattern-overlay {
			background-image: url('index/img/patterns/pattern.png');
			background-repeat: repeat;
		}

		/* Smooth fade-in up animation for the main title */
		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(20px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.animate-fade-in-up {
			animation: fadeInUp 1.2s ease-out forwards;
		}
		
		.animate-delay-100 { animation-delay: 100ms; }
		.animate-delay-300 { animation-delay: 300ms; }
		.animate-delay-500 { animation-delay: 500ms; }

		/* Link Hover effects */
		.option-link {
			transition: all 0.3s ease;
		}
		.option-link:hover {
			background-color: #FFB100; /* Gold/Yellow accent */
			color: #111;
			transform: translateY(-3px);
			box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
		}
		.option-link.selected {
			background-color: #FFB100;
			color: #111;
		}

		/* Social icons hover */
		.social-btn {
			transition: color 0.3s ease, transform 0.3s ease;
		}
		.social-btn:hover {
			color: #FFB100;
			transform: scale(1.2);
		}
	</style>
</head>
<body class="text-white relative w-full h-screen flex flex-col justify-between">

	<!-- Native HTML5 Video Background -->
	<video id="video_background" autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover -z-20">
		<source src="index/video/video_bg.mp4" type="video/mp4">
		<source src="index/video/video_bg.webm" type="video/webm">
		<source src="index/video/video_bg.ogg" type="video/ogg">
	</video>

	<!-- Grid Pattern Overlay -->
	<div class="absolute inset-0 pattern-overlay opacity-60 -z-10"></div>

	<!-- Main Content Area -->
	<main class="flex-grow flex flex-col items-center justify-center text-center px-4 pt-10">
		<img src="index/img/logo_central.png" alt="GoldTugAnime Logo" class="max-w-xs md:max-w-md lg:max-w-lg mb-8 opacity-0 animate-fade-in-up" />
		
		<h1 class="text-3xl md:text-5xl font-bold mb-4 drop-shadow-lg opacity-0 animate-fade-in-up animate-delay-300">
			<span class="block text-gray-200 text-2xl md:text-3xl font-light mb-2">O melhor da animação</span>
			<span class="block text-white">Escolhe o teu destino!</span>
		</h1>
		
		<p class="text-sm sm:text-base md:text-xl text-gray-300 font-light mt-4 drop-shadow-md max-w-full px-2 opacity-0 animate-fade-in-up animate-delay-500">
			Sejam bem-vindos à mais bela comunidade de animação em português de Portugal!
		</p>
	</main>

	<!-- Portfolio Options -->
	<section class="w-full pb-8 z-10 px-4">
		<div class="container mx-auto flex justify-center">
			<ul class="flex flex-wrap justify-center gap-4">
				<li>
					<a href="./forum" class="option-link selected flex items-center gap-2 px-6 py-3 rounded-full border border-gray-400 bg-black/40 backdrop-blur-sm text-sm font-bold uppercase tracking-wider">
						<i class="fa-solid fa-heart"></i>
						<span>Fórum</span>
					</a>
				</li>
				<li>
					<a href="//facebook.com/goldtuganimeoficial" class="option-link flex items-center gap-2 px-6 py-3 rounded-full border border-gray-400 bg-black/40 backdrop-blur-sm text-sm font-bold uppercase tracking-wider text-white">
						<i class="fa-brands fa-facebook-f"></i>
						<span>Facebook</span>
					</a>
				</li>
				<li>
					<a href="//instagram.com/GoldTugAnime" class="option-link flex items-center gap-2 px-6 py-3 rounded-full border border-gray-400 bg-black/40 backdrop-blur-sm text-sm font-bold uppercase tracking-wider text-white">
						<i class="fa-brands fa-instagram"></i>
						<span>Instagram</span>
					</a>
				</li>
				<li>
					<a href="//youtube.com/GoldTugAnimeOFICIAL" class="option-link flex items-center gap-2 px-6 py-3 rounded-full border border-gray-400 bg-black/40 backdrop-blur-sm text-sm font-bold uppercase tracking-wider text-white">
						<i class="fa-brands fa-youtube"></i>
						<span>Youtube</span>
					</a>
				</li>
			</ul>
		</div>
	</section>

	<!-- Footer with Controls -->
	<footer class="w-full bg-black/60 backdrop-blur-md py-4 z-10">
		<div class="container mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
			
			<!-- Video Controls -->
			<ul class="flex items-center gap-6 text-xl text-gray-300">
				<li><button id="btn-mute" class="social-btn focus:outline-none"><i class="fa-solid fa-volume-xmark"></i></button></li>
				<li class="text-gray-600">|</li>
				<li><button id="btn-rewind" class="social-btn focus:outline-none"><i class="fa-solid fa-backward"></i></button></li>
				<li><button id="btn-play" class="social-btn focus:outline-none text-2xl"><i class="fa-solid fa-pause"></i></button></li>
				<li><button id="btn-forward" class="social-btn focus:outline-none"><i class="fa-solid fa-forward"></i></button></li>
			</ul>

			<!-- Copyright -->
			<p class="text-sm text-gray-400 font-light text-center md:text-right">
				Copyright &copy; 2007-<span id="current-year"></span> - GoldTugAnime
			</p>
		</div>
	</footer>

	<!-- Vanilla JS Logic -->
	<script>
		// Set current year
		document.getElementById('current-year').textContent = new Date().getFullYear();

		const video = document.getElementById('video_background');
		const btnPlay = document.getElementById('btn-play');
		const btnMute = document.getElementById('btn-mute');
		const btnRewind = document.getElementById('btn-rewind');
		const btnForward = document.getElementById('btn-forward');

		// Fallback for mobile devices to ensure background image if video can't autoplay
		if (window.innerWidth <= 1200) {
			video.style.display = 'none';
			document.body.style.backgroundImage = "url('index/video/video_bg.jpg')";
			document.body.style.backgroundSize = "cover";
			document.body.style.backgroundPosition = "center";
		}

		// Play / Pause logic
		btnPlay.addEventListener('click', () => {
			if (video.paused) {
				video.play();
				btnPlay.innerHTML = '<i class="fa-solid fa-pause"></i>';
			} else {
				video.pause();
				btnPlay.innerHTML = '<i class="fa-solid fa-play"></i>';
			}
		});

		// Mute / Unmute logic
		btnMute.addEventListener('click', () => {
			if (video.muted) {
				video.muted = false;
				btnMute.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
			} else {
				video.muted = true;
				btnMute.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
			}
		});

		// Rewind 5 seconds
		btnRewind.addEventListener('click', () => {
			video.currentTime = Math.max(0, video.currentTime - 5);
		});

		// Forward 5 seconds
		btnForward.addEventListener('click', () => {
			video.currentTime = Math.min(video.duration, video.currentTime + 5);
		});
	</script>
</body>
</html>
