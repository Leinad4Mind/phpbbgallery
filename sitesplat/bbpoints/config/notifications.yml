services:
# ----- BB points notification types -----
# Scope MUST be prototype for all the plugins to work.
    sitesplat.bbpoints.notification.type.transfer:
        class: sitesplat\bbpoints\notification\type\transfer
        scope: prototype
        arguments:
            - @user_loader
            - @dbal.conn
            - @cache.driver
            - @user
            - @auth
            - @config
            - %core.root_path%
            - %core.php_ext%
            - %tables.notification_types%
            - %tables.notifications%
            - %tables.user_notifications%
        tags:
            - { name: notification.type }
