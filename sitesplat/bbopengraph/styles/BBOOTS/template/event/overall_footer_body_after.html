<div class="popup-wrap">
    <div class="popup-box">
        <ul class="list-unstyled sharer-mobile">
			<li><button class="sharer btn" data-sharer="twitter" data-url="{URL_BBOPENGRAPH}" data-title="{TITLE_BBOPENGRAPH}" data-description="{DESC_BBOPENGRAPH}" data-image="{IMG_BBOPENGRAPH}" data-via="{BBOPENGRAPH_TT_ID}"><i class="icn-twitter"></i></button></li>
			<li><button class="sharer btn" data-sharer="facebook" data-url="{URL_BBOPENGRAPH}" data-title="{TITLE_BBOPENGRAPH}" data-description="{DESC_BBOPENGRAPH}" data-image="{IMG_BBOPENGRAPH}"><i class="icn-facebook"></i></button></li>
			<li><button class="sharer btn" data-sharer="googleplus" data-url="{URL_BBOPENGRAPH}" data-title="{TITLE_BBOPENGRAPH}" data-description="{DESC_BBOPENGRAPH}" data-image="{IMG_BBOPENGRAPH}"><i class="icn-googleplus"></i></button></li>
			<li><button class="sharer btn" data-sharer="pinterest" data-url="{URL_BBOPENGRAPH}" data-title="{TITLE_BBOPENGRAPH}" data-description="{DESC_BBOPENGRAPH}" data-image="{IMG_BBOPENGRAPH}"><i class="icn-pinterest"></i></button></li>
			<li><button class="sharer btn" data-sharer="whatsapp" data-url="{URL_BBOPENGRAPH}" data-title="{TITLE_BBOPENGRAPH}" data-description="{DESC_BBOPENGRAPH}" data-image="{IMG_BBOPENGRAPH}"><i class="icn-whatsapp"></i></button></li>
			<li><button class="sharer btn" data-sharer="telegram" data-url="{URL_BBOPENGRAPH}" data-title="{TITLE_BBOPENGRAPH}" data-description="{DESC_BBOPENGRAPH}" data-image="{IMG_BBOPENGRAPH}"><i class="icn-telegram"></i></button></li>
			<li><button class="sharer btn" data-sharer="viber" data-url="{URL_BBOPENGRAPH}" data-title="{TITLE_BBOPENGRAPH}" data-description="{DESC_BBOPENGRAPH}" data-image="{IMG_BBOPENGRAPH}"><i class="icn-viber"></i></button></li>
	        <li><button class="sharer btn" data-sharer="email" data-url="{URL_BBOPENGRAPH}" data-title="{TITLE_BBOPENGRAPH}" data-description="{DESC_BBOPENGRAPH}" data-subject="Hey! Check out that URL"><i class="icn-mail"></i></button></li>
		</ul>
      <a class="close-btn popup-close" href="javascript:void(0)"><i class="fa fa-times"></i></a>
    </div>
</div>
