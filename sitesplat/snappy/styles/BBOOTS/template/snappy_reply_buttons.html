	</div>

	<!-- ENDIF -->
	<!-- END custom_tags -->
	
	<!-- BEGIN custom_tags -->
	<!-- IF custom_tags.BBCODE_TAG eq 'c' -->

				<option value="200">{L_FONT_HUGE}</option>

		<!-- ENDIF -->
