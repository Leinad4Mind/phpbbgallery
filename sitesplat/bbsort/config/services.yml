services:
    sitesplat.bbsort.controller:
        class: sitesplat\bbsort\controller\main
        arguments:
            - '@config'
            - '@controller.helper'
            - '@template'
            - '@user'

    sitesplat.bbsort.listener:
        class: sitesplat\bbsort\event\main_listener
        arguments:
            - '@template'
            - '@language'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }
