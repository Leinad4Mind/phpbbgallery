services:
  sitesplat.nemtions.controller:
    class: sitesplat\nemtions\controller\controller
    arguments:
      - @auth
      - @dbal.conn
      - @request
      - @user
      - %core.table_prefix%groups
      - %tables.posts%
      - %tables.topics%
      - %tables.users%
  sitesplat.nemtions.listener:
    class: sitesplat\nemtions\event\listener
    arguments:
      - @controller.helper
      - @notification_manager
      - @template
    tags:
      - { name: event.listener }
  sitesplat.nemtions.notification:
    class: sitesplat\nemtions\notification\notification
    scope: prototype
    arguments:
      - @user_loader
      - @dbal.conn
      - @cache.driver
      - @user
      - @auth
      - @config
      - %core.root_path%
      - %core.php_ext%
      - %tables.notification_types%
      - %tables.notifications%
      - %tables.user_notifications%
    calls:
      - [setNemtionsTables, [%core.table_prefix%groups, %core.table_prefix%user_group, %tables.users%]]
    tags:
      - { name: notification.type }
