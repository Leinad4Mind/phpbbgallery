services:
# ----- Badge types -----
# Scope MUST be prototype for all the plugins to work.
    sitesplat.badge.type.bookmarked:
        class: sitesplat\badgepremium\conditions\type\bookmarked
        scope: prototype
        arguments:
            - @service_container
            - @dbal.conn
            - @user
            - %sitesplat.badge.tables.badge_rules%
            - %sitesplat.badge.tables.badge_types%
            - %sitesplat.badge.tables.badge_events%
            - %core.root_path%
            - %core.php_ext%
        tags:
            - { name: sitesplat.badge.type }

