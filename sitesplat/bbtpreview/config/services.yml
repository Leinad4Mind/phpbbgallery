services:
    sitesplat.bbtpreview.listener:
        class: sitesplat\bbtpreview\event\listener
        arguments:
            - @dbal.conn
            - @user
            - @auth
            - @template
            - @service_container
        tags:
            - { name: event.listener }
    sitesplat.bbtpreview.controller:
        class: sitesplat\bbtpreview\controller\main_controller
        arguments:
            - @config
            - @user
            - @request
            - @auth
            - @dbal.conn
            - @ext.manager
            - %core.php_ext%
