services:
    avatar.driver.generator:
        class: sitesplat\avatarsplus\avatar\driver\generator
        arguments:
            - @config
            - %core.root_path%
            - %core.php_ext%
            - @path_helper
            - @cache.driver
        calls:
            - [set_name, [avatar.driver.generator]]
        tags:
            - { name: avatar.driver }

    avatar.driver.material:
        class: sitesplat\avatarsplus\avatar\driver\material
        arguments:
            - @config
            - %core.root_path%
            - %core.php_ext%
            - @path_helper
            - @cache.driver
        calls:
            - [set_name, [avatar.driver.material]]
        tags:
            - { name: avatar.driver }

    sitesplat.avatarsplus.controller:
        class: sitesplat\avatarsplus\controller\main_controller
        arguments:
            - '@request'
            - '@user'
            - '%core.root_path%/ext/sitesplat/avatarsplus/'
