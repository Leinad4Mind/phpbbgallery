<!-- IF postrow.POSITIVE or postrow.NEGATIVE -->
<div class="user-profile-row">
	<div class="user-profile-tag">{L_BBREACTION}</div>
		<div class="user-profile-output">
			<div class="progress progress-sm"> 
			  <div class="progress-bar progress-bar-success progress-bar-striped" aria-valuemax="100" style="width:{postrow.POSITIVE}%;">
			   {postrow.POSITIVE}%
			  </div>
			  <div class="progress-bar progress-bar-danger progress-bar-striped" aria-valuemax="100" style="width:{postrow.NEGATIVE}%;">
			  {postrow.NEGATIVE}%
			  </div>
			</div>
		</div>
</div>
<!-- ENDIF -->
