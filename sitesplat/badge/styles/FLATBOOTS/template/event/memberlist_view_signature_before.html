<!-- IF .badges -->
<div class="clearfix">
<div class="side-segment"><h3>{L_BADGE_USER}</h3></div>
<div class="row">
	<!-- BEGIN badges -->
	<div class="col-sm-4 col-md-3">
			<div class="panel panel-default">
				<div class="panel-body">
				 <div class="pull-right img-avatar">
				  <img class="avatar-sm" src="{badges.BADGE}" title="{badges.NAME}" alt="{badges.NAME}"/>
				 </div>
				 <div class="pull-left">
				 <div class="push-5 text-overflow" style="overflow: hidden;max-width: 170px;">{badges.TITLE}</div>
				 <span class="hide">{badges.DESCRIPTION}</span>
				 <div class="text-muted">{badges.DATE}</div>
				 </div>
				</div>
			</div>
	</div>
	<!-- END badges -->
</div>	
</div>
<!-- ENDIF -->
