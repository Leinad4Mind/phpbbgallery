services:
# ----- Badge notification types -----
# Scope MUST be prototype for all the plugins to work.
    sitesplat.badge.notification.type.award_added:
        class: sitesplat\badge\notification\type\award_added
        scope: prototype
        arguments:
            - @user_loader
            - @dbal.conn
            - @cache.driver
            - @user
            - @auth
            - @config
            - %core.root_path%
            - %core.php_ext%
            - %tables.notification_types%
            - %tables.notifications%
            - %tables.user_notifications%
        tags:
            - { name: notification.type }

    sitesplat.badge.notification.type.award_removed:
        class: sitesplat\badge\notification\type\award_removed
        scope: prototype
        arguments:
            - @user_loader
            - @dbal.conn
            - @cache.driver
            - @user
            - @auth
            - @config
            - %core.root_path%
            - %core.php_ext%
            - %tables.notification_types%
            - %tables.notifications%
            - %tables.user_notifications%
        tags:
            - { name: notification.type }
