services:
    sitesplat.badge.type_collection:
        class: phpbb\di\service_collection
        arguments:
            - '@service_container'
        tags:
            - { name: service_collection, tag: sitesplat.badge.type }

    sitesplat.badge.type:
        abstract: true
        arguments:
            - '@service_container'
            - '@dbal.conn'
            - '@user'
            - '%sitesplat.badge.tables.badge_rules%'
            - '%sitesplat.badge.tables.badge_types%'
            - '%sitesplat.badge.tables.badge_events%'
            - '%core.root_path%'
            - '%core.php_ext%'

# ----- Badge types -----
# Services MUST not be shared for all the plugins to work.
    sitesplat.badge.type.avatar:
        class: sitesplat\badge\conditions\type\avatar
        shared: false
        parent: sitesplat.badge.type
        tags:
            - { name: sitesplat.badge.type }

    sitesplat.badge.type.badges:
        class: sitesplat\badge\conditions\type\badges
        shared: false
        parent: sitesplat.badge.type
        tags:
            - { name: sitesplat.badge.type }

    sitesplat.badge.type.birthdays:
        class: sitesplat\badge\conditions\type\birthdays
        shared: false
        parent: sitesplat.badge.type
        tags:
            - { name: sitesplat.badge.type }

    sitesplat.badge.type.custom:
        class: sitesplat\badge\conditions\type\custom
        shared: false
        parent: sitesplat.badge.type
        tags:
            - { name: sitesplat.badge.type }

    sitesplat.badge.type.donations:
        class: sitesplat\badge\conditions\type\donations
        shared: false
        parent: sitesplat.badge.type
        tags:
            - { name: sitesplat.badge.type }

    sitesplat.badge.type.likedd:
        class: sitesplat\badge\conditions\type\likedd
        shared: false
        parent: sitesplat.badge.type
        tags:
            - { name: sitesplat.badge.type }

    sitesplat.badge.type.membership:
        class: sitesplat\badge\conditions\type\membership
