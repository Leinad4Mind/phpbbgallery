services:
# ----- Auto groups types -----
# Scope MUST be prototype for all the plugins to work.
    sitesplat.badgeautogroups.type.avatar:
        class: sitesplat\badgeautogroups\conditions\type\avatar
        scope: prototype
        arguments:
            - @service_container
            - @dbal.conn
            - @user
            - %phpbb.autogroups.tables.autogroups_rules%
            - %phpbb.autogroups.tables.autogroups_types%
            - %core.root_path%
            - %core.php_ext%
        tags:
            - { name: phpbb.autogroups.type }

