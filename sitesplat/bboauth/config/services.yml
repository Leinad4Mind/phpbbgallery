services:
    auth.provider.oauth.service.coinbase:
        class: sitesplat\bboauth\auth\provider\oauth\service\coinbase
        arguments:
            - '@config'
            - '@request'
            - '@user'
        tags:
            - { name: auth.provider.oauth.service }

    auth.provider.oauth.service.discord:
        class: sitesplat\bboauth\auth\provider\oauth\service\discord
        arguments:
            - '@config'
            - '@request'
            - '@user'
        tags:
            - { name: auth.provider.oauth.service }

    auth.provider.oauth.service.dropbox:
        class: sitesplat\bboauth\auth\provider\oauth\service\dropbox
        arguments:
            - '@config'
            - '@request'
            - '@user'
        tags:
            - { name: auth.provider.oauth.service }

    auth.provider.oauth.service.github:
        class: sitesplat\bboauth\auth\provider\oauth\service\github
        arguments:
            - '@config'
            - '@request'
            - '@user'
        tags:
            - { name: auth.provider.oauth.service }

    auth.provider.oauth.service.instagram:
        class: sitesplat\bboauth\auth\provider\oauth\service\instagram
        arguments:
            - '@config'
            - '@request'
            - '@user'
        tags:
            - { name: auth.provider.oauth.service }

    auth.provider.oauth.service.razer:
        class: sitesplat\bboauth\auth\provider\oauth\service\razer
        arguments:
            - '@config'
            - '@request'
            - '@user'
        tags:
            - { name: auth.provider.oauth.service }

    auth.provider.oauth.service.slack:
        class: sitesplat\bboauth\auth\provider\oauth\service\slack
        arguments:
            - '@config'
            - '@request'
            - '@user'
        tags:
            - { name: auth.provider.oauth.service }

    sitesplat.bboauth.listener:
        class: sitesplat\bboauth\event\listener
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@template'
            - '@config'
            - '@auth'
            - '@auth.provider_collection'
            - '%tables.users%'
        tags:
            - { name: event.listener }

    sitesplat.bboauth.acp_listener:
        class: sitesplat\bboauth\event\acp_listener
        arguments:
            - '@dbal.conn'
            - '@group_helper'
            - '%tables.groups%'
        tags:
            - { name: event.listener }

    sitesplat.bboauth.oauth_reg_listener:
        class: sitesplat\bboauth\event\oauth_reg_listener
        arguments:
            - '@request'
            - '@config'
            - '@auth'
            - '@user'
            - '@language'
            - '@template'
            - '@dbal.conn'
            - '@dispatcher'
            - '@auth.provider.oauth.service.facebook'
            - '@auth.provider.oauth.service.twitter'
            - '@auth.provider.oauth.service.google'
            - '@auth.provider.oauth.service.coinbase'
            - '@auth.provider.oauth.service.discord'
            - '@auth.provider.oauth.service.dropbox'
            - '@auth.provider.oauth.service.github'
            - '@auth.provider.oauth.service.razer'
            - '%tables.auth_provider_oauth_token_storage%'
            - '%tables.auth_provider_oauth_states%'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }
