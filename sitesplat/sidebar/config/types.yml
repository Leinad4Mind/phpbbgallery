services:
    sitesplat.sidebar.type_collection:
        class: phpbb\di\service_collection
        arguments:
            - @service_container
        tags:
            - { name: service_collection, tag: sitesplat.sidebar.type }

# ----- Badge types -----
# Scope MUST be prototype for all the plugins to work.
    sitesplat.sidebar.type.bbdownloads:
        class: sitesplat\sidebar\types\type\bbdownloads
        scope: prototype
        arguments:
            - @service_container
            - @dbal.conn
            - @user
            - @config
            - @cache.driver
            - @auth
            - @template
            - %sitesplat.sidebar.tables.sidebar_types%
            - %core.root_path%
            - %core.php_ext%
        tags:
            - { name: sitesplat.sidebar.type }

