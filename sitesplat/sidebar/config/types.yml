services:
    sitesplat.sidebar.type_collection:
        class: phpbb\di\service_collection
        arguments:
            - '@service_container'
        tags:
            - { name: service_collection, tag: sitesplat.sidebar.type }

    sitesplat.sidebar.type.base:
        abstract: true
        arguments:
            - '@service_container'
            - '@dbal.conn'
            - '@user'
            - '@config'
            - '@cache.driver'
            - '@auth'
            - '@template'
            - '%sitesplat.sidebar.tables.sidebar_types%'
            - '%core.root_path%'
            - '%core.php_ext%'

# ----- Sidebar's types -----
# Service MUST NOT be shared for all the plugins to work.
    sitesplat.sidebar.type.last_bbreactions:
        class: sitesplat\sidebar\types\type\last_bbreactions
        shared: false
        parent: sitesplat.sidebar.type.base
        tags:
            - { name: sitesplat.sidebar.type }

    sitesplat.sidebar.type.bbdownloads:
        class: sitesplat\sidebar\types\type\bbdownloads
        shared: false
        parent: sitesplat.sidebar.type.base
