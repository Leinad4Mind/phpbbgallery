<!-- IF GE_ENABLED -->
<div class="panel bg3" id="giphy-panel">
	<div class="inner">
   
	<p>{L_GE_TAB_EXPLAIN}</p>
	<dl style="clear: left;">    	
		<dt><label for="subject">{L_GE_TAB_SEARCHBOX}</label></dt>
		<dd>
        <input type="text" name="giphysearch" id="giphysearch" size="45" maxlength="124" tabindex="2" value="Funny Cats" class="inputbox autowidth">
        <a class="button giphy">{L_SEARCH}</a>
        <a class="button more" style="display:none">{L_MORE}</a>
        <a class="button back" style="display:none">{L_BACK}</a>
        </dd>
	</dl>
	<hr class="dashed" />
    <div class="gifpanel"></div>
    <div style="text-align:center">
    	<img src="{BOARD_URL}ext/splicker/giphyembed/styles/all/template/pbg.gif" />    
    </div>
	</div>
</div>
<!-- ENDIF -->
