{% if MCHAT_ROOMS_ENABLED_AUTH %}
<dl>
	<dt><label for="user_mchat_rooms_enabled">{{ lang('MCHAT_ROOMS_ENABLED') ~ lang('COLON') }}</label></dt>
	<dd>
		<label><input type="radio" name="user_mchat_rooms_enabled" value="1"{{ MCHAT_ROOMS_ENABLED ? ' id="user_mchat_rooms_enabled" checked="checked"' }}> {{ lang('YES') }}</label>
		<label><input type="radio" name="user_mchat_rooms_enabled" value="0"{{ not MCHAT_ROOMS_ENABLED ? ' id="user_mchat_rooms_enabled" checked="checked"' }}> {{ lang('NO') }}</label>
	</dd>
</dl>
{% endif %}
