{% if loops.mchatroom | length %}
<div class="mchat-rooms-dropdown">
	<span>{{ lang('MCHATROOMS_ARCHIVE') ~ lang('COLON') }}</span>
	<select title="{{ lang('MCHATROOMS_ARCHIVE') }}">
	{% for mchatroom in loops.mchatroom %}
		<option value="{{ mchatroom.U_ARCHIVE }}"{{ not mchatroom.IS_ENTERED ? ' disabled' : mchatroom.IS_ACTIVE ? ' selected' }}>{{ mchatroom.NAME }}</option>
	{% endfor %}
	</select>
</div>
{% endif %}
