imports:
    - { resource: parameters.yml }

services:

    leinad4mind.limitperforum.main_listener:
        class: 'leinad4mind\limitperforum\event\main_listener'
        arguments:
            - '@user'
            - '@auth'
            - '@language'
            - '@dbal.conn'
            - '@path_helper'
            - '@leinad4mind.limitperforum.forum_groups_manager'
        tags:
            - { name: 'event.listener' }

    leinad4mind.limitperforum.acp_listener:
        class: 'leinad4mind\limitperforum\event\acp_listener'
        arguments:
            - '@language'
            - '@request'
            - '@template'
            - '@leinad4mind.limitperforum.forum_groups_manager'
        tags:
            - { name: 'event.listener' }

    leinad4mind.limitperforum.forum_groups_manager:
        class: 'leinad4mind\limitperforum\manager\forum_groups_manager'
        arguments:
            - '@dbal.conn'
            - '@group_helper'
            - '%leinad4mind.limitperforum.table.forum_groups%'
