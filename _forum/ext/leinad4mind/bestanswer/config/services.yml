services:
    leinad4mind.bestanswer.controller:
        class: leinad4mind\bestanswer\controller\main_controller
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@language'
            - '@log'
            - '@request'
            - '@user'
            - '@notification_manager'
            - '@ext.manager'
            - '%core.table_prefix%'
            - '%core.root_path%'
            - '%core.php_ext%'

    leinad4mind.bestanswer.listener:
        class: leinad4mind\bestanswer\event\main_listener
        arguments:
            - '@config'
            - '@auth'
            - '@dbal.conn'
            - '@controller.helper'
            - '@language'
            - '@request'
            - '@template'
            - '@user'
            - '@log'
            - '@ext.manager'
            - '%core.table_prefix%'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }

    leinad4mind.bestanswer.notification.type.markanswer:
        class: leinad4mind\bestanswer\notification\type\markanswer
        shared: false
        parent: notification.type.base
        calls:
            - [set_user_loader, ['@user_loader']]
        tags:
            - { name: notification.type }

    leinad4mind.bestanswer.notification.type.unmarkanswer:
        class: leinad4mind\bestanswer\notification\type\unmarkanswer
        shared: false
        parent: notification.type.base
        calls:
            - [set_user_loader, ['@user_loader']]
        tags:
            - { name: notification.type }
