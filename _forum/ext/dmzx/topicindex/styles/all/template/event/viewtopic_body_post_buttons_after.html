{% if postrow.TOPICINDEX_ACTION and postrow.S_CAN_MANAGE_TOPIC_INDEX %}
<li>
	<form method="post" action="{{ postrow.U_TOPICINDEX_MANAGE }}">
		<input type="hidden" name="topicindex_action" value="{{ postrow.TOPICINDEX_ACTION }}">
		<input type="hidden" name="topic_id" value="{{ postrow.TOPICINDEX_TOPIC_ID }}">
		<input type="hidden" name="return_topic" value="{{ postrow.TOPICINDEX_RETURN_TOPIC }}">
		<button class="button button-icon-only" type="submit" title="{{ postrow.IINEDX_LANG }}"><i class="icon {{ postrow.IINDEX_ICON }}" aria-hidden="true"></i><span class="sr-only">{{ postrow.IINEDX_LANG }}</span></button>
		{{ S_FORM_TOKEN_TOPICINDEX }}
	</form>
</li>
{% endif %}
