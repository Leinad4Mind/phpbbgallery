imports:
    - { resource: alias.yml }

services:
    _defaults:
        autowire: true
        bind:
            $ext_images_path: '%core.root_path%ext/devspace/dropboxupload/adm/style/images'
        public: true

    devspace.dropboxupload.listener:
        class: devspace\dropboxupload\event\listener
        tags:
            - { name: event.listener }

    devspace.dropboxupload.admin.controller:
        class: devspace\dropboxupload\controller\admin_controller

    devspace.dropboxupload.main.controller:
        class: devspace\dropboxupload\controller\main_controller

    devspace.dropboxupload.core.functions:
        class: devspace\dropboxupload\core\functions
