services:
    devspace.userdefaults.settings_policy:
        class: devspace\userdefaults\core\settings_policy
        public: false

    devspace.userdefaults.listener:
        class: devspace\userdefaults\event\listener
        arguments:
            - '@config'
            - '@devspace.userdefaults.settings_policy'
        public: false
        tags:
            - { name: event.listener }

    devspace.userdefaults.admin.controller:
        class: devspace\userdefaults\controller\admin_controller
        arguments:
            - '@config'
            - '@request'
            - '@template'
            - '@user'
            - '@log'
            - '@language'
            - '@devspace.userdefaults.settings_policy'
        public: true
