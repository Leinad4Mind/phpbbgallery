imports:
    - { resource: tables.yml }

services:
    sitesplat.bbtags.search_query:
        class: sitesplat\bbtags\tags\search_query
    sitesplat.bbtags.filter_url:
        class: sitesplat\bbtags\tags\filter_url
        arguments:
            - '@controller.helper'
            - '@config'
    sitesplat.bbtags.manager:
        class: sitesplat\bbtags\tags\manager
        arguments:
            - '@dbal.conn.driver'
            - '@config'
            - '@auth'
            - '%sitesplat.bbtags.tables.bbtags%'
            - '%sitesplat.bbtags.tables.bbtags_context%'
            - '%sitesplat.bbtags.tables.bbtags_scope%'
            - '%sitesplat.bbtags.tables.bbtags_topic%'
            - '%sitesplat.bbtags.tables.bbtags_suggestions%'
    sitesplat.bbtags.provider.services:
        class: phpbb\di\service_collection
        arguments:
            - '@service_container'
        tags:
            - { name: service_collection, tag: sitesplat.bbtags.provider }
    sitesplat.bbtags.provider_registry:
        class: sitesplat\bbtags\provider\provider_registry
        arguments:
            - '@sitesplat.bbtags.provider.services'
    sitesplat.bbtags.provider.forum_topics:
        class: sitesplat\bbtags\provider\forum_provider
        arguments:
            - '@sitesplat.bbtags.manager'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: sitesplat.bbtags.provider }
    sitesplat.bbtags.moderation:
        class: sitesplat\bbtags\tags\moderation
        arguments:
            - '@dbal.conn.driver'
            - '@sitesplat.bbtags.provider_registry'
            - '@sitesplat.bbtags.manager'
            - '%sitesplat.bbtags.tables.bbtags_suggestions%'
    sitesplat.bbtags.listener:
        class: sitesplat\bbtags\event\listener
        arguments:
            - '@auth'
            - '@controller.helper'
            - '@template'
            - '@user'
            - '@config'
            - '@request'
            - '@sitesplat.bbtags.manager'
            - '@sitesplat.bbtags.moderation'
            - '@sitesplat.bbtags.filter_url'
        tags:
            - { name: event.listener }
    sitesplat.bbtags.controller:
        class: sitesplat\bbtags\controller\main
        arguments:
            - '@dbal.conn.driver'
            - '@config'
            - '@template'
            - '@controller.helper'
            - '@request'
            - '@user'
            - '@auth'
            - '@cache'
            - '@pagination'
            - '@dispatcher'
            - '@content.visibility'
            - '%core.php_ext%'
            - '%core.root_path%'
            - '@sitesplat.bbtags.manager'
            - '@sitesplat.bbtags.search_query'
            - '@sitesplat.bbtags.filter_url'
            - '%sitesplat.bbtags.tables.bbtags%'
            - '%sitesplat.bbtags.tables.bbtags_topic%'
