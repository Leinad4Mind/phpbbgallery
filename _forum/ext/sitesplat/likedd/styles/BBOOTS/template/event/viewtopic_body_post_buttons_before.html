{% if postrow.U_LIKE %}
  <div class="btn-group btn-group-post" role="group">
    <a class="btn {{ LIKE_CLASS }} btn-sm btn-likedd-trigger" href="#p{{ postrow.POST_ID }}" title="{{ lang('LIKES_LIKE_IT') }}" data-options="l={{ postrow.POST_ID }}">
      <i class="fa {{ LIKE_ICON }}"></i>
      <span class="hidden-xs">&nbsp;{{ lang('LIKES_LIKE') }}</span>
      <span id="l{{ postrow.POST_ID }}">
        {% if postrow.LIKES %}&nbsp;{{ postrow.LIKES }}
        {% endif %}</span></a>
  </div>
{% endif %}

{% if postrow.U_DISLIKE %}
  <div class="btn-group btn-group-post" role="group">
    <a class="btn {{ DISLIKE_CLASS }} btn-sm btn-likedd-trigger" href="#p{{ postrow.POST_ID }}" title="{{ lang('LIKES_DISLIKE_IT') }}" data-options="d={{ postrow.POST_ID }}">
      <i class="fa {{ DISLIKE_ICON }}"></i>
      <span id="d{{ postrow.POST_ID }}">
        {% if postrow.DISLIKES %}&nbsp;{{ postrow.DISLIKES }}
        {% endif %}</span></a>
  </div>
{% endif %}
