<div class="well well-qr">
<div class="widget-header listen_click" data-toggle="collapse" data-target="#target-col">
    <h4><i class="fa fa-edit"></i> {L_QUICKREPLY}</h4>
    <a class="target-status fa fa-arrow-down" href="javascript:void(0);"></a>
</div>
	<form name="qr_postform" id="qr_postform" method="post" action="{U_QR_ACTION}"{S_FORM_ENCTYPE}>
     <fieldset> 
	 <div id="target-col" class="widget-content collapse">
		<div class="row">			
			<div class="col-md-12">
				<div class="text-center">
				  <!-- EVENT quickreply_editor_panel_before -->
				</div>
				<!-- INCLUDE snappy_reply_buttons.html -->
				<!-- IF S_SMILIES_ALLOWED -->
				 <div class="space10"></div>
				 <div id="quick_reply_smilies" class="text-center">
				  <!-- BEGIN smiley -->
				   <a href="#" onclick="insert_text('{smiley.A_SMILEY_CODE}', true); return false;"><img src="{smiley.SMILEY_IMG}" width="{smiley.SMILEY_WIDTH}" height="{smiley.SMILEY_HEIGHT}" alt="{smiley.SMILEY_CODE}" title="{smiley.SMILEY_DESC}" /></a>
				  <!-- END smiley -->
				  </div>
				 <div class="space10"></div>
				<!-- ENDIF -->
                <div class="panel-qr">
				 <input type="hidden" name="subject" id="subject" value="{SUBJECT}"/>
					<label class="control-label sr-only" for="message">{L_MESSAGE}{L_COLON}</label>
                    <!-- EVENT quickreply_editor_message_before -->				
					<div id="quick_reply_message" class="form-group qr-textarea">
					  <textarea class="form-control ccount" rows="3" placeholder="{L_MESSAGE_ENTER_PLACEHOLDER}" name="message" id="message"></textarea>
					  <span class="label label-success snappy_saved hidden counter_right">{L_SAVED}</span>
					  <a href="javascript:void(0)" title="Clear local storage" class="btn-clr"><i class="fa fa-trash-o"></i></a>
					</div>
					 <div class="space10"></div>
				    <div class="text-left">
					  {S_FORM_TOKEN}
		              {QR_HIDDEN_FIELDS}
		              <a role="button" class="btn btn-default togglesnappy"><i class="fa fa-cog"></i></a>
					  <button type="submit" class="btn btn-default load" disabled="disabled" tabindex="7" name="post" value="{L_SUBMIT}" data-loading-text="{L_LOADING}<i class='fa-spin fa fa-spinner fa-lg icon-white'></i>">{L_SUBMIT}</button>
		              <button type="submit" class="btn btn-default load" disabled="disabled" tabindex="6" name="preview" value="{L_FULL_EDITOR}" id="qr_full_editor" data-loading-text="{L_LOADING}<i class='fa-spin fa fa-spinner fa-lg icon-white'></i>"><span class="hidden-xs">{L_FULL_EDITOR}</span><i class="fa fa-search visible-xs"></i></button>	
				    </div>
			    </div>
            </div>
			<div id="colPanel" class="hidden">
			   <div class="panel-body snappy_options text-left">
				<!-- IF S_BBCODE_ALLOWED --><div><input type="checkbox" name="disable_bbcode" id="disable_bbcode"{S_BBCODE_CHECKED}><label class="icheck-control" for="disable_bbcode">{L_DISABLE_BBCODE}</label></div><!-- ENDIF -->
				<!-- IF S_SMILIES_ALLOWED --><div><input type="checkbox" name="disable_smilies" id="disable_smilies"{S_SMILIES_CHECKED}><label class="icheck-control" for="disable_smilies">{L_DISABLE_SMILIES}</label></div><!-- ENDIF -->
				<!-- IF S_LINKS_ALLOWED --><div><input type="checkbox" name="disable_magic_url" id="disable_magic_url"><label class="icheck-control" for="disable_magic_url">{L_DISABLE_MAGIC_URL}</label></div><!-- ENDIF -->
				<!-- IF S_SIG_ALLOWED --><div><input type="checkbox" name="attach_sig" id="attach_sig"{S_SIGNATURE_CHECKED}><label class="icheck-control" for="attach_sig">{L_ATTACH_SIGNATURE}</label></div><!-- ENDIF -->
				<!-- IF S_NOTIFY_ALLOWED --><div><input type="checkbox" name="notify" id="notify"{S_NOTIFY_CHECKED}><label class="icheck-control" for="notify">{L_NOTIFY_REPLY}</label></div><!-- ENDIF -->
				<!-- IF S_LOCK_TOPIC_ALLOWED --><div><input type="checkbox" name="lock_topic" id="lock_topic"{S_LOCK_TOPIC_CHECKED}><label class="icheck-control" for="lock_topic">{L_LOCK_TOPIC}</label></div><!-- ENDIF -->
				<!-- IF S_LOCK_POST_ALLOWED --><div><input type="checkbox" name="lock_post" id="lock_post"><label class="icheck-control" for="lock_post">{L_LOCK_POST}[{L_LOCK_POST_EXPLAIN}]</label></div><!-- ENDIF -->
	     	    <!-- EVENT quickreply_editor_message_after -->
			    <a role="button" class="btn-link visible-xs pull-right togglesnappy"><i class="fa fa-times"></i></a>
			   </div>
			</div>
		</div>
	  </div>	
	 </fieldset>
	<!-- EVENT quickreply_editor_panel_after -->  
    </form>
</div>
