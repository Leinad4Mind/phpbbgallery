<!-- IF S_BBCODE_ALLOWED and S_BBCODE_IMG -->
<div class="panel-body tab-pane <!-- IF GYAZO_DIRECT_LINK -->active<!-- ENDIF -->" id="posting-gyazo-html">
<p>{L_GYAZO_UPLOAD_MAIN}</p>
<fieldset>

	<div class="fileinput fileinput-new" data-provides="fileinput">
		<button type="submit" name="add_image" value="Upload Image" class="btn btn-success fileinput-exists" <!-- IF not S_PRIVMSGS -->onclick="document.getElementById('postform').action += '#gyazoAnchor';"<!-- ENDIF --> data-loading-text="{L_FILE_UPLOADING}<i class='fa-spin fa fa-spinner fa-lg icon-white'></i>">{L_GYAZO_UPLOAD}</button>
		<span class="btn btn-default btn-file">
			<span class="fileinput-new">{L_GYAZO_SELECT}</span>
			<span class="fileinput-exists">{L_FILE_CHANGE}</span>
			<input type="file" name="gyazo" id="gyazo" accept="image/*"/>
		</span>
		<i class="fa fa-picture-o fileinput-exists"></i>&nbsp;<span class="fileinput-filename"></span>
		<a href="#" class="close close-file-upload fileinput-exists" data-dismiss="fileinput" style="float:none"><i class="fa fa-times"></i></a>
	</div>
  
<div class="row">

   <div class="col-md-6">
	
	<div class="control-group"> 
		<label class="control-label" for="box-gyazo-link">{L_GYAZO_OUTPUT_LINK}{L_COLON}</label>
		<div class="controls controls-row"> 
			<div class="input-group">
				<input type="text" class="form-control" id="box-gyazo-link" value="{GYAZO_DIRECT_LINK}" placeholder="{L_GYAZO_OUTPUT_PLACEHOLDER}">
				<span class="input-group-btn">
					<a class="btn btn-default " id="copy-button-link" data-clipboard-snippet="" title=""><i class="fa fa-clipboard"></i>&nbsp;{L_GYAZO_COPY}</a>
				</span>
		 </div> 
	   </div> 
    </div>
	
	
	</div>

	<div class="col-md-6">
	
	<div class="control-group"> 
		<label class="control-label" for="box-gyazo-img">{L_GYAZO_OUTPUT_IMAGE}{L_COLON}</label>
		<div class="controls controls-row"> 
			<div class="input-group">
				<input type="text" class="form-control" id="box-gyazo-img" value="{GYAZO_DIRECT_IMG}" placeholder="{L_GYAZO_OUTPUT_PLACEHOLDER}">
				<span class="input-group-btn">
					<a class="btn btn-default btn-gyazo-copy" id="copy-button-img" data-clipboard-snippet="" title=""><i class="fa fa-clipboard"></i>&nbsp;{L_GYAZO_COPY}</a>
				</span>
			</div> 
		</div> 
	</div>

	</div>
	
</div>	
	
</fieldset>
</div>
<!-- ENDIF -->
