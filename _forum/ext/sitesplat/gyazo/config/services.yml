services:
    sitesplat.gyazo.listener:
        class: sitesplat\gyazo\event\listener
        arguments:
            - '@config'
            - '@user'
            - '@template'
            - '@request'
        tags:
            - { name: event.listener }

    avatar.driver.gyazo:
        class: sitesplat\gyazo\avatar\driver\gyazo
        arguments:
            - '@config'
            - '@upload_imagesize'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@path_helper'
            - '@cache.driver'
        calls:
            - [set_name, [avatar.driver.gyazo]]
        tags:
            - { name: avatar.driver }
