imports:
    - { resource: avatar.yml }
services:
    sitesplat.bbrandom.controller:
        class: sitesplat\bbrandom\controller\controller
        arguments:
            - @service_container
            - @user
            - @controller.helper
    sitesplat.bbrandom.listener:
        class: sitesplat\bbrandom\event\listener
        arguments:
            - @config
        tags:
            - { name: event.listener }
