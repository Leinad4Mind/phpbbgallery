{% if U_BBREACTION_VIEW and BBREACTION_DISPLAY_TOP_SHOW and BBREACTION_DISPLAY_TOP %}
  <div class="space10"></div>
  <div class="pull-left">
    <div class="bbreactionbar">
      {% for reward in reward %}
        <span title="{{ reward.TITLE }}">
          <i class="{{ reward.CLASSLIST }}" style="color:{% if reward.S_POSITIVE %}green{% else %}red{% endif %};">{{ reward.CONTENTS }}</i>
          {{ reward.PERCENT }}
        </span>
      {% endfor %}
    </div>
  </div>
{% endif %}
