{% if BB_LOAD_IN_VIEWTOPIC %}
  <div class="modal fade" id="ReactionDialog" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
          <h4 class="modal-title">{{ lang('BBREACTION') }}</h4>
        </div>
        <div class="modal-body">
          <div class="row profile-data" id="bbreaction-profile-data" style="margin-left:auto;margin-right:auto;"></div>
        </div>
        <div class="modal-footer">
          <div class="pull-left">
            <a href="{{ U_BBREACTION_PAGE }}" class="btn btn-default btn-sm btn-l-list">
              <i class="fa fa-trophy"></i>&nbsp;{{ lang('BBREACTION_TOP_LIST') }}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  {% INCLUDEJS '@sitesplat_bbreaction/js/bbreaction.min.js' %}
{% endif %}
