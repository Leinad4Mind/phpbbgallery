{% if loops.rewards_memberlist %}
  <li>
    <span class="icon fa fa-heart"></span>
    <label>{{ lang('BBREACTION') ~ lang('COLON') }}</label>&nbsp;<a class="btn-link btn-swap" role="button" data-toggle="collapse" href="#collapseList" aria-expanded="false" aria-controls="collapseList" data-text-swap="{{ lang('CLOSE') }}" data-text-original="{{ lang('OPEN') }}">&#91;{{ lang('OPEN') }}&#93;</a>
    <ul class="collapse" id="collapseList" style="list-style: outside none none;">
      {% for reward_memberlist in loops.rewards_memberlist %}
        <li>
          <i class="{{ reward_memberlist.CLASSLIST }}" style="color:{% if reward_memberlist.S_POSITIVE %}green{% else %}red{% endif %};">{{ reward_memberlist.CONTENTS }}</i>
          <label>&nbsp;&nbsp;{{ reward_memberlist.GIVEN_RECEIVED ~ lang('COLON') }}</label>&nbsp;{{ reward_memberlist.GIVE_RECEIVE }}
        </li>
      {% endfor %}
    </ul>
  </li>
  <script>
    head.ready(function () {
      $(".btn-swap").on("click", function () {
        var el = $(this);
        el.text() == el.data("text-swap")
          ? el.text(el.data("text-original"))
          : el.text(el.data("text-swap"));
      });
    });
  </script>
{% endif %}
