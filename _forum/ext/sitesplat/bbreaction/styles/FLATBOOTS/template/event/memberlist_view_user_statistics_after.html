<!-- IF .rewards_memberlist -->
<li>
<span class="icon fa fa-heart"></span>
<label>{L_BBREACTION}</label>&nbsp;<a class="btn-link btn-swap" role="button" data-toggle="collapse" href="#collapseList" aria-expanded="false" aria-controls="collapseList" data-text-swap="{L_CLOSE}" data-text-original="{L_OPEN}">&#91;{L_OPEN}&#93;</a>
<ul class="collapse" id="collapseList" style="list-style: outside none none;">
<!-- BEGIN rewards_memberlist -->
<li>
  <!-- IF BBREACTION_EMOJI and rewards_memberlist.EMOJI -->
	<span style="color:<!-- IF rewards_memberlist.S_POSITIVE -->green<!-- ELSE -->red<!-- ENDIF -->;">{rewards_memberlist.EMOJI}</span>
  <!-- ELSE -->
  <span class="icon fa {rewards_memberlist.ICON}" style="color:<!-- IF rewards_memberlist.S_POSITIVE -->green<!-- ELSE -->red<!-- ENDIF -->;"></span>
  <!-- ENDIF -->
	<label>&nbsp;&nbsp;{rewards_memberlist.GIVEN_RECIEVED}{L_COLON}</label>&nbsp;{rewards_memberlist.GIVE_RECIEVE}
</li> 	
<!-- END rewards_memberlist -->
</ul>
</li>
<script>
head.ready(function () {
$(".btn-swap").on("click", function() {
  var el = $(this);
  el.text() == el.data("text-swap") 
    ? el.text(el.data("text-original")) 
    : el.text(el.data("text-swap"));
});
});
</script>
<!-- ENDIF -->
