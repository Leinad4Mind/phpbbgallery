services:
    sitesplat.bbcompress.listener:
        class: sitesplat\bbcompress\event\listener
        arguments:
            - '@config'
            - '@log'
            - '@user'
            - '@sitesplat.bbcompress.optimizers.service'
            - '%core.root_path%'
        tags:
            - { name: event.listener }

# optimizer
    sitesplat.bbcompress.optimizers.service:
        class: sitesplat\bbcompress\optimizers\service
        arguments:
            - '@service_container'
            - '@config'
            - '@dbal.conn'
            - '@user'
            - '%core.table_prefix%'

# optimizer drivers
    sitesplat.bbcompress.optimizers.driver.TinyPNG:
        class: sitesplat\bbcompress\optimizers\driver\TinyPNG
        arguments:
            - '@config'
            - '@log'
            - '@user'

    sitesplat.bbcompress.optimizers.driver.PHP:
        class: sitesplat\bbcompress\optimizers\driver\PHP
        arguments:
            - '@log'
            - '@user'

    sitesplat.bbcompress.optimizers.driver.Kraken:
        class: sitesplat\bbcompress\optimizers\driver\Kraken
        arguments:
            - '@config'
            - '@log'
            - '@user'

    sitesplat.bbcompress.optimizers.driver.ImageOptim:
        class: sitesplat\bbcompress\optimizers\driver\ImageOptim
        arguments:
            - '@config'
            - '@log'
            - '@user'
