<!-- INCLUDECSS bblivechat.css -->
<!-- INCLUDE overall_header.html -->

<div id="bblivechat">

	<!-- IF AC_ERROR --><fieldset id="bb-error">{AC_ERROR}</fieldset><!-- ENDIF -->
    <h1 id="ac-title">{{ lang('VIEW_FORUM_LOGS') }}</h1>

<!-- IF .log -->

	<form id="bblc-logs" method="post" action="{U_ACTION}"><fieldset>
		<!-- IF .pagination --><div class="pagination top-pagination"><!-- INCLUDE pagination.html --></div><!-- ENDIF -->
		<table class="table1 zebra-table fixed-width-table">
		<thead><tr>
			<th style="width:25%;">{L_USERNAME} | {L_ROOM} | {L_TIME}</th>
			<th>{L_MESSAGE}</th>
			<th style="width:40px;text-align:center">{L_MARK}</th>
		</tr></thead>
		<tbody>
		<!-- BEGIN log -->
			<tr>
				<td><strong><a href="{U_ACTION}&amp;filter=userID_{log.USER_ID}">{log.NAME}</a></strong><br /><a href="{U_ACTION}&amp;filter=channel_{log.ROOM_ID}">{log.ROOM}</a><br />{log.TIME}</td>
				<td>{log.TEXT}</td>
				<td style="text-align:center"><input type="checkbox" class="radio" name="msg_id[]" value="{log.MSG_ID}" /></td>
			</tr>
		<!-- END log -->
		</tbody>
		</table>
		<!-- IF .pagination --><div class="pagination"><!-- INCLUDE pagination.html --></div><!-- ENDIF -->

		<hr />
		<div style="text-align:{S_CONTENT_FLOW_END}">
			<input class="button1 ssbutton" type="submit" name="submit" value="{{ lang('DELETE_MARKED_PM') }}" />
			<p class="small"><a href="javascript:marklist('bblc-logs', 'msg_id', true)">{L_MARK_ALL}</a> &bull; <a href="javascript:marklist('bblc-logs', 'msg_id', false)">{L_UNMARK_ALL}</a></p>
		</div>
		
		<!-- IF LOG_FILTER --><input type="hidden" name="filter" value="{LOG_FILTER}" /><!-- ENDIF -->
		{S_FORM_TOKEN}
	</fieldset></form>

<!-- ELSE -->
	<div class="errorbox">
		<p>{L_NO_ENTRIES}</p>
	</div>
<!-- ENDIF -->

</div>

<!-- INCLUDE overall_footer.html -->
