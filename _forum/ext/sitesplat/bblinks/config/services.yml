services:
    sitesplat.bblinks.bblinks:
        class: sitesplat\bblinks\core\bblinks
        arguments:
            - '@config'
            - '@config_text'
            - '@user'
            - '@auth'
            - '@dbal.conn'
            - '%core.php_ext%'
            - '@service_container'

    sitesplat.bblinks.listener:
        class: sitesplat\bblinks\event\main_listener
        arguments:
            - '@sitesplat.bblinks.bblinks'
            - '@config'
            - '@template'
            - '@dispatcher'
            - '@dbal.conn'
        tags:
            - { name: event.listener }
