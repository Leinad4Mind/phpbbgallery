<!-- IF .richest_users -->

	  </div>

	<p>
		<!-- BEGIN richest_users -->
			{richest_users.USERNAME}&nbsp;&#40;<!-- IF SYMBOL_POS --><i class="fa {BBPOINTS_SYMBOL}"></i>&nbsp;<!-- ENDIF -->{richest_users.POINTS}<!-- IF not SYMBOL_POS -->&nbsp;<i class="fa {BBPOINTS_SYMBOL}"></i><!-- ENDIF -->&#41;<!-- IF not richest_users.S_LAST_ROW -->&#44;&nbsp;<!-- ENDIF -->

</div>
