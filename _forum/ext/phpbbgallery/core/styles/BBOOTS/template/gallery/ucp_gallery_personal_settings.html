{% if S_PERSONAL_SETTINGS %}
<form id="ucp_gallery" method="post" action="{{ S_UCP_ACTION }}">
	<div class="tab-pane active">
	<fieldset class="framed-ucp">
		<legend>{{ lang('TITLE') }}</legend>
		<p>{{ lang('TITLE_EXPLAIN') }}</p>

		<div class="control-group">
		<label class="control-label" for="watch_own1">{{ lang('WATCH_OWN') }}{{ lang('COLON') }}</label>
		<div class="controls controls-row">
			<div class="radio"><input type="radio" name="watch_own" id="watch_own1" value="1"{% if S_WATCH_OWN %} checked="checked"{% endif %} /><label for="watch_own1">{{ lang('YES') }}</label></div>
			<div class="radio"><input type="radio" name="watch_own" id="watch_own0" value="0"{% if not S_WATCH_OWN %} checked="checked"{% endif %} /><label for="watch_own0">{{ lang('NO') }}</label></div>
		</div>
		</div>

		<div class="control-group">
		<label class="control-label" for="watch_com1">{{ lang('WATCH_COM') }}{{ lang('COLON') }}</label>
		<div class="controls controls-row">
			<div class="radio"><input type="radio" name="watch_com" id="watch_com1" value="1"{% if S_WATCH_COM %} checked="checked"{% endif %} /><label for="watch_com1">{{ lang('YES') }}</label></div>
			<div class="radio"><input type="radio" name="watch_com" id="watch_com0" value="0"{% if not S_WATCH_COM %} checked="checked"{% endif %} /><label for="watch_com0">{{ lang('NO') }}</label></div>
		</div>
		</div>

		<div class="control-group">
		<label class="control-label" for="watch_favo1">{{ lang('WATCH_FAVO') }}{{ lang('COLON') }}</label>
		<div class="controls controls-row">
			<div class="radio"><input type="radio" name="watch_favo" id="watch_favo1" value="1"{% if S_WATCH_FAVO %} checked="checked"{% endif %} /><label for="watch_favo1">{{ lang('YES') }}</label></div>
			<div class="radio"><input type="radio" name="watch_favo" id="watch_favo0" value="0"{% if not S_WATCH_FAVO %} checked="checked"{% endif %} /><label for="watch_favo0">{{ lang('NO') }}</label></div>
		</div>
		</div>

		{% EVENT phpbbgallery_core_ucp_settings_watch %}

		{% if S_COMMENTS_ENABLED %}
		<div class="control-group">
		<label class="control-label" for="allow_comments1">{{ lang('USER_ALLOW_COMMENTS') }}{{ lang('COLON') }}</label>
		<div class="controls controls-row">
			<div class="radio"><input type="radio" name="allow_comments" id="allow_comments1" value="1"{% if S_ALLOW_COMMENTS %} checked="checked"{% endif %} /><label for="allow_comments1">{{ lang('YES') }}</label></div>
			<div class="radio"><input type="radio" name="allow_comments" id="allow_comments0" value="0"{% if not S_ALLOW_COMMENTS %} checked="checked"{% endif %} /><label for="allow_comments0">{{ lang('NO') }}</label></div>
		</div>
		</div>
		{% endif %}

		<div class="control-group">
		<label class="control-label" for="rrc_zebra">{{ lang('RRC_ZEBRA') }}{{ lang('COLON') }}</label>
		<div class="controls controls-row">
			<div class="radio"><input type="radio" name="rrc_zebra" id="rrc_zebra1" value="1"{% if S_RRC_ZEBRA %} checked="checked"{% endif %} /><label for="rrc_zebra1">{{ lang('YES') }}</label></div>
			<div class="radio"><input type="radio" name="rrc_zebra" id="rrc_zebra0" value="0"{% if not S_RRC_ZEBRA %} checked="checked"{% endif %} /><label for="rrc_zebra0">{{ lang('NO') }}</label></div>
		</div>
		</div>
		{% EVENT phpbbgallery_core_ucp_settings_fieldset %}

	</fieldset>

	<div class="space10"></div>

	{% EVENT phpbbgallery_core_ucp_settings_form %}

	<div class="form-actions">
		<button type="reset" value="{{ lang('RESET') }}" name="reset" id="reset" class="btn btn-default">{{ lang('RESET') }}</button>
		<button type="submit" name="submit" value="{{ lang('SUBMIT') }}" class="btn btn-default" autocomplete="off" data-loading-text="{{ lang('LOADING') }}<i class='icon-spin icon-spinner icon-large icon-white'></i>">{{ lang('SUBMIT') }}</button>
		{{ S_FORM_TOKEN }}
	</div>
	</div>
</form>
{% endif %}
