{% if pagination|length or TOTAL_IMAGES %}
	<div class="pull-right">
		<ul class="pagination pagination-sm">
			<li class="active">
				<a>{{ TOTAL_IMAGES }}</a>
			</li>
			{% if pagination|length %}
				 {% include 'pagination.html' %}
			{% else %}
			<li class="active">
				<a>{{ PAGE_NUMBER }}</a>
			</li>
			{% endif %}
		</ul>
	</div>
{% endif %}
