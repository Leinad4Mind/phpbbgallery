<form id="gallery_approve" method="post" action="{S_GALLERY_APPROVE_ACTION}">
	<div class="panel">
		<div class="panel-body">
			<!-- IF U_OVERVIEW -->
			<div class="alert alert-info fade in">
				<button data-dismiss="alert" class="close" type="button" aria-hidden="true"><i class="awe-remove-circle"></i></button>
				<i class="fa fa-warning"></i>&nbsp;<strong>{L_LATEST_IMAGES_UNAPPROVED}</strong>
			</div>
			<!-- ELSE -->
			<div class="alert alert-info fade in">
				<button data-dismiss="alert" class="close" type="button" aria-hidden="true"><i class="awe-remove-circle"></i></button>
				<i class="fa fa-warning"></i>&nbsp;<strong>{TOTAL_IMAGES_WAITING}</strong>
			</div>
			<!-- ENDIF -->
			<!-- IF .unaproved -->
				<div class="topiclist cplist missing-column responsive-show-all">
					<table class="footable table table-striped table-primary table-hover footable-loaded tablet">
						<thead>
							<tr>
								<th data-class="expand" class="footable-visible footable-first-column">{L_GALLERY_MCP_QUEUE_DETAIL}</th>
								<th data-hide="phone" class="footable-visible">Tópico&nbsp;{L_ALBUM}</th>
								<th data-hide="phone" class="footable-visible footable-last-column">Marcar</th>
							</tr>
						</thead>
						<tbody>
							<!-- BEGIN unaproved -->
							<tr>
								<td class="expand footable-visible footable-first-column">
									<div class="list-inner">
										<span style="display: inline; float: left;">
											<a href="{unaproved.U_IMAGE_MODERATE_URL}"><img class="img-responsive" style="max-width: 70px; max-height: 70px;" src="{unaproved.U_IMAGE}" alt="{unaproved.U_IMAGE_NAME}"></a>
										</span>
										<span style="margin-left: 10px;">
											<a href="{unaproved.U_IMAGE_MODERATE_URL}" class="topictitle">{unaproved.U_IMAGE_NAME}</a><br />
											<span style="margin-left: 10px; vertical-align: middle;">{L_UPLOADED_BY_USER}{L_COLON} {unaproved.IMAGE_AUTHOR} &raquo; {unaproved.IMAGE_TIME}</span>
										</span>
									</div>
								</td>
								<td class="footable-visible">
									<div class="moderation">
										<span>
											{L_ALBUM}{L_COLON} <a href="{unaproved.IMAGE_ALBUM_URL}">{unaproved.IMAGE_ALBUM}</a>
										</span>
									</div>
								</td>
								<td class="footable-visible footable-last-column">
									<input name="approval[{unaproved.IMAGE_ALBUM_ID}][]" value="{unaproved.U_IMAGE_ID}" type="checkbox">
								</td>
							</tr>
							<!-- END unaproved -->
						</tbody>
					</table>
			<!-- ELSE -->
				<p> {L_NO_WAITING_UNAPPROVED_IMAGE}
			<!-- ENDIF -->
			</div>
		</div>
		<!-- IF .unaproved -->
		<fieldset class="display-actions">
			<input class="button2 btn btn-danger" name="action[disapprove]" value="{L_DISAPPROVE}" type="submit">&nbsp;
			<input class="button1 btn btn-success" name="action[approve]" value="{L_APPROVE}" type="submit">
			<div class="space10"></div>
			<div class="input-group-btn">
				<a href="javascript:void(0);" onclick="marklist('gallery_approve', 'approval', true); return false;" class="btn btn-default" title="{L_MARK_ALL}"><i class="fa fa-check-square-o"></i></a>
				<a href="javascript:void(0);" onclick="marklist('gallery_approve', 'approval', false); return false;" class="btn btn-default" title="{L_UNMARK_ALL}"><i class="fa fa-square-o"></i></a>
			</div>
		</fieldset>

		<!-- ENDIF -->
	</form>
