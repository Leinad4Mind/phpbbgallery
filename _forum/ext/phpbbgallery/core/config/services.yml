imports:
    - { resource: tables.yml }
    - { resource: services_controller.yml }
    - { resource: services_files.yml }
    - { resource: services_notification_types.yml }


services:
    phpbbgallery.core.album:
        class: phpbbgallery\core\album\album
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@language'
            - '@profilefields.manager'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.cache'
            - '@phpbbgallery.core.block'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.album.data_enricher'
            - '%phpbbgallery.tables.gallery_albums%'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.tables.gallery_watch%'
    phpbbgallery.core.album.display:
        class: phpbbgallery\core\album\display
        arguments:
            - '@auth'
            - '@config'
            - '@controller.helper'
            - '@dbal.conn'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
            - '@language'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.user'
            - '@phpbbgallery.core.misc'
            - '@phpbbgallery.core.policy.image_visibility'
            - '@phpbbgallery.core.album.data_enricher'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%phpbbgallery.tables.gallery_albums%'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.tables.gallery_tracking%'
            - '%phpbbgallery.tables.gallery_moderators%'
    phpbbgallery.core.album.loader:
        class: phpbbgallery\core\album\loader
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@phpbbgallery.core.album.data_enricher'
            - '%phpbbgallery.tables.gallery_albums%'
    phpbbgallery.core.album.data_enricher:
        class: phpbbgallery\core\album\data_enricher
        arguments:
            - '@dispatcher'
    phpbbgallery.core.album.type_registry:
        class: phpbbgallery\core\album\type_registry
        arguments:
            - '@dispatcher'
    phpbbgallery.core.album.manage:
        class: phpbbgallery\core\album\manage
        arguments:
            - '@user'
            - '@language'
            - '@request'
            - '@dbal.conn'
            - '@dispatcher'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.album'
            - '@phpbbgallery.core.album.display'
            - '@phpbbgallery.core.image'
            - '@phpbbgallery.core.cache'
            - '@phpbbgallery.core.user'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.report'
            - '@phpbbgallery.core.log'
            - '@phpbbgallery.core.notification'
            - '%phpbbgallery.tables.gallery_albums%'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.tables.gallery_comments%'
            - '%phpbbgallery.tables.gallery_permissions%'
            - '%phpbbgallery.tables.gallery_moderators%'
            - '%phpbbgallery.tables.gallery_tracking%'
    phpbbgallery.core.misc:
        class: phpbbgallery\core\misc
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@language'
            - '@config'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.user'
            - '@phpbbgallery.core.url'
            - '%phpbbgallery.tables.gallery_tracking%'
    phpbbgallery.core.auth:
        class: phpbbgallery\core\auth\auth
        arguments:
            - '@phpbbgallery.core.cache'
            - '@dbal.conn'
            - '@phpbbgallery.core.user'
            - '@user'
            - '@auth'
            - '%phpbbgallery.tables.gallery_permissions%'
            - '%phpbbgallery.tables.gallery_roles%'
            - '%phpbbgallery.tables.gallery_users%'
            - '%phpbbgallery.tables.gallery_albums%'
            - '@ext.manager'
    phpbbgallery.core.auth.image_authorization:
        class: phpbbgallery\core\auth\image_authorization
    phpbbgallery.core.auth.level:
        class: phpbbgallery\core\auth\level
        arguments:
            - '@phpbbgallery.core.auth'
            - '@config'
            - '@template'
            - '@user'
            - '@language'
    phpbbgallery.core.cache:
        class: phpbbgallery\core\cache
        arguments:
            - '@cache'
            - '@dbal.conn'
            - '%phpbbgallery.tables.gallery_albums%'
            - '%phpbbgallery.tables.gallery_images%'
    phpbbgallery.core.identity_sync:
        class: phpbbgallery\core\identity_sync
        arguments:
            - '@dbal.conn'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.cache'
            - '%phpbbgallery.tables.gallery_albums%'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.tables.gallery_comments%'
            - '%phpbbgallery.tables.gallery_moderators%'
            - '%phpbbgallery.tables.gallery_permissions%'
    phpbbgallery.core.file.tool:
        class: phpbbgallery\core\file\file
        arguments:
            - '@request'
            - '@phpbbgallery.core.url'
            - '@phpbbgallery.core.config'
            - '2'
            - '@phpbbgallery.core.storage.active'
    phpbbgallery.core.image:
        class: phpbbgallery\core\image\image
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@language'
            - '@template'
            - '@dispatcher'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.album'
            - '@phpbbgallery.core.config'
            - '@controller.helper'
            - '@phpbbgallery.core.url'
            - '@phpbbgallery.core.log'
            - '@phpbbgallery.core.notification.helper'
            - '@phpbbgallery.core.report'
            - '@phpbbgallery.core.cache'
            - '@phpbbgallery.core.user'
            - '@phpbbgallery.core.policy.image_visibility'
            - '@phpbbgallery.core.policy.album_operation'
            - '@phpbbgallery.core.file.tool'
            - '@phpbbgallery.core.storage.workspace'
            - '%phpbbgallery.tables.gallery_images%'
    phpbbgallery.core.user:
        class: phpbbgallery\core\user
        arguments:
            - '@dbal.conn'
            - '@dispatcher'
            - '@user'
            - '@profilefields.manager'
            - '@config'
            - '@auth'
            - '%phpbbgallery.tables.gallery_users%'
            - '%core.root_path%'
            - '%core.php_ext%'
    phpbbgallery.core.config:
        class: phpbbgallery\core\config
        arguments:
            - '@config'
    phpbbgallery.core.storage.key_generator:
        class: phpbbgallery\core\storage\key_generator
        arguments:
            - '@phpbbgallery.core.config'
    phpbbgallery.core.storage.variant_key:
        class: phpbbgallery\core\storage\variant_key
    phpbbgallery.core.image.format_registry:
        class: phpbbgallery\core\image\format_registry
        arguments:
            - '@dispatcher'
            - '@service_container'
    phpbbgallery.core.storage.local:
        class: phpbbgallery\core\storage\local_provider
        arguments:
            - '%phpbbgallery.core.file.source%'
            - '%phpbbgallery.core.file.medium%'
            - '%phpbbgallery.core.file.mini%'
    phpbbgallery.core.storage.active:
        class: phpbbgallery\core\storage\active_provider
        arguments:
            - '@phpbbgallery.core.config'
            - '@service_container'
            - '@phpbbgallery.core.storage.local'
            - '@phpbbgallery.core.storage.variant_key'
    phpbbgallery.core.storage.workspace:
        class: phpbbgallery\core\storage\workspace
        arguments:
            - '@phpbbgallery.core.storage.active'
            - '%core.cache_dir%phpbbgallery/storage-workspace/'
    phpbbgallery.core.storage.layout_migrator:
        class: phpbbgallery\core\storage\layout_migrator
        arguments:
            - '@dbal.conn'
            - '@phpbbgallery.core.storage.key_generator'
            - '@phpbbgallery.core.storage.local'
            - '%phpbbgallery.tables.gallery_images%'
            - '@phpbbgallery.core.storage.variant_key'
    phpbbgallery.core.report:
        class: phpbbgallery\core\report
        arguments:
            - '@phpbbgallery.core.log'
            - '@phpbbgallery.core.auth'
            - '@user'
            - '@language'
            - '@dbal.conn'
            - '@user_loader'
            - '@phpbbgallery.core.album'
            - '@template'
            - '@controller.helper'
            - '@phpbbgallery.core.config'
            - '@pagination'
            - '@phpbbgallery.core.notification.helper'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.tables.gallery_reports%'
    phpbbgallery.core.comment:
        class: phpbbgallery\core\comment
        arguments:
            - '@user'
            - '@dbal.conn'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.block'
            - '@phpbbgallery.core.policy.album_operation'
            - '%phpbbgallery.tables.gallery_comments%'
            - '%phpbbgallery.tables.gallery_images%'
    phpbbgallery.core.url:
        class: phpbbgallery\core\url
        arguments:
            - '@template'
            - '@request'
            - '@config'
            - '%core.root_path%'
            - '%core.php_ext%'
    phpbbgallery.core.moderate:
        class: phpbbgallery\core\moderate
        arguments:
            - '@dbal.conn'
            - '@template'
            - '@controller.helper'
            - '@user'
            - '@language'
            - '@user_loader'
            - '@phpbbgallery.core.album'
            - '@phpbbgallery.core.auth'
            - '@pagination'
            - '@phpbbgallery.core.comment'
            - '@phpbbgallery.core.report'
            - '@phpbbgallery.core.image'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.notification'
            - '@phpbbgallery.core.rating'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.tables.gallery_albums%'
    phpbbgallery.core.search:
        class: phpbbgallery\core\search
        arguments:
            - '@dbal.conn'
            - '@template'
            - '@user'
            - '@language'
            - '@controller.helper'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.album'
            - '@phpbbgallery.core.image'
            - '@phpbbgallery.core.policy.image_visibility'
            - '@pagination'
            - '@user_loader'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.tables.gallery_albums%'
            - '%phpbbgallery.tables.gallery_comments%'
    phpbbgallery.core.image.selector:
        class: phpbbgallery\core\image\selector
        arguments:
            - '@dbal.conn'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.policy.image_visibility'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.tables.gallery_albums%'
    phpbbgallery.core.notification:
        class: phpbbgallery\core\notification
        arguments:
            - '@dbal.conn'
            - '@user'
            - '%phpbbgallery.tables.gallery_watch%'
    phpbbgallery.core.notification.helper:
        class: phpbbgallery\core\notification\helper
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@request'
            - '@template'
            - '@user'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.album.loader'
            - '@controller.helper'
            - '@phpbbgallery.core.url'
            - '@service_container'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%phpbbgallery.tables.gallery_watch%'
        calls:
            - [set_image, ['@phpbbgallery.core.image']]
    phpbbgallery.core.log:
        class: phpbbgallery\core\log
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@language'
            - '@user_loader'
            - '@template'
            - '@controller.helper'
            - '@pagination'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.config'
            - '%phpbbgallery.tables.gallery_log%'
            - '%phpbbgallery.tables.gallery_images%'
    phpbbgallery.core.block:
        class: phpbbgallery\core\block
    phpbbgallery.core.policy.image_visibility:
        class: phpbbgallery\core\policy\image_visibility
        arguments:
            - '@dispatcher'
    phpbbgallery.core.policy.album_operation:
        class: phpbbgallery\core\policy\album_operation
        arguments:
            - '@dispatcher'
            - '@phpbbgallery.core.album.type_registry'
    phpbbgallery.core.upload:
        class: phpbbgallery\core\upload
        arguments:
            - '@user'
            - '@language'
            - '@dbal.conn'
            - '@dispatcher'
            - '@request'
            - '@files.upload'
            - '@phpbbgallery.core.image'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.url'
            - '@phpbbgallery.core.block'
            - '@phpbbgallery.core.file.tool'
            - '@phpbbgallery.core.image.format_registry'
            - '@phpbbgallery.core.storage.key_generator'
            - '@phpbbgallery.core.storage.local'
            - '@phpbbgallery.core.storage.workspace'
            - '@phpbbgallery.core.zip.extractor'
            - '%phpbbgallery.tables.gallery_images%'
            - '%core.root_path%'
            - '%core.php_ext%'
    phpbbgallery.core.zip.extractor:
        class: phpbbgallery\core\zip\extractor
        arguments:
            - '@language'
            - '@phpbbgallery.core.image.format_registry'
    phpbbgallery.core.icon.manager:
        class: phpbbgallery\core\icon\manager
        arguments:
            - '@files.upload'
            - '@language'
            - '%phpbbgallery.core.icons.path%'
            - '%phpbbgallery.core.icons.path_relative%'
    phpbbgallery.core.rating:
        class: phpbbgallery\core\rating
        arguments:
            - '@dbal.conn'
            - '@template'
            - '@user'
            - '@language'
            - '@request'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.policy.album_operation'
            - '@phpbbgallery.core.policy.image_visibility'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.tables.gallery_albums%'
            - '%phpbbgallery.tables.gallery_rates%'
#######################
#### Define event #####
#######################
    phpbbgallery.core.listener:
        class: phpbbgallery\core\event\main_listener
        arguments:
            - '@controller.helper'
            - '@template'
            - '@user'
            - '@language'
            - '@phpbbgallery.core.search'
            - '@phpbbgallery.core.config'
            - '@dbal.conn'
            - '%phpbbgallery.tables.gallery_users%'
            - '@phpbbgallery.core.online_location'
            - '@phpbbgallery.core.album_access'
            - '@phpbbgallery.core.unread_counter'
        tags:
            - { name: event.listener }
    phpbbgallery.core.unread_counter:
        class: phpbbgallery\core\unread_counter
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@phpbbgallery.core.album_access'
            - '@phpbbgallery.core.user'
            - '@phpbbgallery.core.policy.image_visibility'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.tables.gallery_tracking%'
    phpbbgallery.core.album_access:
        class: phpbbgallery\core\album_access
        arguments:
            - '@phpbbgallery.core.auth'
            - '@user'
    phpbbgallery.core.online_location:
        class: phpbbgallery\core\online_location
        arguments:
            - '@dbal.conn'
            - '@phpbbgallery.core.auth'
            - '@user'
            - '@language'
            - '@controller.helper'
            - '@phpbbgallery.core.config'
            - '%phpbbgallery.tables.gallery_albums%'
            - '%phpbbgallery.tables.gallery_images%'
    phpbbgallery.core.mini_profile_listener:
        class: phpbbgallery\core\event\mini_profile_listener
        arguments:
            - '@controller.helper'
            - '@auth'
            - '@config'
            - '@user'
            - '@dbal.conn'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.search'
            - '%phpbbgallery.tables.gallery_users%'
        tags:
            - { name: event.listener }
    phpbbgallery.core.permission_lifecycle_listener:
        class: phpbbgallery\core\event\permission_lifecycle_listener
        arguments:
            - '@phpbbgallery.core.auth'
        tags:
            - { name: event.listener }
    phpbbgallery.core.identity_lifecycle_listener:
        class: phpbbgallery\core\event\identity_lifecycle_listener
        arguments:
            - '@phpbbgallery.core.identity_sync'
        tags:
            - { name: event.listener }
    phpbbgallery.core.editor_listener:
        class: phpbbgallery\core\event\editor_listener
        arguments:
            - '@controller.helper'
            - '@user'
            - '@config'
            - '@auth'
            - '@phpbbgallery.core.image.selector'
        tags:
            - { name: event.listener }
# ----- Cron tasks -----
    phpbbgallery.core.cron.task.cron_cleaner:
        class: phpbbgallery\core\cron\cron_cleaner
        arguments:
            - '@phpbbgallery.core.config'
            - '@phpbbgallery.core.upload'
        calls:
            - [set_name, [cron.task.cron_cleaner]]
        tags:
            - { name: cron.task }
