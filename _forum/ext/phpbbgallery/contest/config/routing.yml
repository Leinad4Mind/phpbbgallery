phpbbgallery_core_search_contests:
    path: /gallery/search/contests
    defaults: { _controller: phpbbgallery.contest.controller.winners:base, page: 1 }

phpbbgallery_core_search_contests_page:
    path: /gallery/search/contests/{page}
    defaults: { _controller: phpbbgallery.contest.controller.winners:base }
    requirements:
        page: \d+
