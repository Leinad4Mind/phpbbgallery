{% if exif_value|length %}
	<hr>
	<h3>
		{{ lang('EXIF_DATA') }}
		{% if not S_VIEWEXIF %}- <a href="#exif_data_fieldset" onclick="dE('exif_data_fieldset'); return false;">{{ lang('SHOW_EXIF') }}</a>{% endif %}
	</h3>
	<div class="table-responsive" id="exif_data_fieldset"{% if not S_VIEWEXIF %} style="display: none;"{% endif %}>
		<table class="table table-striped table-condensed">
			<tbody>
			{% for exif_value in exif_value %}
				<tr><th scope="row">{{ exif_value.EXIF_NAME }}{{ lang('COLON') }}</th><td>{{ exif_value.EXIF_VALUE }}</td></tr>
			{% endfor %}
			</tbody>
		</table>
	</div>
{% endif %}
