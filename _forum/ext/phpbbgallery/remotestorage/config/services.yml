imports:
    - { resource: tables.yml }

parameters:
    phpbbgallery.remotestorage.provider_ids:
        - s3
        - azure
        - sftp
        - dropbox
        - google_drive
        - box
        - mediafire
        - pcloud
        - koofr
        - fourshared

services:
    phpbbgallery.remotestorage.http:
        class: phpbbgallery\remotestorage\http\guzzle_client

    phpbbgallery.remotestorage.provider_factory.s3:
        class: phpbbgallery\remotestorage\providers\s3\configured_factory
        arguments:
            - '@phpbbgallery.remotestorage.http'
            - '@config'
            - '@request'
        tags:
            - { name: phpbbgallery.storage.provider_factory }

    phpbbgallery.remotestorage.provider_factory.azure:
        class: phpbbgallery\remotestorage\providers\azure\configured_factory
        arguments:
            - '@phpbbgallery.remotestorage.http'
            - '@config'
            - '@request'
        tags:
            - { name: phpbbgallery.storage.provider_factory }

    phpbbgallery.remotestorage.provider_factory.sftp:
        class: phpbbgallery\remotestorage\providers\sftp\configured_factory
        arguments:
            - '@config'
            - '@request'
        tags:
            - { name: phpbbgallery.storage.provider_factory }

    phpbbgallery.remotestorage.provider_factory.dropbox:
        class: phpbbgallery\remotestorage\providers\dropbox\configured_factory
        arguments:
            - '@phpbbgallery.remotestorage.http'
            - '@config'
            - '@request'
        tags:
            - { name: phpbbgallery.storage.provider_factory }

    phpbbgallery.remotestorage.provider_factory.google_drive:
        class: phpbbgallery\remotestorage\providers\google_drive\configured_factory
        arguments:
            - '@phpbbgallery.remotestorage.http'
            - '@config'
            - '@request'
        tags:
            - { name: phpbbgallery.storage.provider_factory }

    phpbbgallery.remotestorage.provider_factory.box:
        class: phpbbgallery\remotestorage\providers\box\configured_factory
        arguments:
            - '@phpbbgallery.remotestorage.http'
            - '@config'
            - '@request'
            - '@dbal.conn'
            - '%core.table_prefix%config'
            - '%core.cache_dir%phpbbgallery/box-oauth.lock'
        tags:
            - { name: phpbbgallery.storage.provider_factory }

    phpbbgallery.remotestorage.provider_factory.mediafire:
        class: phpbbgallery\remotestorage\providers\mediafire\configured_factory
        arguments:
            - '@phpbbgallery.remotestorage.http'
            - '@config'
            - '@request'
            - '@dbal.conn'
            - '%core.table_prefix%config'
            - '%core.cache_dir%phpbbgallery/mediafire-session.lock'
        tags:
            - { name: phpbbgallery.storage.provider_factory }

    phpbbgallery.remotestorage.provider_factory.pcloud:
        class: phpbbgallery\remotestorage\providers\pcloud\configured_factory
        arguments:
            - '@phpbbgallery.remotestorage.http'
            - '@config'
            - '@request'
        tags:
            - { name: phpbbgallery.storage.provider_factory }

    phpbbgallery.remotestorage.provider_factory.koofr:
        class: phpbbgallery\remotestorage\providers\koofr\configured_factory
        arguments:
            - '@phpbbgallery.remotestorage.http'
            - '@config'
            - '@request'
        tags:
            - { name: phpbbgallery.storage.provider_factory }

    phpbbgallery.remotestorage.provider_factory.fourshared:
        class: phpbbgallery\remotestorage\providers\fourshared\configured_factory
        arguments:
            - '@phpbbgallery.remotestorage.http'
            - '@config'
            - '@request'
            - '%core.cache_dir%phpbbgallery/4shared-storage.lock'
        tags:
            - { name: phpbbgallery.storage.provider_factory }

    phpbbgallery.remotestorage.connection_tester:
        class: phpbbgallery\remotestorage\connection_tester

    phpbbgallery.remotestorage.migration.provider_resolver:
        class: phpbbgallery\remotestorage\migration\provider_resolver
        arguments:
            - '@phpbbgallery.core.storage.local'
            - '@service_container'
            - '%phpbbgallery.remotestorage.provider_ids%'

    phpbbgallery.remotestorage.migration.state_store:
        class: phpbbgallery\remotestorage\migration\db_state_store
        arguments:
            - '@dbal.conn'
            - '%phpbbgallery.tables.gallery_remote_migrations%'

    phpbbgallery.remotestorage.migration.provider_migrator:
        class: phpbbgallery\remotestorage\migration\provider_migrator
        arguments:
            - '@config'
            - '@phpbbgallery.remotestorage.migration.provider_resolver'
            - '@phpbbgallery.remotestorage.migration.state_store'
            - '%core.cache_dir%phpbbgallery/remote-migration/'
