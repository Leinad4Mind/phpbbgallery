{% if S_BBTAGSIMAGES_CAN_SEARCH %}
<dl>
	<dt><label for="gallery_tags">{{ lang('BBTAGSIMAGES_SEARCH_TAGS') }}{{ lang('COLON') }}</label><br /><span>{{ lang('BBTAGSIMAGES_SEARCH_TAGS_EXPLAIN') }}</span></dt>
	<dd><input type="text" class="inputbox" name="tags" id="gallery_tags" value="{{ BBTAGSIMAGES_SEARCH_TAGS }}" list="gallery_tags_suggestions" data-autocomplete-url="{{ U_BBTAGSIMAGES_AUTOCOMPLETE }}" autocomplete="off" /></dd>
	<dd><label for="tag_operator_all"><input type="radio" name="tag_operator" id="tag_operator_all" value="and"{% if S_BBTAGSIMAGES_OPERATOR_AND %} checked="checked"{% endif %} /> {{ lang('BBTAGSIMAGES_MATCH_ALL_TAGS') }}</label></dd>
	<dd><label for="tag_operator_any"><input type="radio" name="tag_operator" id="tag_operator_any" value="or"{% if S_BBTAGSIMAGES_OPERATOR_OR %} checked="checked"{% endif %} /> {{ lang('BBTAGSIMAGES_MATCH_ANY_TAG') }}</label></dd>
</dl>
<datalist id="gallery_tags_suggestions"></datalist>
{% endif %}
