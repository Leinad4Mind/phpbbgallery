<div class="control-group">

<div class="controls controls-row">
	<div class="radio"><input type="radio" name="watch_favo" id="watch_favo1" value="1"{% if S_WATCH_FAVO %} checked="checked"{% endif %} /><label for="watch_favo1">{{ lang('YES') }}</label></div>
	<div class="radio"><input type="radio" name="watch_favo" id="watch_favo0" value="0"{% if not S_WATCH_FAVO %} checked="checked"{% endif %} /><label for="watch_favo0">{{ lang('NO') }}</label></div>
</div>
</div>
