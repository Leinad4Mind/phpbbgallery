{% if S_BBTAGSBRIDGE_CAN_SEARCH %}
<div class="control-group">
	<label class="control-label" for="gallery_tags">{{ lang('BBTAGSBRIDGE_SEARCH_TAGS') }}{{ lang('COLON') }}</label>
	<span class="help-block">{{ lang('BBTAGSBRIDGE_SEARCH_TAGS_EXPLAIN') }}</span>
	<div class="controls controls-row">
		<input type="text" class="form-control" name="tags" id="gallery_tags" value="{{ BBTAGSBRIDGE_SEARCH_TAGS }}" list="gallery_tags_suggestions" data-autocomplete-url="{{ U_BBTAGSBRIDGE_AUTOCOMPLETE }}" autocomplete="off" />
		<div class="radio"><input type="radio" name="tag_operator" id="tag_operator_all" value="and"{% if S_BBTAGSBRIDGE_OPERATOR_AND %} checked="checked"{% endif %} /><label for="tag_operator_all">{{ lang('BBTAGSBRIDGE_MATCH_ALL_TAGS') }}</label></div>
		<div class="radio"><input type="radio" name="tag_operator" id="tag_operator_any" value="or"{% if S_BBTAGSBRIDGE_OPERATOR_OR %} checked="checked"{% endif %} /><label for="tag_operator_any">{{ lang('BBTAGSBRIDGE_MATCH_ANY_TAG') }}</label></div>
	</div>
</div>
<datalist id="gallery_tags_suggestions"></datalist>
{% endif %}
