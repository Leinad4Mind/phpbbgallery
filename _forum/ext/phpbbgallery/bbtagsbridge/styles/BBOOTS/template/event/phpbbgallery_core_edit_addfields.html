{% for image in image %}
	{% if image.BBTAGSBRIDGE_CAN_TAG %}
	<div class="form-group">
		<label class="control-label" for="bbtagsbridge_tags_{{ image.S_ROW_COUNT }}">{{ lang('BBTAGSBRIDGE_TAGS') }}</label>
		<input class="form-control" type="text" id="bbtagsbridge_tags_{{ image.S_ROW_COUNT }}" name="bbtagsbridge_tags[{{ image.S_ROW_COUNT }}]" value="{{ image.BBTAGSBRIDGE_TAGS }}" autocomplete="off" />
		<p class="help-block">{{ lang('BBTAGSBRIDGE_TAGS_EXPLAIN', BBTAGSBRIDGE_MAX_TAGS, BBTAGSBRIDGE_MIN_LENGTH, BBTAGSBRIDGE_MAX_LENGTH) }}</p>
		{% if image.BBTAGSBRIDGE_HAS_PENDING %}<p class="text-warning"><i class="fa fa-clock-o"></i> {{ lang('BBTAGSBRIDGE_PENDING_NOTICE') }}</p>{% endif %}
	</div>
	{% endif %}
{% endfor %}
