imports:
    - { resource: tables.yml }
    - { resource: notifications.yml }

services:
    phpbbgallery.bbpointsimages.policy:
        class: phpbbgallery\bbpointsimages\policy
        arguments:
            - '@dbal.conn'
            - '@config'
            - '%phpbbgallery.tables.gallery_albums%'
            - '%phpbbgallery.bbpointsimages.tables.album_rules%'

    phpbbgallery.bbpointsimages.reward_manager:
        class: phpbbgallery\bbpointsimages\reward_manager
        arguments:
            - '@dbal.conn'
            - '@phpbbgallery.bbpointsimages.policy'
            - '@sitesplat.bbpoints.ledger'
            - '%phpbbgallery.bbpointsimages.tables.rewards%'
            - '%phpbbgallery.bbpointsimages.tables.image_stats%'

    phpbbgallery.bbpointsimages.purchase_manager:
        class: phpbbgallery\bbpointsimages\purchase_manager
        arguments:
            - '@dbal.conn'
            - '@phpbbgallery.bbpointsimages.policy'
            - '@sitesplat.bbpoints.ledger'
            - '%phpbbgallery.bbpointsimages.tables.contributors%'
            - '%phpbbgallery.bbpointsimages.tables.purchases%'
            - '%phpbbgallery.bbpointsimages.tables.image_stats%'

    phpbbgallery.bbpointsimages.contributor_manager:
        class: phpbbgallery\bbpointsimages\contributor_manager
        arguments:
            - '@dbal.conn'
            - '%phpbbgallery.bbpointsimages.tables.contributors%'
            - '%tables.users%'
            - '%phpbbgallery.tables.gallery_images%'

    phpbbgallery.bbpointsimages.notification.helper:
        class: phpbbgallery\bbpointsimages\notification\helper
        arguments:
            - '@notification_manager'
            - '@controller.helper'

    phpbbgallery.bbpointsimages.listener:
        class: phpbbgallery\bbpointsimages\event\main_listener
        arguments:
            - '@phpbbgallery.bbpointsimages.reward_manager'
            - '@phpbbgallery.bbpointsimages.purchase_manager'
            - '@phpbbgallery.bbpointsimages.contributor_manager'
            - '@phpbbgallery.bbpointsimages.policy'
            - '@phpbbgallery.bbpointsimages.notification.helper'
            - '@request'
            - '@user'
            - '@language'
            - '@controller.helper'
            - '@template'
            - '@config'
            - '@phpbbgallery.core.url'
        tags:
            - { name: event.listener }

    phpbbgallery.bbpointsimages.retro_sync:
        class: phpbbgallery\bbpointsimages\retro_sync
        arguments:
            - '@dbal.conn'
            - '@phpbbgallery.bbpointsimages.reward_manager'
            - '@phpbbgallery.core.url'
            - '%phpbbgallery.tables.gallery_images%'
