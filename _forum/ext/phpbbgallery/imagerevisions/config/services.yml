parameters:
    phpbbgallery.imagerevisions.tables.revisions: '%core.table_prefix%gallery_image_revisions'
    phpbbgallery.imagerevisions.tables.album_rules: '%core.table_prefix%gallery_imagerevisions_album_rules'

services:
    phpbbgallery.imagerevisions.policy:
        class: phpbbgallery\imagerevisions\policy
        arguments:
            - '@dbal.conn'
            - '@config'
            - '%phpbbgallery.tables.gallery_albums%'
            - '%phpbbgallery.imagerevisions.tables.album_rules%'

    phpbbgallery.imagerevisions.revision:
        class: phpbbgallery\imagerevisions\revision
        arguments:
            - '@dbal.conn'
            - '@user'
            - '@phpbbgallery.core.storage.workspace'
            - '@phpbbgallery.core.log'
            - '@phpbbgallery.core.cache'
            - '@phpbbgallery.core.file.tool'
            - '%phpbbgallery.tables.gallery_images%'
            - '%phpbbgallery.imagerevisions.tables.revisions%'

    phpbbgallery.imagerevisions.listener:
        class: phpbbgallery\imagerevisions\event\main_listener
        arguments:
            - '@phpbbgallery.imagerevisions.policy'
            - '@request'
            - '@template'
            - '@language'
            - '@user'
            - '@controller.helper'
            - '@phpbbgallery.core.upload'
            - '@phpbbgallery.imagerevisions.revision'
        tags:
            - { name: event.listener }

    phpbbgallery.imagerevisions.acp_listener:
        class: phpbbgallery\imagerevisions\event\acp_listener
        arguments:
            - '@phpbbgallery.imagerevisions.policy'
            - '@request'
            - '@template'
            - '@language'
        tags:
            - { name: event.listener }

    phpbbgallery.imagerevisions.controller:
        class: phpbbgallery\imagerevisions\controller\main
        arguments:
            - '@phpbbgallery.imagerevisions.policy'
            - '@controller.helper'
            - '@language'
            - '@user'
            - '@phpbbgallery.core.album'
            - '@phpbbgallery.core.image'
            - '@phpbbgallery.core.auth'
            - '@phpbbgallery.core.auth.image_authorization'
            - '@phpbbgallery.core.file.tool'
            - '@phpbbgallery.imagerevisions.revision'
            - '@phpbbgallery.core.storage.workspace'
