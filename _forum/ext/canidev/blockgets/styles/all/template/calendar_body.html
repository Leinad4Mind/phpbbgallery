<!-- IF S_IN_EVENT -->

<div title="{S_EVENT_TITLE}">
	<form>
	<div class="dialog-text">{S_EVENT_CONTENT}</div>

<!-- IF CAN_MANAGE_EVENT -->
	<div class="blg-dialog-buttons">
		<button class="blg-button" value="submit" data-action="edit">{L_EDIT}</button>
		<button class="blg-button" value="submit" data-action="delete">{L_DELETE}</button>
		
		{S_HIDDEN_FIELDS}
	</div>
<!-- ENDIF -->
	</form>
</div>

<!-- ELSE -->

<!-- INCLUDE overall_header.html -->

<h2 >{L_CALENDAR}</h2>

<!-- BEGIN calendar -->
	<div class="blg-calendar-actionbar">
		<div class="calendar-printer blg-align-right floated">
			<a href="#" onclick="window.print(); return false;" class="blg-button"><span class="blg-icon blg-icon-print"></span> <span>{L_PRINT}</span></a>
		</div>

		<a href="{U_TODAY}" class="blg-button">{L_TODAY}</a>

		<div class="blg-group">
			<a href="{U_PREV}" class="blg-button"><span class="blg-icon blg-icon-chevron-left"></span></a>
			<a href="{U_NEXT}" class="blg-button"><span class="blg-icon blg-icon-chevron-right"></span></a>
		</div>

		<div class="blg-calendar-title">{calendar.S_MONTH}</div>
	</div>

	<table class="blg-calendar">
	<tr>
	<!-- BEGIN days -->

		<!-- IF calendar.days.NEW_LINE and not calendar.days.S_FIRST_ROW --></tr><tr><!-- ENDIF -->

		<!-- IF calendar.days.IS_HEADER -->
			<th><span class="short-day">{calendar.days.S_DAY_SHORT}</span><span class="full-day">{calendar.days.S_DAY}</span></th>
		<!-- ELSEIF calendar.days.S_DAY -->
			<td id="day-{calendar.days.S_DATA}"<!-- IF calendar.days.IS_TODAY --> class="today"<!-- ENDIF -->>
				<div class="blg-calendar-day">
					<!-- IF S_CAN_CREATE_EVENT --><a href="#" class="blg-event-add blg-align-right floated" title="{L_ADD_EVENT}" data-time="{calendar.days.S_DATA}"><span class="blg-icon blg-icon-plus-circle"></span></a><!-- ENDIF -->
					<span>{calendar.days.S_DAY}</span>
				</div>
			
				<div class="blg-calendar-content">
				<!-- BEGIN event -->
					<!-- IF calendar.days.event.S_TYPE eq 'birthday' --><div class="blg-calendar-event blg-event-birthday"><span class="blg-icon blg-icon-birthday-cake"></span> <!-- ELSE --><div data-event="{calendar.days.event.S_ID}" class="blg-calendar-event"><!-- ENDIF -->{calendar.days.event.S_TITLE}</div>
				<!-- END event -->
				</div>
			</td>
		<!-- ELSE -->
			<td>&nbsp;</td>
		<!-- ENDIF -->
	<!-- END days -->
	</tr>
	</table>
<!-- END calendar -->

<!-- INCLUDE overall_footer.html -->

<!-- ENDIF -->
