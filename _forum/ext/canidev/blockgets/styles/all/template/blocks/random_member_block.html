
<div class="random-member-content">

{% for member in random_member %}
	<div class="blg-align-center">{{ member.USERNAME }}<hr /></div>
	<div class="blg-align-center">
		<div class="cbb-circular-avatar">{% if member.AVATAR %}{{ member.AVATAR }}{% else %}<div class="cbb-no-avatar"></div>{% endif %}</div>
	</div>
	<br />
	<div class="random-member-info blg-inline-list">
		<dl>
			<dt><strong>{L_USER}{L_COLON}</strong></dt>
			<dd>{{ member.USER_FULL }}</dd>
		</dl>

		<dl>
			<dt><strong>{L_JOINED}{L_COLON}</strong></dt>
			<dd>{{ member.REGDATE }}</dd>
		</dl>

		<dl>
			<dt><strong>{L_POSTS}{L_COLON}</strong></dt>
			<dd>{% if member.POSTS %}<a href="{{ member.U_FIND_POSTS }}">{{ member.POSTS }}</a>{% else %}0{% endif %}</dd>
		</dl>
	</div>
{% endfor %}

</div>
