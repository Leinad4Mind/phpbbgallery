
<script>
// <![CDATA[
	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		$('#ranks-{{ BLOCK_ID }}').blgAccordion({
			collapsible : true
		});
	});
// ]]>
</script>

<div id="ranks-{{ BLOCK_ID }}" class="cbb-helper-hidden">

{% for rank in loops.rank %}
	<h5><a href="#">{{ rank.S_TITLE }}</a></h5>
	<div>
		{% if rank.S_IMG_SRC %}<div class="blg-align-center"><img src="{{ rank.S_IMG_SRC }}" alt="{{ rank.S_TITLE }}" /></div>{% endif %}
	{% if rank.IS_SPECIAL %}
		<div class="blg-align-center blg-special-rank">{{ lang('SPECIAL_RANK') }}</div>
	{% else %}
		<div>{{ lang('MIN_POSTS') ~ lang('COLON') }} {{ rank.S_MIN_POSTS }}</div>
	{% endif %}
	</div>
{% endfor %}

</div>
