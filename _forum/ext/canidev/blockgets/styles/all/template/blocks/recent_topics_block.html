	});

<!-- IF S_SHORT_MODE -->

<div id="recent-{BLOCK_ID}">

<!-- BEGIN recent -->

		<div class="no-wrap">
			<!-- IF recent.S_LEGEND_EMPTY -->{recent.S_LEGEND_EMPTY}<!-- ENDIF -->

		<!-- BEGIN td -->
			<!-- IF recent.td.S_COLUMN_COUNT == 0 -->{recent.MINI_POST_IMG} {recent.td.S_ITEM}<br /><!-- ENDIF -->
		<!-- END td -->
	
		<!-- IF recent.S_LAST_ROW --></div><!-- ENDIF -->

<div id="recent-{BLOCK_ID}" class="recent-block">
    <ul>
	<!-- BEGIN recent -->
		<!-- IF recent.S_LEGEND --><li><a href="#{recent.S_TAB_ID}-{BLOCK_ID}"><span class="blg-icon {recent.S_TAB_ICON}"></span> <span class="tab-title">{recent.S_LEGEND}</span></a></li><!-- ENDIF -->
	<!-- END recent -->
    </ul>    

<!-- BEGIN recent -->

	<!-- IF not recent.S_FIRST_ROW -->
		</table>
	</div>
	<!-- ENDIF -->

	<div class="blg-align-center recent-content" id="{recent.S_TAB_ID}-{BLOCK_ID}">
		<table class="blg-table">

		<!-- IF recent.S_LEGEND_EMPTY -->
		<tr><td class="blg-message">{recent.S_LEGEND_EMPTY}</td></tr>
		<!-- ELSE -->
		
		<tr>
			<!-- BEGIN th --><th class="{recent.th.S_ID} blg-widget-header">{recent.th.S_LEGEND}</th><!-- END th -->

	<!-- BEGIN td -->

			<!-- IF not recent.td.S_LAST_ROW --><tr><!-- ENDIF -->

			<!-- IF recent.td.S_FIRST_ROW --><tr><!-- ENDIF -->

		<!-- ENDIF -->
	<!-- END td -->
		<!-- ENDIF -->

	</div>
	<!-- ENDIF -->

</div>
