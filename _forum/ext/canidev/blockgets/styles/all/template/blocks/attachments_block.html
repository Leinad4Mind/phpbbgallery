
<!-- IF .attach -->
	<script>
	// <![CDATA[
	window._jBlg = window._jBlg || [];
	
	window._jBlg.push(function() {
		$('#attach-{BLOCK_ID}').accordion();
	});
	// ]]>
	</script>

	<div id="attach-{BLOCK_ID}">
	<!-- BEGIN attach -->
		<h5><a href="#">{attach.REAL_FILENAME}</a></h5>
		<div>
			<div class="blg-align-center">{attach.S_IMG}</div><br />
			{attach.S_DATE}<br />{attach.S_FILESIZE}<br />{attach.S_DOWNLOAD}<br />
			<hr />
			<a class="blank blg-align-left floated" href="{attach.U_FILELINK}"><strong>{L_VIEW_TOPIC}</strong></a>
			<a class="blank blg-align-right floated" href="{attach.U_FILE}"><strong>{L_DOWNLOAD}</strong></a>
			<br class="clear" />
		</div>
	<!-- END attach -->
	</div>
<!-- ELSE -->
	<div class="blg-align-center">{L_NO_ATTACHMENTS}</div>
<!-- ENDIF -->
