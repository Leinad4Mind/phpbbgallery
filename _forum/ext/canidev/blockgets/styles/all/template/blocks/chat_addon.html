
<!-- IF CHAT_ADDON_SHOW_CHAT -->
	<script>
	// <![CDATA[
	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		var adjustIframeHeight = function() {
			$('#chat-{BLOCK_ID}').css('height', $('#chat-{BLOCK_ID}').contents().find('body').height());
		};

		$('#block-{BLOCK_ID} .block-content').cbbLoading(true, true, false);

		$('#chat-{BLOCK_ID}').on('load', function() {
			setTimeout(function() {
				$('#block-{BLOCK_ID} .block-content')
					.cbbLoading(false)
					.css('height', 'auto');

				$('#chat-{BLOCK_ID}')
					.css({
						position: 'static',
						visibility: 'visible'
					});
					
				adjustIframeHeight();
			}, 1500);
		});
		
		this.addListener('blockgets.resize', adjustIframeHeight);
	});
	// ]]>
	</script>
	
	<style>
	#block-{BLOCK_ID} .block-content {
		height: {CHAT_ADDON_HEIGHT}px;
		padding: 0;
		position: relative;
	}

	#chat-{BLOCK_ID} {
		position: absolute;
		visibility: hidden;
		width: 100%;
	}
	</style>
		
	<iframe id="chat-{BLOCK_ID}" src="{CHAT_ADDON_ACTION}" frameborder="0"></iframe>
<!-- ELSEIF BLOCK_VIEW_SMALL -->
	<ul class="blg-linear-list">
	<!-- BEGIN userrow -->
		<li class="userrow"><span class="chat-user-status {userrow.S_USER_STATUS}"></span>{userrow.S_USER_FULL}</li>
	<!-- BEGINELSE -->
		<li>{L_NO_MOST_POSTER}</li>
	<!-- END userrow -->
	</ul>
<!-- ELSE -->
	<!-- BEGIN userrow --><span class="chat-user-status {userrow.S_USER_STATUS}"></span>{userrow.S_USER_FULL}<!-- IF not userrow.S_LAST_ROW-->&nbsp;<!-- ENDIF --><!-- BEGINELSE -->{L_NO_MOST_POSTER}<!-- END userrow -->
<!-- ENDIF -->
