	<script>
	// <![CDATA[
	window._jBlg = window._jBlg || [];
	window._jBlg.push(function() {
		var adjustIframeHeight = function() {
			$('#chat-{BLOCK_ID}').css('height', $('#chat-{BLOCK_ID}').contents().find('body').height());
		};

		$('#block-{BLOCK_ID} .block-content').loading(true, '', '', true);

		$('#chat-{BLOCK_ID}').load(function() {
			setTimeout(function() {
				$('#block-{BLOCK_ID} .block-content').loading(false, '', '', true);

				$('#chat-{BLOCK_ID}')
					.css({
						position: 'static',
						visibility: 'visible'
					});
					
				adjustIframeHeight();
			}, 1500);
		});
		
		$.cbbEvent.addListener('blockgets.resize', adjustIframeHeight);
	});
	// ]]>
	</script>
	
	<style>
	#block-{BLOCK_ID} .block-content {
		height: {CHAT_ADDON_HEIGHT}px;
		padding: 0;
		position: relative;
	}

	#chat-{BLOCK_ID} {
		position: absolute;
		visibility: hidden;
		width: 100%;
	}
	</style>
		
	<iframe id="chat-{BLOCK_ID}" src="{CHAT_ADDON_ACTION}" frameborder="0"></iframe>
