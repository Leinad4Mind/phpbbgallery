
<script>
// <![CDATA[
head.ready(['cbbcore.min.js', 'jblockgets.min.js'], function () {
	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		$('#block-{{ BLOCK_ID }} form').ajaxify();
	});
});
// ]]>
</script>

<form method="post" action="{{ U_BLG_ACTION }}">
	<ul class="blg-linear-list blg-align-center">
		<li class="double-space"><select name="lng" class="cbb-inputbox">{LANGUAGE_SELECT}</select></li>
		{% if CAN_SAVE_LANGUAGE %}<li class="doubl-space"><label><input type="checkbox" name="default" value="1" /> {L_LANGUAGE_SET_MINE}</label></li>{% endif %}
		<li class="double-space">
			<input type="submit" name="submit" class="btn btn-default" value="{L_LANGUAGE_CHANGE}" />
			{{ S_BLOCK_HIDDEN_FIELDS }}
		</li>
		{% if U_LANGUAGE_DEFAULT %}<li class="double-space"><a href="{{ U_LANGUAGE_DEFAULT }}">{L_LANGUAGE_DEFAULT}</a></li>{% endif %}
	</ul>
</form>
