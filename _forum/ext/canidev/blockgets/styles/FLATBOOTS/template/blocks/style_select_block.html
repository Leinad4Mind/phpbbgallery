
<script>
// <![CDATA[
head.ready(['cbbcore.min.js', 'jblockgets.min.js'], function () {
	window._jPostponed = window._jPostponed || [];
	window._jPostponed.push(function() {
		$('#block-{{ BLOCK_ID }} form').ajaxify();
	});
});
// ]]>
</script>

<form method="post" action="{{ U_BLG_ACTION }}">
	<ul class="blg-linear-list blg-align-center">
		<li class="double-space"><select name="style" class="cbb-inputbox">{{ STYLE_SELECT }}</select></li>
		{% if CAN_SAVE_STYLE %}<li class="doubl-space"><label><input type="checkbox" name="default" value="1" /> {L_STYLE_SET_MINE}</label></li>{% endif %}
		<li class="double-space">
			<input type="submit" name="submit" class="btn btn-default" value="{L_STYLE_CHANGE}" />
			{{ S_BLOCK_HIDDEN_FIELDS }}
		</li>
		{% if U_STYLE_DEFAULT %}<li class="double-space"><a href="{{ U_STYLE_DEFAULT }}">{L_STYLE_DEFAULT}</a></li>{% endif %}
	</ul>
</form>
