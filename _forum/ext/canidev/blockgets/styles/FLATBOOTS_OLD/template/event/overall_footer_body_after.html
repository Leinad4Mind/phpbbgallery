<script>

	head.load(<!-- BEGIN asset_js -->"{asset_js.DATA}"<!-- IF not asset_js.S_LAST_ROW -->,<!-- ENDIF --><!-- END asset_js -->);
	head.ready('jblockgets.js',function(){
	<!-- BEGIN asset_javascript -->
		{asset_javascript.DATA}
	<!-- END asset_javascript -->
	<!-- IF BLG_ENABLED -->
jblockgets(function($){
	$.cbbEvent.dispatch('core.onready');
	$.jblockgets.initialize({background:"{BLG_BACKGROUND}",cookie_name:"{S_COOKIE_NAME}",cookie_settings:"{S_COOKIE_SETTINGS}",notice_timeout:"{BLG_NOTICE_TIMEOUT}",page_id:"{BLG_PAGE_ID}",lang:{"rsz-enlarge":"{LA_IMAGE_ENLARGE}","rsz-close":"{LA_IMAGE_CLOSE}","side-title":"{LA_EXPAND_CONTRACT}","player-stop":"{LA_STOP_MSG}","player-volume":"{LA_VOLUME_MSG}"}});
	<!-- IF BLG_RSZ_GO -->
		$('.blg-block').adjustImages('.user-avatar img', { maxwidth: '{BLG_RSZ_AVATAR_WIDTH}' });
		$('.block-postbody<!-- IF BLG_RSZ_ON_POST -->, .post .postbody<!-- ENDIF -->').adjustImages('img', {maxwidth: '{BLG_RSZ_WIDTH}'});
		$('.postprofile').adjustImages('.avatar-container img', { maxwidth: '{BLG_RSZ_AVATAR_WIDTH}' });
	<!-- ENDIF -->
	window._jBlg&&$.each(window._jBlg,function(l,n){n.call($)});
});
<!-- ENDIF -->
});
// ]]>
</script>
<!-- ENDIF -->
