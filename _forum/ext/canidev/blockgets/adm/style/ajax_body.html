
<!-- IF S_CONFIRM_BOX -->
<div id="confirm-box" title="{MESSAGE_TITLE}">
	<form action="{S_CONFIRM_ACTION}">
	
	<!-- IF S_PAGE_OPTIONS or S_GROUP_SELECT -->
		<div class="blg-align-center">
			<div class="dialog-text">{L_EXPLAIN}</div>

			<!-- IF S_PAGE_OPTIONS --><select name="target_page_id" id="target-page-id" class="blg-inputbox">{S_PAGE_OPTIONS}</select><br /><!-- ENDIF -->
			<!-- IF S_GROUP_SELECT -->{S_GROUP_SELECT}<!-- ENDIF -->
			
			<br />
			
			<div class="blg-dialog-buttons">
				<button class="blg-button" value="submit" data-confirm="{YES_VALUE}">{L_ACCEPT}</button>
				<button class="blg-button" value="close">{L_CANCEL}</button>
			</div>
		</div>
	<!-- ELSE -->
		<div class="dialog-text blg-align-center">{MESSAGE_TEXT}</div>

		<div class="blg-dialog-buttons">
			<button class="blg-button" value="submit" data-confirm="{YES_VALUE}">{YES_VALUE}</button>
			<button class="blg-button" value="close">{L_NO}</button>
		</div>
	<!-- ENDIF -->

		<div>{S_HIDDEN_FIELDS}</div>
	</form>
</div>
<!-- ENDIF -->
