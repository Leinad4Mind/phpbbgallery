
<fieldset>
	<dl>
		<dt>
			<label>{L_RECENT_SECTIONS}{L_COLON}</label><br />
			<span>{L_RECENT_SECTIONS_EXPLAIN}</span>
		</dt>
		<dd>
			<table class="blg-table acp-blg-list-minimal not-responsive">
			<tr class="js-no-over">
				<td>
					<ul class="sortable sortable-simple">
					{% for section in sections %}
						<li id="row-{{ section.ID }}" class="move blg-state-default">
							<input type="checkbox" class="js-check-field radio cbb-checkbox" id="item-tab-{{ section.ID }}" name="section_enabled[]" value="{{ section.ID }}"{% if section.CHECKED %} checked="checked"{% endif %} />
							<label for="item-tab-{{ section.ID }}">{{ section.TITLE }}</label>
							<input type="hidden" name="section[]" value="{{ section.ID }}" />
						</li>
					{% endfor %}
					</ul>
				</td>
			</tr>
			</table>
		</dd>
	</dl>
</fieldset>
