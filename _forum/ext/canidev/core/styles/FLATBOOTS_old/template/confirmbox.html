<div id="confirm-box" title="{MESSAGE_TITLE}">
	<form action="{S_CONFIRM_ACTION}">
		<div class="cbb-dialog-content">{MESSAGE_TEXT}</div>
		<div class="cbb-dialog-buttons">
			<button class="btn btn-sm btn-default" value="submit" data-confirm="{YES_VALUE}">{YES_VALUE}</button>
			<button class="btn btn-sm btn-default" value="close">{L_NO}</button>
			{S_HIDDEN_FIELDS}
		</div>
	</form>
</div>
