{% if S_QUICKMOD_ENABLED %}
	<script type="text/html" id="tpl-quickmod-main">
		<div id="qm-main" class="panel">
			<form name="quick_mod_form" method="post" onsubmit="return false;">
				<div id="qm_main_container">
					<div class="qm-loading cbb-loading cbb-helper-hidden"><span></span></div>
					<div class="qm-action-container cbb-helper-hidden">
						{{ lang('WITH_SELECTED') }} <span id="row_mark_count">(0)</span>{{ lang('COLON') }}
						<div class="cbb-group">
							<select id="quick_mod_action" name="quick_mod_action" class="cbb-inputbox">{{ S_QUICK_OPTIONS }}</select>
							<input type="button" name="quick_mod_button" value="{{ lang('GO') }}" class="cbb-btn" />
						</div>
					</div>
					<div class="qm-select-container"><select name="qm_mark" class="cbb-inputbox">{{ S_QM_MARK_OPTIONS }}</select></div>
					
					{{ S_FORM_TOKEN }}
					{{ S_HIDDEN_FIELDS }}
				</div>
			</form>
		</div>
	</script>

	<script type="text/html" id="tpl-quickmod-rename">
		<div id="quick_rename" class="cbb-group">
			<input type="text" class="cbb-inputbox" id="topic_title" name="topic_title" maxlength="124" value="" />
			<button class="cbb-btn" data-action="submit"><i class="fa fa-check"></i></button>
			<button class="cbb-btn" data-action="cancel"><i class="fa fa-remove"></i></button>
		</div>
	</script>

	<script>
	// <![CDATA[
	head.ready(['cbbcore.min.js', 'jquickmod.min.js'], function () {
		cbbCore.initService('quickmod', {
			rowSelector	: 'tr:has(".quick_mod_buttons")',
			position	: ['.panel:has(.footable):last', 'after'],
			type		: '{{ S_QM_TYPE }}',
			titleTag	: 'data-original-title title'
		});
	});
	// ]]>
	</script>
{% endif %}
