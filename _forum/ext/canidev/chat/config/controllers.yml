services:
    canidev.chat.controller:
        class: canidev\chat\controller\main_controller
        arguments:
            - '@auth'
            - '@canidev.chat.chat'
            - '@config'
            - '@service_container'
            - '@canidev.core.lib'
            - '@dbal.conn'
            - '@controller.helper'
            - '@language'
            - '@log'
            - '@request'
            - '@template'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%tables.canidev.chat%'

    canidev.chat.controller.admin.config:
