<!-- INCLUDE overall_header.html -->

<h2>{L_CHAT_ARCHIVE}</h2>

<form method="post" action="{U_ACTION}">

<div class="panel has-nav-tabs panel-default">
	<ul class="nav nav-tabs">
	<!-- BEGIN roomtab -->
		<li<!-- IF roomtab.S_ACTIVE --> class="active"<!-- ENDIF -->><a href="{roomtab.U_ACTION}"><span>{roomtab.S_TITLE}</span></a></li>
	<!-- BEGINELSE -->
		<li class="active"><a href=""><span>{L_CHAT_ARCHIVE}</span></a></li>
	<!-- END roomtab -->
	</ul>
	
	<div id="chat-content" class="tab-content panel-content">
		<div id="chat-conversation-container">
		<!-- BEGIN message -->
			<div id="chat-row-{message.S_ID}" class="chat-row" data-id="{message.S_ID}" data-time="{message.S_TIMESTAMP}">
				<!-- IF message.S_SHOW_AVATAR -->
					<div class="chat-row-avatar cbb-circular-avatar"><!-- IF message.S_AUTHOR_AVATAR -->{message.S_AUTHOR_AVATAR}<!-- ELSE --><span class="cbb-no-avatar"></span><!-- ENDIF --></div>
				<!-- ENDIF -->
				
			<!-- IF S_BATCH_OPTIONS -->
				<div class="ic-row-actions row-check-list">
					<input id="row-id-list-{message.S_ID}" class="cbb-checkbox row-id-list" type="checkbox" name="row_id_list[]" value="{message.S_ID}" />
					<label for="row-id-list-{message.S_ID}"></label>
				</div>
			<!-- ENDIF -->
				
				<div class="ic-row-actions">
					<!-- IF message.CAN_VIEW_WHOIS --><a href="#" data-action="whois" title="{L_WHOIS}"><i class="fa fa-signal" aria-hidden="true"></i></a>&nbsp;<!-- ENDIF -->
					<!-- IF message.CAN_MOVE --><a href="#" data-action="move" title="{L_CHAT_MOVE}"><i class="fa fa-share-square-o" aria-hidden="true"></i></a>&nbsp;<!-- ENDIF -->
					<!-- IF message.CAN_EDIT --><a href="#" data-action="edit" title="{L_EDIT}"><i class="fa fa-edit" aria-hidden="true"></i></a>&nbsp;<!-- ENDIF -->
					<!-- IF message.CAN_DELETE --><a href="#" data-action="delete" title="{L_DELETE}"><i class="fa fa-trash" aria-hidden="true"></i></a><!-- ENDIF -->
				</div>

				<div class="ic-row-title<!-- IF message.S_SHOW_AVATAR --> avatar-margin<!-- ENDIF -->">{message.S_AUTHOR_FULL} &bull; {message.S_DATE}</div>
				<div class="ic-row-text<!-- IF message.S_SHOW_AVATAR --> avatar-margin<!-- ENDIF -->">
					{message.S_TEXT}
				</div>
			</div>
		<!-- BEGINELSE -->
			<div class="cbb-message">{L_NO_MESSAGES}</div>
		<!-- END message -->
		</div>
	</div>
</div>

<!-- IF .message -->
	<div class="row">
		<!-- IF S_BATCH_OPTIONS -->
		<div class="col-md-4 col-xs-7">
			<div class="pull-left">
				<div class="chat-state-hidden js-delete-selected input-group input-group-sm">
					<select class="selectpicker" data-width="auto" name="action">
						<option value="">{L_BATCH_ACTIONS}</option>
						{S_BATCH_OPTIONS}
					</select>
					<div class="input-group-btn">
						<button type="submit" name="submit" class="btn btn-default">{L_CHAT_APPLY}</button>
					</div>
				</div>
			</div>
		</div>
		<!-- ENDIF -->
	  
		<div class="col-md-8">
			<div class="pull-right">	 
				<ul class="pagination pagination-sm hidden-xs">
				<!-- IF .pagination -->
					<!-- INCLUDE pagination.html -->
				<!-- ELSE -->
					<li class="active"><a>{PAGE_NUMBER}</a></li>	
				<!-- ENDIF -->
				</ul>
			</div>
		</div>
	</div>
	
	<!-- IF S_SELECT_SORT_DAYS -->
	<div class="controls-row">
       <div class="sorting">
			<div class="panel panel-default">
				<div class="panel-body">
                  <div class="row">
						<div class="col-md-3 col-sm-3"> 
                         <label for="st">{L_DISPLAY_MESSAGES}{L_COLON}</label>
                            <div class="control-row">
                              {S_SELECT_SORT_DAYS}
                            </div>
						</div>
	                    <div class="col-md-3 col-sm-3"> 
                          <label for="sk">{L_SORT_BY}</label>
                            <div class="control-row">
                              {S_SELECT_SORT_KEY}
                            </div>
						</div>
						<div class="col-md-3 col-sm-3"> 
                           <label for="sd">{L_SORT_BY}</label>
                            <div class="control-row">
							<div class="input-group">
                             {S_SELECT_SORT_DIR}
							 <span class="input-group-btn">
                              <button class="cbb-btn" name="sort" type="submit">{L_GO}</button>
							</span>
							</div>
						    </div>   
						</div>
                    </div>
                </div>
		    </div>
		</div>
	</div>
	<!-- ENDIF -->

<!-- ENDIF -->

</form>

<br />

<!-- INCLUDE overall_footer.html -->
