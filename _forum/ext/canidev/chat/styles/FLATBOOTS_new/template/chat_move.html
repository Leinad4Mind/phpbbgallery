<!-- INCLUDE overall_header.html -->

<form id="confirm" action="{S_CONFIRM_ACTION}" method="post">
	<div class="side-segment"><h3>{MESSAGE_TITLE}</h3></div>
	
	<div class="well">
		<div class="control-group"> 
			<label class="control-label">{L_CHAT_DEST_ROOM}{L_COLON}</label>
			<div class="controls controls-row">
				<select name="to_room_id" class="selectpicker" data-width="auto">{S_ROOM_OPTIONS}</select>
			</div> 
			<div class="space10"></div>
		</div>

		<p>{MESSAGE_TEXT}</p>
		<fieldset>
			{S_HIDDEN_FIELDS}
			<button type="submit" name="confirm" value="{L_YES}" class="btn btn-default">{L_YES}</button>
			<button type="submit" name="cancel" value="{L_NO}" class="btn btn-default">{L_NO}</button>
			{S_FORM_TOKEN}
		</fieldset>
	</div>
</form>

<!-- INCLUDE overall_footer.html -->
