<!-- INCLUDE overall_header.html -->

<!-- IF .message -->
	<div class="pagination">
		<!-- IF .pagination -->
			<!-- INCLUDE pagination.html -->
		<!-- ELSE -->
			{PAGE_NUMBER}
		<!-- ENDIF -->
	</div>
<!-- ENDIF -->

<h2>{L_CHAT_ARCHIVE}</h2>

<form method="post" action="{U_ACTION}">

<div id="chat-body" class="forabg">
<!-- IF .roomtab -->
	<ul class="chat-archive-tabs">
	<!-- BEGIN roomtab -->
		<li><a class="chat-corner-top<!-- IF roomtab.S_ACTIVE --> active<!-- ENDIF -->" href="{roomtab.U_ACTION}">{roomtab.S_TITLE}</a></li>
	<!-- END roomtab -->
	</ul>
<!-- ELSE -->
	<div id="chat-title">{L_CHAT_ARCHIVE}</div>
<!-- ENDIF -->
	
	<div id="chat-content" class="chat-corner-all">
	<!-- IF .message -->
		<div id="chat-conversation-container">
		<!-- BEGIN message -->
			<div id="chat-row-{message.S_ID}" class="chat-row">
				<!-- IF message.S_SHOW_AVATAR -->
					<div class="ic-row-avatar"><!-- IF message.S_AUTHOR_AVATAR -->{message.S_AUTHOR_AVATAR}<!-- ELSE --><div class="chat-no-avatar"></div><!-- ENDIF --></div>
				<!-- ENDIF -->
				
				<!-- IF S_BATCH_OPTIONS --><div class="ic-row-actions"><input class="row-id-list" type="checkbox" name="row_id_list[]" value="{message.S_ID}" /></div><!-- ENDIF -->
				
				<div class="ic-row-actions">
					<!-- IF message.CAN_VIEW_WHOIS --><a href="#!whois/{message.S_ID}" title="{L_WHOIS}"><span class="chat-icon-signal"></span></a>&nbsp;<!-- ENDIF -->
					<!-- IF message.CAN_MOVE --><a href="#!move/{message.S_ID}" title="{L_CHAT_MOVE}"><span class="chat-icon-move"></span></a>&nbsp;<!-- ENDIF -->
					<!-- IF message.CAN_EDIT --><a href="#!edit/{message.S_ID}" title="{L_EDIT}"><span class="chat-icon-edit"></span></a>&nbsp;<!-- ENDIF -->
					<!-- IF message.CAN_DELETE --><a href="#!delete/{message.S_ID}" title="{L_DELETE}"><span class="chat-icon-trash"></span></a><!-- ENDIF -->
				</div>

				<div class="ic-row-title<!-- IF message.S_SHOW_AVATAR --> avatar-margin<!-- ENDIF -->">{message.S_AUTHOR_FULL} &bull; {message.S_DATE}</div>
				<div class="ic-row-text<!-- IF message.S_SHOW_AVATAR --> avatar-margin<!-- ENDIF -->">
					{message.S_TEXT}
				</div>
			</div>
		<!-- END message -->
		</div>
	<!-- ELSE -->
		{L_NO_MESSAGES}
	<!-- ENDIF -->
	</div>
</div>

<!-- IF .message -->
	<!-- IF S_BATCH_OPTIONS -->
	<div class="chat-state-hidden js-delete-selected" style="float:left;">
		<select class="chat-inputbox" name="action">
			<option value="">{L_BATCH_ACTIONS}</option>
			{S_BATCH_OPTIONS}
		</select>
		<input type="submit" name="submit" class="chat-button ic-inline" value="{L_CHAT_APPLY}" />
	</div>
	<!-- ENDIF -->

	<div class="pagination">
		<!-- IF .pagination -->
			<!-- INCLUDE pagination.html -->
		<!-- ELSE -->
			{PAGE_NUMBER}
		<!-- ENDIF -->
	</div>

	<br class="clear" />

	<!-- IF S_SELECT_SORT_DAYS -->
	<br /><hr />
	<fieldset class="display-options">
		<!-- IF PREVIOUS_PAGE --><a href="{PREVIOUS_PAGE}" class="left-box {S_CONTENT_FLOW_BEGIN}">{L_PREVIOUS}</a><!-- ENDIF -->
		<!-- IF NEXT_PAGE --><a href="{NEXT_PAGE}" class="right-box {S_CONTENT_FLOW_END}">{L_NEXT}</a><!-- ENDIF -->
	<!-- IF not S_IS_BOT -->
		<label>{L_DISPLAY_MESSAGES}{L_COLON} {S_SELECT_SORT_DAYS}</label>
		<label>{L_SORT_BY}{L_COLON} {S_SELECT_SORT_KEY}</label>
		<label>{S_SELECT_SORT_DIR} <input type="submit" name="sort" value="{L_GO}" class="chat-button ic-inline" /></label>
	<!-- ENDIF -->
	</fieldset>
	
	<!-- ENDIF -->
<!-- ENDIF -->

</form>

<div id="ic-data-container" style="display:none;"></div>

<br />

<!-- INCLUDE overall_footer.html -->
