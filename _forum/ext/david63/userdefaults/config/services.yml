services:
    david63.userdefaults.settings_policy:
        class: david63\userdefaults\core\settings_policy
        public: false

    david63.userdefaults.listener:
        class: david63\userdefaults\event\listener
        arguments:
            - '@config'
            - '@david63.userdefaults.settings_policy'
        public: false
        tags:
            - { name: event.listener }

    david63.userdefaults.admin.controller:
        class: david63\userdefaults\controller\admin_controller
        arguments:
            - '@config'
            - '@request'
            - '@template'
            - '@user'
            - '@log'
            - '@language'
            - '@david63.userdefaults.settings_policy'
        public: true
