imports:
    - { resource: tables.yml }

services:
    oxpus.notes.controller:
        class: oxpus\notes\controller\main
        public: true
        arguments:
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@auth'
            - '@request'
            - '@template'
            - '@user'
            - '@language'
            - '%oxpus.notes.table%'
    oxpus.notes.listener:
        class: oxpus\notes\event\main_listener
        public: true
        arguments:
            - '@dbal.conn'
            - '@controller.helper'
            - '@auth'
            - '@template'
            - '@user'
            - '@language'
            - '%oxpus.notes.table%'
        tags:
            - { name: event.listener }
