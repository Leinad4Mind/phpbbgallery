name: phpBB Gallery

on:
  push:
    paths:
      - '_forum/ext/phpbbgallery/**'
      - '_forum/phpbb/**'
      - '_forum/vendor/**'
      - '.github/workflows/phpbbgallery.yml'
  pull_request:
    paths:
      - '_forum/ext/phpbbgallery/**'
      - '_forum/phpbb/**'
      - '_forum/vendor/**'
      - '.github/workflows/phpbbgallery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'phpbbgallery-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  phpunit:
    name: 'PHP ${{ matrix.php }} / ${{ matrix.component }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        component: [core, acpcleanup, acpimport, bbpointsimages, bbtagsimages, contest, exif, export, favorite, feed, imagerevisions, remotestorage, tiff]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: fileinfo, gd, imagick, mbstring, zip
          coverage: none
          tools: phpunit:10.5.64
        env:
          fail-fast: true

      - name: Run PHPUnit
        run: phpunit --configuration '_forum/ext/phpbbgallery/${{ matrix.component }}/phpunit.xml.dist'

  epv:
    name: 'EPV / ${{ matrix.component }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [core, acpcleanup, acpimport, bbpointsimages, bbtagsimages, contest, exif, export, favorite, feed, imagerevisions, remotestorage, tiff]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out phpBB EPV
        uses: actions/checkout@v6
        with:
          repository: phpbb/epv
          ref: cc230d4a0253d7f6dc0d0c526c2db84ccd831f35
          path: .epv

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: imagick
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true

      - name: Install EPV dependencies
        run: composer install --working-dir=.epv --no-interaction --no-progress --prefer-dist

      - name: Build release package
        shell: bash
        run: |
          release_root="${RUNNER_TEMP}/phpbbgallery-release"
          package_root="${RUNNER_TEMP}/phpbbgallery-${{ matrix.component }}"
          mkdir -p "${release_root}" "${package_root}/phpbbgallery"
          git archive --format=tar HEAD:_forum/ext/phpbbgallery | tar -xf - -C "${release_root}"
          cp -R "${release_root}/${{ matrix.component }}" "${package_root}/phpbbgallery/${{ matrix.component }}"
          echo "EPV_PACKAGE_ROOT=${package_root}" >> "${GITHUB_ENV}"

      - name: Run Extension Pre Validator
        shell: bash
        run: |
          epv_output="${RUNNER_TEMP}/epv-${{ matrix.component }}.log"
          php .epv/src/EPV.php --no-ansi run --dir="${EPV_PACKAGE_ROOT}" | tee "${epv_output}"
          if grep -q 'Validation: FAILED' "${epv_output}"; then
            exit 1
          fi
          grep -q 'No issues found' "${epv_output}"

  functional:
    name: Functional lifecycle / phpBB 3.3.x / ${{ matrix.database_label }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite3
            database_label: SQLite
            database_image: mariadb@sha256:c6b7cffe4ad6623509a8edefd6418f6d33aa4b9bc81d2fadcf0d354e7c94a73d
          - database: mysql
            database_label: MySQL 8.4.9 LTS
            database_image: mysql@sha256:14690274f4967ba207939c97dd79a8d6604f1d532218ea6be69c0001ddd2d45f
          - database: mariadb
            database_label: MariaDB 11.4.12 LTS
            database_image: mariadb@sha256:c6b7cffe4ad6623509a8edefd6418f6d33aa4b9bc81d2fadcf0d354e7c94a73d
    env:
      PHPBBGALLERY_FUNCTIONAL_CONFIG: .github/phpunit-${{ matrix.database }}-github.xml

    services:
      database:
        image: ${{ matrix.database_image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: phpbb_tests
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
          MARIADB_DATABASE: phpbb_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd='mysqladmin ping --silent'
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out phpBB
        uses: actions/checkout@v6
        with:
          repository: phpbb/phpbb
          ref: 3.3.x
          path: .functional/phpBB3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, dom, gd, imagick, mbstring, mysqli, pdo_mysql, pdo_sqlite, sqlite3, ssh2, zip
          coverage: none
        env:
          fail-fast: true

      - name: Install Gallery release packages in phpBB
        shell: bash
        run: |
          package_root="${RUNNER_TEMP}/phpbbgallery-functional-packages"
          gallery_root='.functional/phpBB3/phpBB/ext/phpbbgallery'
          sitesplat_root='.functional/phpBB3/phpBB/ext/sitesplat'

          php _forum/ext/phpbbgallery/build_release_packages.php --output="$package_root" --ref=HEAD
          mapfile -t archives < <(find "$package_root" -maxdepth 1 -type f -name '*.zip' -print | sort)
          if (( ${#archives[@]} != 13 )); then
            echo "Expected 13 Gallery release packages, found ${#archives[@]}." >&2
            exit 1
          fi

          mkdir -p '.functional/phpBB3/phpBB/ext' "$sitesplat_root"
          for archive in "${archives[@]}"; do
            unzip -q "$archive" -d '.functional/phpBB3/phpBB/ext'
          done

          if find "$gallery_root" -path '*/tests' -print -quit | grep -q . ||
            find "$gallery_root" -name 'phpunit.xml.dist' -print -quit | grep -q .; then
            echo 'A release package contains development-only test files.' >&2
            exit 1
          fi

          # Functional test cases are development-only and are copied after the
          # production packages have been extracted and verified.
          for component in core acpcleanup acpimport bbpointsimages bbtagsimages contest exif export favorite feed imagerevisions remotestorage tiff; do
            functional_tests="_forum/ext/phpbbgallery/$component/tests/functional"
            if [[ -d "$functional_tests" ]]; then
              mkdir -p "$gallery_root/$component/tests/functional"
              cp -R "$functional_tests/." "$gallery_root/$component/tests/functional/"
            fi
          done
          cp -R '_forum/ext/sitesplat/BBCore' "$sitesplat_root/BBCore"
          cp -R '_forum/ext/sitesplat/bbpoints' "$sitesplat_root/bbpoints"
          cp -R '_forum/ext/sitesplat/bbtags' "$sitesplat_root/bbtags"

      - name: Prepare phpBB functional environment
        shell: bash
        working-directory: .functional/phpBB3
        env:
          DB: ${{ matrix.database }}
          PHP_VERSION: '8.1'
          NOTESTS: '0'
        run: .github/setup-phpbb.sh "$DB" "$PHP_VERSION" "$NOTESTS"

      - name: Prepare MySQL-compatible functional database
        if: matrix.database != 'sqlite3'
        shell: bash
        working-directory: .functional/phpBB3
        env:
          DB: ${{ matrix.database }}
        run: .github/setup-database.sh $DB 0

      - name: Run Gallery lifecycle test
        shell: bash
        working-directory: .functional/phpBB3
        run: >-
          phpBB/vendor/bin/phpunit
          --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG
          --bootstrap ./tests/bootstrap.php
          phpBB/ext/phpbbgallery/core/tests/functional/gallery_lifecycle.php

      - name: Run Gallery BBTags Images workflow test
        shell: bash
        working-directory: .functional/phpBB3
        run: >-
          phpBB/vendor/bin/phpunit
          --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG
          --bootstrap ./tests/bootstrap.php
          phpBB/ext/phpbbgallery/bbtagsimages/tests/functional/bbtagsimages_workflow.php

      - name: Run Gallery BBPoints Images workflow test
        shell: bash
        working-directory: .functional/phpBB3
        run: |
          output_file="${RUNNER_TEMP}/bbpointsimages-functional.log"
          set +e
          phpBB/vendor/bin/phpunit \
            --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG \
            --bootstrap ./tests/bootstrap.php \
            phpBB/ext/phpbbgallery/bbpointsimages/tests/functional/bbpointsimages_workflow.php \
            2>&1 | tee "${output_file}"
          status=${PIPESTATUS[0]}
          set -e

          if (( status != 0 )) && grep -Fq 'Output found before DOCTYPE specification.' "${output_file}"; then
            echo 'The phpBB functional web server returned an empty initial response; retrying once.'
            phpBB/vendor/bin/phpunit \
              --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG \
              --bootstrap ./tests/bootstrap.php \
              phpBB/ext/phpbbgallery/bbpointsimages/tests/functional/bbpointsimages_workflow.php
          else
            exit "${status}"
          fi

      - name: Run Gallery Contest workflow test
        shell: bash
        working-directory: .functional/phpBB3
        run: >-
          phpBB/vendor/bin/phpunit
          --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG
          --bootstrap ./tests/bootstrap.php
          phpBB/ext/phpbbgallery/contest/tests/functional/contest_workflow.php

      - name: Run Gallery Image Revisions workflow test
        shell: bash
        working-directory: .functional/phpBB3
        run: >-
          phpBB/vendor/bin/phpunit
          --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG
          --bootstrap ./tests/bootstrap.php
          phpBB/ext/phpbbgallery/imagerevisions/tests/functional/imagerevisions_workflow.php

      - name: Start MinIO storage service
        shell: bash
        run: |
          docker run --detach --name phpbbgallery-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=phpbbgallery \
            --env MINIO_ROOT_PASSWORD=phpbbgallery-functional-secret \
            quay.io/minio/minio@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb server /data

          for attempt in {1..30}; do
            if curl --fail --silent 'http://127.0.0.1:9000/minio/health/live' > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent 'http://127.0.0.1:9000/minio/health/live' > /dev/null
          AWS_ACCESS_KEY_ID=phpbbgallery \
          AWS_SECRET_ACCESS_KEY=phpbbgallery-functional-secret \
          AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url 'http://127.0.0.1:9000' s3 mb 's3://phpbbgallery-functional'

      - name: Start Azurite Blob service
        shell: bash
        run: |
          docker run --detach --name phpbbgallery-azurite \
            --publish 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite@sha256:37493d0f2e764467421ffe16eb3caa39277e5fa7f6adea18eb5bbfb3c5247f98 \
            azurite-blob --blobHost 0.0.0.0

          for attempt in {1..30}; do
            if curl --silent --output /dev/null 'http://127.0.0.1:10000/devstoreaccount1'; then
              break
            fi
            sleep 1
          done
          curl --silent --output /dev/null 'http://127.0.0.1:10000/devstoreaccount1'

      - name: Start SFTP storage service
        shell: bash
        run: |
          docker run --detach --name phpbbgallery-sftp \
            --publish 2222:22 \
            atmoz/sftp@sha256:81fa92512bf8ead4849f33c1c153907b86d32d77704d1c62a9c70b4316ae9e50 \
            gallery:gallery-functional-secret:1001:1001:storage

          for attempt in {1..30}; do
            if ssh-keyscan -p 2222 127.0.0.1 2>/dev/null | grep -q .; then
              break
            fi
            sleep 1
          done
          fingerprint=$(php -r '$session = ssh2_connect($argv[1], (int) $argv[2]); echo strtolower(ssh2_fingerprint($session, SSH2_FINGERPRINT_SHA1 | SSH2_FINGERPRINT_HEX));' 127.0.0.1 2222)
          test ${#fingerprint} -eq 40
          echo PHPBBGALLERY_SFTP_HOST_FINGERPRINT=${fingerprint} >> ${GITHUB_ENV}

      - name: Run Gallery Remote Storage MinIO, Azurite and SFTP workflow test
        shell: bash
        working-directory: .functional/phpBB3
        run: >-
          phpBB/vendor/bin/phpunit
          --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG
          --bootstrap ./tests/bootstrap.php
          phpBB/ext/phpbbgallery/remotestorage/tests/functional/remotestorage_workflow.php

      - name: Run Gallery Export workflow test
        shell: bash
        working-directory: .functional/phpBB3
        run: >-
          phpBB/vendor/bin/phpunit
          --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG
          --bootstrap ./tests/bootstrap.php
          phpBB/ext/phpbbgallery/export/tests/functional/export_workflow.php

      - name: Run Gallery addon reconciliation workflow test
        shell: bash
        working-directory: .functional/phpBB3
        run: >-
          phpBB/vendor/bin/phpunit
          --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG
          --bootstrap ./tests/bootstrap.php
          phpBB/ext/phpbbgallery/core/tests/functional/addon_reconciliation.php

      - name: Run Gallery recoverable deletion workflow test
        shell: bash
        working-directory: .functional/phpBB3
        run: >-
          phpBB/vendor/bin/phpunit
          --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG
          --bootstrap ./tests/bootstrap.php
          phpBB/ext/phpbbgallery/core/tests/functional/image_deletion_workflow.php

      - name: Run complete packaged component lifecycle test
        shell: bash
        working-directory: .functional/phpBB3
        run: >-
          phpBB/vendor/bin/phpunit
          --configuration $PHPBBGALLERY_FUNCTIONAL_CONFIG
          --bootstrap ./tests/bootstrap.php
          phpBB/ext/phpbbgallery/core/tests/functional/package_lifecycle.php

  quality:
    name: Lint and coding standard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate component manifests
        run: |
          for component in core acpcleanup acpimport bbpointsimages bbtagsimages contest exif export favorite feed imagerevisions remotestorage tiff; do
            composer validate --no-check-publish "_forum/ext/phpbbgallery/${component}/composer.json"
          done

      - name: Lint PHP files
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find _forum/ext/phpbbgallery -type f -name '*.php' -print0)

      - name: Check production coding standard
        run: >-
          vendor/bin/phpcs
          --standard=vendor/senky/phpbb-coding-standard/ruleset.xml
          --extensions=php
          --ignore='*/tests/*'
          _forum/ext/phpbbgallery

  packages:
    name: Release packages
    needs: [phpunit, epv, functional, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip
          coverage: none
        env:
          fail-fast: true

      - name: Build and verify release packages
        run: >-
          php _forum/ext/phpbbgallery/build_release_packages.php
          --output=build/phpbbgallery
          --ref=HEAD

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: phpbbgallery-release-packages
          path: |
            build/phpbbgallery/*.zip
            build/phpbbgallery/SHA256SUMS
            build/phpbbgallery/release-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
