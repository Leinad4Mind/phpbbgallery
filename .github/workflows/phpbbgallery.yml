name: phpBB Gallery

on:
  push:
    paths:
      - '_forum/ext/phpbbgallery/**'
      - '_forum/phpbb/**'
      - '_forum/vendor/**'
      - '.github/workflows/phpbbgallery.yml'
  pull_request:
    paths:
      - '_forum/ext/phpbbgallery/**'
      - '_forum/phpbb/**'
      - '_forum/vendor/**'
      - '.github/workflows/phpbbgallery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'phpbbgallery-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  phpunit:
    name: 'PHP ${{ matrix.php }} / ${{ matrix.component }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.4', '8.5']
        component: [core, acpcleanup, acpimport, exif]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: fileinfo, gd, mbstring, zip
          coverage: none
          tools: phpunit:10.5.64
        env:
          fail-fast: true

      - name: Run PHPUnit
        run: phpunit --configuration '_forum/ext/phpbbgallery/${{ matrix.component }}/phpunit.xml.dist'

  quality:
    name: Lint and coding standard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate component manifests
        run: |
          for component in core acpcleanup acpimport exif; do
            composer validate --no-check-publish "_forum/ext/phpbbgallery/${component}/composer.json"
          done

      - name: Lint PHP files
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find _forum/ext/phpbbgallery -type f -name '*.php' -print0)

      - name: Check production coding standard
        run: >-
          vendor/bin/phpcs
          --standard=vendor/senky/phpbb-coding-standard/ruleset.xml
          --extensions=php
          --ignore='*/tests/*'
          _forum/ext/phpbbgallery
